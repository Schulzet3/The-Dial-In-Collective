# Existing Git-connected application; approved source is development/backend-foundation.
# Production uses Supabase Auth/admission/RLS; Netlify team SSO protects nonproduction.
# Publish only a separately authorized tested release and verify its actual deploy.
# Full Node tests run against the exact release source in the mandatory GitHub
# preflight; do not rerun the same expensive suite during one-use publication.
[build]
  command = "npm run build:cloud"
  publish = "dist"
  # Ignore automatic production builds unless this is a deliberately marked,
  # fully tested, one-use owner-approved release; the owner monitors credits.
  # No branch/deploy preview publication without an explicit future approval.
  # Runtime/script errors must skip too: only the exact allow token AND exit42
  # become Netlify exit1. The inline adapter also covers a missing helper file.
  ignore = "DIC_IGNORE_STATUS=0; DIC_IGNORE_RESULT=$(node ./scripts/netlify/should-ignore-build.mjs) || DIC_IGNORE_STATUS=$?; if [ \"$DIC_IGNORE_STATUS\" -eq 42 ] && [ \"$DIC_IGNORE_RESULT\" = DIC_BUILD_ALLOWED ]; then exit 1; fi; exit 0"
[build.environment]
  NODE_VERSION = "22"
# Build coordinates are SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY only.
# HTTPS callbacks, SMTP and the first genuine invited member passed their recorded tests.
# Keep confirmed email, beta admission, RLS and admin checks; see docs/CURRENT_STATUS.md.

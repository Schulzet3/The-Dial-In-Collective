# Existing private Git-connected Netlify owner preview. Publish tested changes
# from development/backend-foundation; keep Netlify SSO required.
# Netlify deployment status must be checked after GitHub CI passes.
[build]
  command = "npm test && npm run build:cloud"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
# Add only SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY to build environment.
# Exact HTTPS callbacks, email delivery and intended owner admission must be
# configured and tested before sending a login link. Do not invite beta users yet.

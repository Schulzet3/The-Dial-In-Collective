name: DIC Issue33 R92 original603 Alta 427-428 exact selected
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r92-alta-427-428.yml
      - scripts/audit/issue33-r92-alta-427-428-check.mjs
      - tests/coffee-issue33-r92-alta-427-428.test.mjs
      - docs/workstreams/ops-issue33-r92-alta-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r92-alta-427-428.yml
      - scripts/audit/issue33-r92-alta-427-428-check.mjs
      - tests/coffee-issue33-r92-alta-427-428.test.mjs
permissions:
  contents: read
jobs:
  current-selected-alta:
    name: original603-427-428-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected current and hostile source contracts
        run: node --test tests/coffee-issue33-r92-alta-427-428.test.mjs
      - name: Guarded fresh official HTTPS actual parser Add Coffee Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '427,428'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r92-alta
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact selected identity current fields raw SHA proof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r92-alta
          DIC_ISSUE33_R92_VERIFY: '1'
        run: node scripts/audit/issue33-r92-alta-427-428-check.mjs
      - name: Short lived public source and proof artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r92-alta-427-428
          path: /tmp/dic33-r92-alta/
          retention-days: 1
          if-no-files-found: warn

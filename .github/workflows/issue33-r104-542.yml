name: DIC Issue33 R104 original603 selected 542
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r104-542.yml
      - scripts/audit/issue33-r104-542-check.mjs
      - tests/coffee-issue33-r104-542.test.mjs
      - docs/workstreams/ops-issue33-r104-542-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r104-542.yml
      - scripts/audit/issue33-r104-542-check.mjs
      - tests/coffee-issue33-r104-542.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    name: original603-542-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Source-bound positive and hostile selected coffee regressions
        run: node --test tests/coffee-issue33-r104-542.test.mjs
      - name: Guarded public HTTPS selected coffee and actual parser/Add Coffee/Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '542'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r104
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict current selected-source evidence afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r104
          DIC_ISSUE33_R104_VERIFY: '1'
        run: node scripts/audit/issue33-r104-542-check.mjs
      - name: One-day current source evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r104-542-selected
          path: /tmp/dic33-r104/
          retention-days: 1
          if-no-files-found: warn

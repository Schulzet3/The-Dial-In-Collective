name: DIC Issue33 R123 original current selected 573
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r123-573.yml
      - scripts/audit/issue33-r123-573-check.mjs
      - tests/coffee-issue33-r123-573.test.mjs
      - docs/workstreams/ops-issue33-r123-573-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r123-573.yml
      - scripts/audit/issue33-r123-573-check.mjs
      - tests/coffee-issue33-r123-573.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Current selected positive and adversarial negatives
        run: node --test tests/coffee-issue33-r123-573.test.mjs
      - name: Guarded exact selected public HTTPS actual parser and Add Coffee
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '573'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r123
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict current source hash and semantic afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r123
          DIC_ISSUE33_R123_VERIFY: '1'
        run: node scripts/audit/issue33-r123-573-check.mjs
      - name: Preserve bounded raw official source for independent SHA verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r123-selected-573
          path: /tmp/dic33-r123/
          retention-days: 1
          if-no-files-found: warn

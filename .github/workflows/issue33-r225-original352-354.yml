name: DIC Issue33 R225 original352-354 exact current official sources
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r225-original352-354.yml
      - tests/coffee-issue33-r225-original352-354.test.mjs
      - scripts/audit/issue33-r225-original352-354-check.mjs
      - docs/workstreams/ops-issue33-r225-352-354-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-selected-description-sensory.mjs
      - src/server/coffee-selected-hero-notes-conflict.mjs
      - src/server/coffee-selected-product-hero.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-selected-offer-h2.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r225-original352-354.yml
      - tests/coffee-issue33-r225-original352-354.test.mjs
      - scripts/audit/issue33-r225-original352-354-check.mjs
      - docs/workstreams/ops-issue33-r225-352-354-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-selected-description-sensory.mjs
      - src/server/coffee-selected-hero-notes-conflict.mjs
      - src/server/coffee-selected-product-hero.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-selected-offer-h2.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected current primary positive and hostile contract
        run: node --test tests/coffee-issue33-r225-original352-354.test.mjs
      - name: Guarded live official original603 source and actual parser/Add Coffee
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '352,353,354'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r225
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify current raw SHA, selected identity and conservative facts
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r225
          DIC_R225_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r225-original352-354-check.mjs
      - name: Preserve selected primary raw evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r225-original352-354
          path: /tmp/dic33-r225/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R295 selected original554
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r295-original554.test.mjs
      - scripts/audit/issue33-r295-original554-check.mjs
      - .github/workflows/issue33-r295-original554.yml
      - docs/workstreams/ops-issue33-r295-original554-20261118.md
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r295-original554.test.mjs
      - scripts/audit/issue33-r295-original554-check.mjs
      - .github/workflows/issue33-r295-original554.yml
      - docs/workstreams/ops-issue33-r295-original554-20261118.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Actual parser and hostile selected-product regressions
        run: node --test tests/coffee-issue33-r295-original554.test.mjs
      - name: Guarded current exact selected official public HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '554'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r295
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict source bytes product identity and honest missing roast
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r295
          DIC_R295_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R295_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r295-original554-check.mjs
      - name: Archive one-day public selected-source receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r295-original554
          path: /tmp/dic33-r295/
          retention-days: 1
          if-no-files-found: warn

name: DIC approval, implementation and continuity contract
# This runs on EVERY application-branch push, INCLUDING docs-only and issue
# reconciliation commits that were skipped by earlier path-filtered workflows.
# It does not publish, access credentials, modify providers or spend Netlify credits.
on:
  push:
    branches:
      - development/backend-foundation
      - 'release-candidates/**'
  pull_request:
    branches:
      - development/backend-foundation
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: dic-approval-continuity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Reject accidentally tracked private keys, credential files and high-confidence tokens
        run: node scripts/audit/security-inventory.mjs
      - name: Protect the single mandatory live preflight entrypoint
        run: node scripts/audit/preflight-contract.mjs
      - name: Fail on missing owner decisions or approved UI/source tests
        run: node scripts/audit/approval-coverage.mjs
      - name: Validate queue schema and intake in one nonpublishing check
        # --enforce-intake checks schema before exact-source coverage; the
        # separate --validate and nonblocking --status invocations duplicated
        # work on every push. On-demand queue status remains available.
        run: node scripts/release/release-queue.mjs --enforce-intake
      - name: Verify every READY item against live recorded Actions and source/test blobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/ready-evidence-gate.mjs
      - name: Audit EVERY pushed commit, including docs-only and earlier commits in batch
        env:
          DIC_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          DIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/audit/verify-commit-checkpoint.mjs

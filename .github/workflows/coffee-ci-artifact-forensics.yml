name: DIC Candidate 12 exact change review
on:
  push:
    branches:
      - work/issue33-candidate11-live-diagnostics-20261024
permissions:
  contents: read
  actions: read
jobs:
  inspect-candidate12-changes:
    if: github.repository == 'Schulzet3/The-Dial-In-Collective'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reader and authenticated failed-run config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dic-candidate12-change-review"
          sha256sum --check <<'DIC_REVIEW_PINS'
          5611a19f71bf98712c6f8219c697dfe0d70f355548470a7dc2527776df7e3e9d  scripts/audit/coffee-reviewed-change-forensics.py
          7d0d35a13c49853c915126404bbd192ea2e505496940b1bef2aa88a745995780  docs/audits/extractor-candidate12-forensics-input-40073531611-1.json
          DIC_REVIEW_PINS
          {
            /usr/bin/python3 --version
            gh --version
          } > "$RUNNER_TEMP/dic-candidate12-change-review/versions.log"
      - name: Run all nine existing forensic failure controls
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B scripts/audit/coffee-reviewed-change-forensics.py --self-test 2>&1 | tee "$RUNNER_TEMP/dic-candidate12-change-review/controls.log"
      - name: Read only the authenticated failed Candidate 12 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B scripts/audit/coffee-reviewed-change-forensics.py \
            --config docs/audits/extractor-candidate12-forensics-input-40073531611-1.json \
            --config-sha256 7d0d35a13c49853c915126404bbd192ea2e505496940b1bef2aa88a745995780 \
            2>&1 | tee "$RUNNER_TEMP/dic-candidate12-change-review/review.jsonl"
      - name: Retain bounded review evidence without archived source captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic-candidate12-change-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dic-candidate12-change-review/
          if-no-files-found: error
          retention-days: 90

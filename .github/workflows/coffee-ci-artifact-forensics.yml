name: DIC Candidate 12 original source contexts
on:
  push:
    branches:
      - work/issue33-candidate11-live-diagnostics-20261024
permissions:
  contents: read
  actions: read
jobs:
  inspect-candidate12-changes:
    if: github.repository == 'Schulzet3/The-Dial-In-Collective'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact reader and authenticated failed-run config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dic-candidate12-change-review"
          sha256sum --check <<'DIC_REVIEW_PINS'
          08a3e4d877e5d8d4f3a925f71a9b85754b1b2c2d979b671278072f1f5f219cad  scripts/audit/coffee-reviewed-change-forensics.py
          860c99b8f79fa5921d146f3b2c3f5c907584dabff34e29ed2d488a9e43de530a  docs/audits/extractor-candidate12-forensics-input-40070270334-1.json
          DIC_REVIEW_PINS
          {
            /usr/bin/python3 --version
            gh --version
          } > "$RUNNER_TEMP/dic-candidate12-change-review/versions.log"
      - name: Run existing and targeted-context failure controls
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B scripts/audit/coffee-reviewed-change-forensics.py --self-test 2>&1 | tee "$RUNNER_TEMP/dic-candidate12-change-review/controls.log"
      - name: Read bounded unchanged original source contexts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B scripts/audit/coffee-reviewed-change-forensics.py \
            --config docs/audits/extractor-candidate12-forensics-input-40070270334-1.json \
            --config-sha256 860c99b8f79fa5921d146f3b2c3f5c907584dabff34e29ed2d488a9e43de530a \
            --targeted-contexts-only \
            2>&1 | tee "$RUNNER_TEMP/dic-candidate12-change-review/review.jsonl"
      - name: Retain bounded review evidence without archived source captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic-candidate12-original-contexts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dic-candidate12-change-review/
          if-no-files-found: error
          retention-days: 90

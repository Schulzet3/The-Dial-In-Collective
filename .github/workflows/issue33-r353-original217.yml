name: DIC Issue33 R353 original217 selected Mbingo Dambi Natural
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r353-original217.yml
      - scripts/audit/issue33-r353-original217-check.mjs
      - tests/coffee-issue33-r353-original217.test.mjs
      - docs/workstreams/ops-issue33-r353-original217-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r353-original217.yml
      - scripts/audit/issue33-r353-original217-check.mjs
      - tests/coffee-issue33-r353-original217.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused literal selected and hostile regressions
        run: node --test tests/coffee-issue33-r353-original217.test.mjs
      - name: One registered #217 first-party HTTPS source
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '217'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r353
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict actual raw HTML H1 current parser and no-save UI
        if: always()
        env:
          DIC_R353_VERIFY: '1'
          DIC_R353_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R353_EVENT_SHA: ${{ github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r353
        run: node scripts/audit/issue33-r353-original217-check.mjs
      - name: Retain bounded public evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r353-original217
          path: /tmp/dic33-r353/
          retention-days: 1
          if-no-files-found: warn

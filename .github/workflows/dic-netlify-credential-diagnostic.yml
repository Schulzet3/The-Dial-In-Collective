name: DIC read-only Netlify credential availability probe
# Single initial run from this file addition. Does not publish, mutate
# providers, expose tokens, or claim readiness; only status/HTTP code.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dic-netlify-credential-diagnostic.yml
permissions:
  contents: read
jobs:
  credential-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check existing secret names and read-only Netlify site API
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN_CANDIDATE: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_API_TOKEN_CANDIDATE: ${{ secrets.NETLIFY_API_TOKEN }}
          NETLIFY_TOKEN_CANDIDATE: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_ACCESS_TOKEN_CANDIDATE: ${{ secrets.NETLIFY_ACCESS_TOKEN }}
        run: |
          set +x
          token=''
          if [ -n "$NETLIFY_AUTH_TOKEN_CANDIDATE" ]; then token="$NETLIFY_AUTH_TOKEN_CANDIDATE"
          elif [ -n "$NETLIFY_API_TOKEN_CANDIDATE" ]; then token="$NETLIFY_API_TOKEN_CANDIDATE"
          elif [ -n "$NETLIFY_TOKEN_CANDIDATE" ]; then token="$NETLIFY_TOKEN_CANDIDATE"
          elif [ -n "$NETLIFY_ACCESS_TOKEN_CANDIDATE" ]; then token="$NETLIFY_ACCESS_TOKEN_CANDIDATE"
          fi
          if [ -z "$token" ]; then
            echo 'DIC_NETLIFY_EXISTING_CREDENTIAL=ABSENT_FOR_FOUR_KNOWN_SECRET_NAMES'
            echo 'DIC_NETLIFY_API_READ=NOT_ATTEMPTED'
            exit 0
          fi
          echo 'DIC_NETLIFY_EXISTING_CREDENTIAL=PRESENT'
          code=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $token" 'https://api.netlify.com/api/v1/sites/153277f2-e19e-4862-b9a6-f2e18ccde271') || code='TRANSPORT_ERROR'
          echo "DIC_NETLIFY_API_READ_HTTP_STATUS=$code"
          # Output is status code only; NEVER output, upload or store token/body.

name: DIC Issue33 R222 original346 selected regional-context guard and actual source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r222-original346.yml
      - tests/coffee-issue33-r222-original346.test.mjs
      - scripts/audit/issue33-r222-original346-check.mjs
      - docs/workstreams/ops-issue33-r222-346-20261115.md
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-selected-description-sensory.mjs
      - src/server/coffee-direct-product-prose.mjs
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-selected-offer-h2.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
      - tests/coffee-issue33-r217-workflow-dependencies.test.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r222-original346.yml
      - tests/coffee-issue33-r222-original346.test.mjs
      - scripts/audit/issue33-r222-original346-check.mjs
      - docs/workstreams/ops-issue33-r222-346-20261115.md
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-selected-description-sensory.mjs
      - src/server/coffee-direct-product-prose.mjs
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-selected-offer-h2.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
      - tests/coffee-issue33-r217-workflow-dependencies.test.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and hostile Below Zero selected source contracts
        run: node --test tests/coffee-issue33-r222-original346.test.mjs
      - name: Verify source event dependencies
        run: node --test tests/coffee-issue33-r217-workflow-dependencies.test.mjs
      - name: Guarded exact official source and Add Coffee exercise
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '346'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r222
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent raw hash and actual parser/source afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r222
          DIC_R222_EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r222-original346-check.mjs
      - name: Retain bounded public raw source evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r222-original346
          path: /tmp/dic33-r222/
          retention-days: 1
          if-no-files-found: warn

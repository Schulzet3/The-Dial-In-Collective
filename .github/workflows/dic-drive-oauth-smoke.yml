name: DIC Drive OAuth courier (owner-requested disposable proof)
# DRAFT until reviewed and explicitly integrated into operations main.
# ChatGPT creates a source-bound docs request after owner inserts encrypted
# GitHub Actions secrets; owner NEVER has to press Run workflow.
on:
  push:
    branches:
      - main
    paths:
      - docs/DIC_DRIVE_OAUTH_SMOKE_REQUEST.json
permissions:
  contents: read
concurrency:
  group: dic-drive-oauth-disposable-smoke
  cancel-in-progress: false
jobs:
  prove-google-drive:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirm focused OAuth courier source tests
        run: node --test tests/drive-courier*.test.mjs tests/verify-drive-oauth.test.mjs
      - name: Verify authenticated folder write in actual GitHub runner
        env:
          DIC_DRIVE_CLIENT_ID: ${{ secrets.DIC_DRIVE_CLIENT_ID }}
          DIC_DRIVE_CLIENT_SECRET: ${{ secrets.DIC_DRIVE_CLIENT_SECRET }}
          DIC_DRIVE_REFRESH_TOKEN: ${{ secrets.DIC_DRIVE_REFRESH_TOKEN }}
        run: node scripts/backups/drive-oauth-smoke.mjs

name: DIC private issue33 source snapshot
on:
  push:
    branches:
      - work/issue33-source-snapshot-20261026
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          git archive --format=tar --output=dic-issue33-source.tar HEAD
          gzip -n dic-issue33-source.tar
          sha256sum dic-issue33-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dic-issue33-private-source-snapshot
          path: dic-issue33-source.tar.gz
          retention-days: 1
          if-no-files-found: error

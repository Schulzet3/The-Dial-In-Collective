name: DIC Issue33 R323 original603 #99 direct selected Swiss Water source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r323-original99.yml
      - scripts/audit/issue33-r323-original99-check.mjs
      - tests/coffee-issue33-r323-original99.test.mjs
      - docs/workstreams/ops-issue33-r323-original99-20261119.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r323-original99.yml
      - scripts/audit/issue33-r323-original99-check.mjs
      - tests/coffee-issue33-r323-original99.test.mjs
      - docs/workstreams/ops-issue33-r323-original99-20261119.md
permissions:
  contents: read
jobs:
  original99-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Seven bounded current-parser positive and adversarial checks
        run: node --test tests/coffee-issue33-r323-original99.test.mjs
      - name: One guarded exact selected first-party HTTPS capture
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '99'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r323
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Fail-closed selected source H1, raw SHA, parser and Add Coffee afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r323
          DIC_R323_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R323_EVENT_SHA: ${{ github.sha }}
          DIC_R323_VERIFY: '1'
        run: node scripts/audit/issue33-r323-original99-check.mjs
      - name: One-day raw public source diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r323-original99
          path: /tmp/dic33-r323/
          retention-days: 1
          if-no-files-found: warn

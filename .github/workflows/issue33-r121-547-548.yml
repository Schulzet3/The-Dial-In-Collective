name: DIC Issue33 R121 original selected 547 548
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r121-547-548.yml
      - scripts/audit/issue33-r121-547-548-check.mjs
      - tests/coffee-issue33-r121-547-548.test.mjs
      - docs/workstreams/ops-issue33-r121-547-548-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r121-547-548.yml
      - scripts/audit/issue33-r121-547-548-check.mjs
      - tests/coffee-issue33-r121-547-548.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and hostile selected-source regressions
        run: node --test tests/coffee-issue33-r121-547-548.test.mjs
      - name: Guarded public official HTTPS and Add Coffee/source review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '547,548'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r121
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact selected official evidence, source hashes, afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r121
          DIC_ISSUE33_R121_VERIFY: '1'
        run: node scripts/audit/issue33-r121-547-548-check.mjs
      - name: Save bounded public source artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r121-original547-548
          path: /tmp/dic33-r121/
          retention-days: 1
          if-no-files-found: warn

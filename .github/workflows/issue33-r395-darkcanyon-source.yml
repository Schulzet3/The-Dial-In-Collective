# Issue #33 R395 — frozen original603 #91/#92 only, current exact selected official URL
name: DIC Issue33 R395 Dark Canyon selected original91-92
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r395-darkcanyon-source.yml'
      - 'scripts/audit/issue33-original603-focused-source-review.mjs'
      - 'scripts/audit/issue33-focused-source-acceptance.mjs'
      - 'src/server/coffee-page-metadata.mjs'
      - 'src/server/coffee-product-scope.mjs'
      - 'src/server/coffee-product-prose.mjs'
      - 'src/server/coffee-direct-product-prose.mjs'
      - 'site/cloud/coffee-url-autofill.js'
  push:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r395-darkcanyon-source.yml'
      - 'scripts/audit/issue33-original603-focused-source-review.mjs'
      - 'scripts/audit/issue33-focused-source-acceptance.mjs'
      - 'src/server/coffee-page-metadata.mjs'
      - 'src/server/coffee-product-scope.mjs'
      - 'src/server/coffee-product-prose.mjs'
      - 'src/server/coffee-direct-product-prose.mjs'
      - 'site/cloud/coffee-url-autofill.js'
permissions:
  contents: read
jobs:
  exact-selected-91-92:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Require current exact selected official sources/parser/no-save UI
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: ${{ runner.temp }}/dic33-original91-92
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '91,92'
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Report only current exact selected product facts for semantic review
        if: always()
        env:
          EVIDENCE_FILE: ${{ runner.temp }}/dic33-original91-92/focused-current-evidence.json
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const f=process.env.EVIDENCE_FILE;
          if(!existsSync(f)){console.log('DIC33_R395_OFFICIAL_SOURCE_UNAVAILABLE_NO_EVIDENCE');process.exit(0)}
          const d=JSON.parse(readFileSync(f,'utf8'));
          for(const r of d.records??[]){
            console.log('DIC33_R395_SELECTED_REVIEW '+JSON.stringify({
              source_sha:d.source_sha,number:r.number,status:r.status,
              selected_h1:r.selected_h1,identity_verified:r.selected_heading_identity_verified===true,
              official_url:r.official_url,html_sha256:r.html_sha256,
              parser_ok:r.parser_ok,current_fields:r.current_fields,conflicts:r.conflicts,
              seo_fallback_fields:r.seo_fallback_fields,
              add_coffee_ui_rendered:r.add_coffee_ui_rendered,source_review_rendered:r.source_review_rendered,
              manual_certified:false
            }));
          }
          NODE
      - name: Retain exact selected public HTML and parser evidence one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r395-selected-91-92-${{ github.run_id }}
          path: ${{ runner.temp }}/dic33-original91-92/
          if-no-files-found: warn
          retention-days: 1

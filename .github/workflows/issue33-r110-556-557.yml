name: DIC Issue33 R110 original selected 556 557
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r110-556-557.yml
      - scripts/audit/issue33-r110-556-557-check.mjs
      - tests/coffee-issue33-r110-556-557.test.mjs
      - docs/workstreams/ops-issue33-r110-556-557-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r110-556-557.yml
      - scripts/audit/issue33-r110-556-557-check.mjs
      - tests/coffee-issue33-r110-556-557.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused actual parser positive and adversarial test
        run: node --test tests/coffee-issue33-r110-556-557.test.mjs
      - name: Guarded official HTTPS selected product parser / Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '556,557'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r110
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify exact selected H1, own spec, source SHA and canonical fields
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r110
          DIC_ISSUE33_R110_VERIFY: '1'
        run: node scripts/audit/issue33-r110-556-557-check.mjs
      - name: Preserve bounded public-only source artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r110-556-557
          path: /tmp/dic33-r110/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R108 current selected original 551 552
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r108-551-552.yml
      - scripts/audit/issue33-r108-551-552-check.mjs
      - tests/coffee-issue33-r108-551-552.test.mjs
      - docs/workstreams/ops-issue33-r108-551-552-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r108-551-552.yml
      - scripts/audit/issue33-r108-551-552-check.mjs
      - tests/coffee-issue33-r108-551-552.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected and adversarial current parser
        run: node --test tests/coffee-issue33-r108-551-552.test.mjs
      - name: Guarded real public HTTPS exact two products and actual Add Coffee / Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '551,552'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r108
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Literal current official evidence and exact source identity afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r108
          DIC_ISSUE33_R108_VERIFY: '1'
        run: node scripts/audit/issue33-r108-551-552-check.mjs
      - name: Preserve public-only one-day source for audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r108-551-552
          path: /tmp/dic33-r108/
          retention-days: 1
          if-no-files-found: warn

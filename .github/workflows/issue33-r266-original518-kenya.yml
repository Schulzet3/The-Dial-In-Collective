name: DIC Issue33 R266 original518 current selected Embu Kenya
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r266-original518-kenya.yml
      - tests/coffee-issue33-r266-518-kenya-identity.test.mjs
      - scripts/audit/issue33-r266-518-kenya-check.mjs
      - docs/workstreams/ops-issue33-r266-518-kenya-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r266-original518-kenya.yml
      - tests/coffee-issue33-r266-518-kenya-identity.test.mjs
      - scripts/audit/issue33-r266-518-kenya-check.mjs
      - docs/workstreams/ops-issue33-r266-518-kenya-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Historical and current Embu selected identity and hostile unrelated source
        run: node --test tests/coffee-issue33-r266-518-kenya-identity.test.mjs
      - name: Guarded live exact original518 official HTTPS and current Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '518'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r266
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent raw Embu selected HTML, source and current field afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r266
          DIC_R266_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R266_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r266-518-kenya-check.mjs
      - name: One-day public-only raw source for independent rehash
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r266-original518-kenya
          path: /tmp/dic33-r266/
          retention-days: 1
          if-no-files-found: warn

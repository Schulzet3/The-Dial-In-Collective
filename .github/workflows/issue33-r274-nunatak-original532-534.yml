name: DIC Issue33 R274 Nunatak original532 534 selected source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r274-nunatak-original532-534.yml
      - tests/coffee-issue33-r274-nunatak-original532-534.test.mjs
      - scripts/audit/issue33-r274-nunatak-original532-534-check.mjs
      - docs/workstreams/ops-issue33-r274-nunatak-original532-534-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r274-nunatak-original532-534.yml
      - tests/coffee-issue33-r274-nunatak-original532-534.test.mjs
      - scripts/audit/issue33-r274-nunatak-original532-534-check.mjs
      - docs/workstreams/ops-issue33-r274-nunatak-original532-534-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and adversarial context plus selected identity
        run: node --test tests/coffee-issue33-r274-nunatak-original532-534.test.mjs
      - name: Guarded exact original current official HTTPS and actual parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '532,534'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r274
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify selected raw SHA256 and Add Coffee Source Review afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r274
          DIC_R274_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R274_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r274-nunatak-original532-534-check.mjs
      - name: Preserve credential-free exact source evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r274-nunatak-original532-534
          path: /tmp/dic33-r274/
          retention-days: 1
          if-no-files-found: warn

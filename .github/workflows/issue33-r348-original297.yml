name: DIC Issue33 R348 original297 selected Wildhaven source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r348-original297.yml
      - scripts/audit/issue33-r348-original297-check.mjs
      - tests/coffee-issue33-r348-original297.test.mjs
      - docs/workstreams/ops-issue33-r348-original297-wildhaven-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r348-original297.yml
      - scripts/audit/issue33-r348-original297-check.mjs
      - tests/coffee-issue33-r348-original297.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Original297 positive and hostile evidence regressions
        run: node --test tests/coffee-issue33-r348-original297.test.mjs
      - name: Bounded original297 ONLY selected official HTTPS attempt
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '297'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r348
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Official selected H1 raw HTML parser Add Coffee no-save afterproof
        if: always()
        env:
          DIC_R348_VERIFY: '1'
          DIC_R348_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R348_EVENT_SHA: ${{ github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r348
        run: node scripts/audit/issue33-r348-original297-check.mjs
      - name: Retain one day public product source diagnostic only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r348-original297
          path: /tmp/dic33-r348/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R86 original603 402 VT Artisan selected source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r86-vtartisan-402.yml
      - scripts/audit/issue33-r86-vtartisan-402-check.mjs
      - tests/coffee-issue33-r86-vtartisan-402.test.mjs
      - src/server/coffee-source-facts.mjs
      - docs/workstreams/ops-issue33-r86-vtartisan-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r86-vtartisan-402.yml
      - scripts/audit/issue33-r86-vtartisan-402-check.mjs
      - tests/coffee-issue33-r86-vtartisan-402.test.mjs
permissions:
  contents: read
jobs:
  selected-vtartisan-gayo:
    name: original603-402-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused positive and adversarial selected-source tests
        run: node --test tests/coffee-issue33-r86-vtartisan-402.test.mjs
      - name: Guarded current official URL, actual parser, Add Coffee and Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '402'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r86-vtartisan
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact source, semantics, SHA and negative boundary afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r86-vtartisan
          DIC_ISSUE33_R86_VERIFY: '1'
        run: node scripts/audit/issue33-r86-vtartisan-402-check.mjs
      - name: Ephemeral raw evidence and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r86-vtartisan-402
          path: /tmp/dic33-r86-vtartisan/
          retention-days: 1
          if-no-files-found: warn

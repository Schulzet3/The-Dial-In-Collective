name: DIC automatic READY source and queue coverage
# Owner Nov 2 #417: lightweight nonpublishing queue check only. Existing mandatory
# exact-source Node/cloud/mobile/SQL/approval checks remain independent. Never
# re-run those suites or package duplicate immutable API publisher artifacts here.
on:
  push:
    branches: [development/backend-foundation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dic-ready-batch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certify-ready-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate queue schema, intake and candidate source
        run: |
          node scripts/release/release-queue.mjs --validate
          node scripts/release/release-queue.mjs --enforce-intake
          node scripts/release/release-queue.mjs --status
      - name: Report source-only READY classification
        if: always()
        env:
          DIC_SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Source-only READY queue classification'
            echo "Source: \u0060$DIC_SOURCE_SHA\u0060"
            echo 'This job validates queue schema/intake only; required exact-source test workflows are independent.'
            echo 'Not a release grant, immutable artifact certificate, backup or provider readback.'
          } >> "$GITHUB_STEP_SUMMARY"

name: DIC Issue33 R361 original15 recycled holiday handle selected Gesha
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r361-original15.yml
      - scripts/audit/issue33-r361-original15-check.mjs
      - tests/coffee-issue33-r361-original15.test.mjs
      - docs/workstreams/ops-issue33-r361-original15-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r361-original15.yml
      - scripts/audit/issue33-r361-original15-check.mjs
      - tests/coffee-issue33-r361-original15.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected original15 direct-source and hostile regressions
        run: node --test tests/coffee-issue33-r361-original15.test.mjs
      - name: One guarded exact official original15 HTTPS fetch
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '15'
          DIC_ISSUE33_FOCUSED_IDENTITY_NEGATIVE_NUMBERS: '15'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r361
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected HTML hash parser and no-save Add Coffee afterproof
        if: always()
        env:
          DIC_R361_VERIFY: '1'
          DIC_R361_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R361_EVENT_SHA: ${{ github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r361
        run: node scripts/audit/issue33-r361-original15-check.mjs
      - name: Retain bounded evidence one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r361-original15
          path: /tmp/dic33-r361/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R187 Quartermaine original262-264
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r187-quartermaine.yml
      - scripts/audit/issue33-r187-quartermaine-check.mjs
      - tests/coffee-issue33-r187-quartermaine.test.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
      - docs/workstreams/ops-issue33-r187-quartermaine-20261113.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r187-quartermaine.yml
      - scripts/audit/issue33-r187-quartermaine-check.mjs
      - tests/coffee-issue33-r187-quartermaine.test.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Original262-264 positive and adversarial current-parser tests
        run: node --test tests/coffee-issue33-r187-quartermaine.test.mjs
      - name: Guarded exact official product HTTPS + actual parser (read only)
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '262,263,264'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r187
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently verify all three selected identities and parser fields
        if: always()
        env:
          DIC_ISSUE33_R187_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r187
        run: node scripts/audit/issue33-r187-quartermaine-check.mjs
      - name: Retain source-bound raw HTML and afterproof for independent review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r187-original262-264
          path: /tmp/dic33-r187/
          retention-days: 2
          if-no-files-found: warn

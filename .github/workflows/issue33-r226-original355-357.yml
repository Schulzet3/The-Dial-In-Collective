name: DIC Issue33 R226 original355-357 selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r226-original355-357.yml
      - tests/coffee-issue33-r226-original356-357.test.mjs
      - scripts/audit/issue33-r226-original355-357-check.mjs
      - docs/workstreams/ops-issue33-r226-355-357-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r226-original355-357.yml
      - tests/coffee-issue33-r226-original356-357.test.mjs
      - scripts/audit/issue33-r226-original355-357-check.mjs
      - docs/workstreams/ops-issue33-r226-355-357-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected positives and hostile sibling-source contracts
        run: node --test tests/coffee-issue33-r226-original356-357.test.mjs
      - name: Guarded current official original source and actual Add Coffee
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '355,356,357'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r226
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Selected current raw SHA and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r226
          DIC_R226_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r226-original355-357-check.mjs
      - name: Preserve source-bound public evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r226-original355-357
          path: /tmp/dic33-r226/
          retention-days: 1
          if-no-files-found: warn

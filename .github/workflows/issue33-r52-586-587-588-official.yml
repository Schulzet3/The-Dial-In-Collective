name: DIC Issue33 R52 selected original603 586 587 588 official source
on:
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r52-586-587-588-official.yml
      - scripts/audit/issue33-r52-586-587-588-afterproof.mjs
      - scripts/audit/issue33-r52-selected-product-contract.mjs
      - tests/coffee-issue33-r52-selected-product-contract.test.mjs
permissions:
  contents: read
jobs:
  selected-r52:
    name: original603-586-587-588-selected-current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Guarded bounded official selected HTTPS and actual Add Coffee parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: ${{ runner.temp }}/dic33-r52-source
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '586,587,588'
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected product identity and raw HTML source integrity
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: ${{ runner.temp }}/dic33-r52-source
        run: node scripts/audit/issue33-r52-586-587-588-afterproof.mjs
      - name: Preserve independent current source artifact for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r52-586-587-588-${{ github.run_id }}
          path: ${{ runner.temp }}/dic33-r52-source/
          if-no-files-found: error
          retention-days: 1

name: DIC Issue33 R357 original490 selected Great Circle release badge
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r357-original490.yml
      - scripts/audit/issue33-r357-original490-check.mjs
      - tests/coffee-issue33-r357-original490.test.mjs
      - docs/workstreams/ops-issue33-r357-original490-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r357-original490.yml
      - scripts/audit/issue33-r357-original490-check.mjs
      - tests/coffee-issue33-r357-original490.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused current selected release and adversarial regressions
        run: node --test tests/coffee-issue33-r357-original490.test.mjs
      - name: One original #490 guarded official HTTPS request
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '490'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r357
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict raw selected H1 HTML SHA parser and no-save afterproof
        if: always()
        env:
          DIC_R357_VERIFY: '1'
          DIC_R357_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R357_EVENT_SHA: ${{ github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r357
        run: node scripts/audit/issue33-r357-original490-check.mjs
      - name: Retain bounded public HTML and afterproof one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r357-original490
          path: /tmp/dic33-r357/
          retention-days: 1
          if-no-files-found: warn

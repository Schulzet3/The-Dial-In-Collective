name: DIC Issue33 R344 original289 exact selected Roastery
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r344-original289.yml
      - scripts/audit/issue33-r344-original289-check.mjs
      - tests/coffee-issue33-r344-original289.test.mjs
      - docs/workstreams/ops-issue33-r344-original288-289-and-r343-correction-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r344-original289.yml
      - scripts/audit/issue33-r344-original289-check.mjs
      - tests/coffee-issue33-r344-original289.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected exact coffee positive and adversarial tests
        run: node --test tests/coffee-issue33-r344-original289.test.mjs
      - name: One bounded guarded original product official HTTPS fetch
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '289'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r344
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict raw SHA H1 real parser Add Coffee and no save afterproof
        if: always()
        env:
          DIC_R344_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r344
        run: node scripts/audit/issue33-r344-original289-check.mjs
      - name: Retain 1 day official source hashes and diagnostic files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r344-original289
          path: /tmp/dic33-r344/
          retention-days: 1
          if-no-files-found: warn

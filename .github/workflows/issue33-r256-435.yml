name: DIC Issue33 R256 original435 exact selected official
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r256-435.yml
      - scripts/audit/issue33-r256-435-check.mjs
      - tests/coffee-issue33-r256-435.test.mjs
      - docs/workstreams/ops-issue33-r256-435-current-source-20261116.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r256-435.yml
      - scripts/audit/issue33-r256-435-check.mjs
      - tests/coffee-issue33-r256-435.test.mjs
      - docs/workstreams/ops-issue33-r256-435-current-source-20261116.md
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused positive and negative selected-product regressions
        run: node --test tests/coffee-issue33-r256-435.test.mjs
      - name: Guarded current official source parser and Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '435'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r256
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent exact source byte hash and field afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r256
          DIC_R256_VERIFY: '1'
          DIC_R256_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R256_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r256-435-check.mjs
      - name: Short-lived guarded source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r256-selected-435
          path: /tmp/dic33-r256/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R211 original317 318 current selected evidence
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r211-original317-318.yml
      - scripts/audit/issue33-r211-original317-318-check.mjs
      - tests/coffee-issue33-r211-original317-318.test.mjs
      - docs/workstreams/ops-issue33-r211-317-318-20261114.md
      - src/server/coffee-page-metadata.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r211-original317-318.yml
      - scripts/audit/issue33-r211-original317-318-check.mjs
      - tests/coffee-issue33-r211-original317-318.test.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Current selected coffee positive and hostile parser tests
        run: node --test tests/coffee-issue33-r211-original317-318.test.mjs
      - name: Bounded guarded exact original official HTTPS and preview
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '317,318'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r211
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify exact current HTML, selected identity, fields and user preview
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r211
          DIC_R211_EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r211-original317-318-check.mjs
      - name: Attach selected original source bytes and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r211-original317-318
          path: /tmp/dic33-r211/
          retention-days: 1
          if-no-files-found: warn

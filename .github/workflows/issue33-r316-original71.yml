name: DIC Issue33 R316 original603 Nicaragua exact selected source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r316-original71.test.mjs
      - scripts/audit/issue33-r316-original71-check.mjs
      - .github/workflows/issue33-r316-original71.yml
      - docs/workstreams/ops-issue33-r316-original71-20261119.md
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r316-original71.test.mjs
      - scripts/audit/issue33-r316-original71-check.mjs
      - .github/workflows/issue33-r316-original71.yml
      - docs/workstreams/ops-issue33-r316-original71-20261119.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Five focused positive and adversarial actual-parser tests
        run: node --test tests/coffee-issue33-r316-original71.test.mjs
      - name: One exact original product guarded public HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '71'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r316
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact selected H1 raw hash parser Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r316
          DIC_R316_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R316_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r316-original71-check.mjs
      - name: One day public only selected evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r316-original71
          path: /tmp/dic33-r316/
          retention-days: 1
          if-no-files-found: warn

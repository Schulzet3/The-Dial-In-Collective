name: DIC Issue33 R302 selected original603 Vail
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r302-original591.test.mjs
      - scripts/audit/issue33-r302-original591-check.mjs
      - .github/workflows/issue33-r302-original591.yml
      - docs/workstreams/ops-issue33-r302-original591-20261118.md
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r302-original591.test.mjs
      - scripts/audit/issue33-r302-original591-check.mjs
      - .github/workflows/issue33-r302-original591.yml
      - docs/workstreams/ops-issue33-r302-original591-20261118.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected parser and negative fixtures
        run: node --test tests/coffee-issue33-r302-original591.test.mjs
      - name: Bounded guarded exact current public HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '591'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r302
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Raw source and parser-afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r302
          DIC_R302_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R302_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r302-original591-check.mjs
      - name: Retain bounded source diagnostic one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r302-original591
          path: /tmp/dic33-r302/
          retention-days: 1
          if-no-files-found: warn

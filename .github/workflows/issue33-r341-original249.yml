name: DIC Issue33 R341 original249 selected Onyx official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r341-original249.yml
      - scripts/audit/issue33-r341-original249-check.mjs
      - tests/coffee-issue33-r341-original249.test.mjs
      - docs/workstreams/ops-issue33-r341-original249-20261119.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r341-original249.yml
      - scripts/audit/issue33-r341-original249-check.mjs
      - tests/coffee-issue33-r341-original249.test.mjs
      - docs/workstreams/ops-issue33-r341-original249-20261119.md
permissions:
  contents: read
jobs:
  original249-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused current selected source and adversarial regressions
        run: node --test tests/coffee-issue33-r341-original249.test.mjs
      - name: One guarded public original603 selected official HTTPS URL
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '249'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r341
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact H1 raw SHA current parser Add Coffee and source review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r341
          DIC_R341_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R341_EVENT_SHA: ${{ github.sha }}
          DIC_R341_VERIFY: '1'
        run: node scripts/audit/issue33-r341-original249-check.mjs
      - name: Public-only one-day diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r341-original249
          path: /tmp/dic33-r341/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R264 exact original505 Ketch current selected
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r264-original505-ketch.yml
      - tests/coffee-issue33-r264-505-ketch-decaf-variants.test.mjs
      - scripts/audit/issue33-r264-505-ketch-decaf-check.mjs
      - docs/workstreams/ops-issue33-r264-505-ketch-decaf-current-source-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r264-original505-ketch.yml
      - tests/coffee-issue33-r264-505-ketch-decaf-variants.test.mjs
      - scripts/audit/issue33-r264-505-ketch-decaf-check.mjs
      - docs/workstreams/ops-issue33-r264-505-ketch-decaf-current-source-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Original505 roast option and decaf positive negative checks
        run: node --test tests/coffee-issue33-r264-505-ketch-decaf-variants.test.mjs
      - name: Fresh exact selected official HTTPS actual parser Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '505'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r264
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact raw selected source digest and field afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r264
          DIC_R264_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R264_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r264-505-ketch-decaf-check.mjs
      - name: Expiring original product bytes for independent afterproof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r264-selected505
          path: /tmp/dic33-r264/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R169 original233 Motive Ethiopia selected official
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r169-233.yml
      - scripts/audit/issue33-r169-233-check.mjs
      - tests/coffee-issue33-r169-233.test.mjs
      - docs/workstreams/ops-issue33-r169-233-20261113.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r169-233.yml
      - scripts/audit/issue33-r169-233-check.mjs
      - tests/coffee-issue33-r169-233.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and adversarial selected product parser
        run: node --test tests/coffee-issue33-r169-233.test.mjs
      - name: Guarded official HTTPS current source and parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '233'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r169
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict afterproof (never certify unavailable or changed identity)
        if: always()
        env:
          DIC_ISSUE33_R169_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r169
        run: node scripts/audit/issue33-r169-233-check.mjs
      - name: Preserve exact raw HTML, evidence and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r169-original233
          path: /tmp/dic33-r169/
          retention-days: 2
          if-no-files-found: warn

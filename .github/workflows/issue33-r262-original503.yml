name: DIC Issue33 R262 exact original503 Kamiak Guji source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r262-original503.yml
      - scripts/audit/issue33-r262-503-check.mjs
      - tests/coffee-issue33-r262-503.test.mjs
      - docs/workstreams/ops-issue33-r262-503-kamiak-guji-20261116.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r262-original503.yml
      - scripts/audit/issue33-r262-503-check.mjs
      - tests/coffee-issue33-r262-503.test.mjs
      - docs/workstreams/ops-issue33-r262-503-kamiak-guji-20261116.md
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected source positive and hostile parser regressions
        run: node --test tests/coffee-issue33-r262-503.test.mjs
      - name: Fresh bounded original503 exact selected HTTPS parser, Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '503'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r262
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent seller identity raw-SHA selected fields and source afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r262
          DIC_R262_VERIFY: '1'
          DIC_R262_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R262_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r262-503-check.mjs
      - name: Expiring original selected raw source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r262-original503
          path: /tmp/dic33-r262/
          retention-days: 1
          if-no-files-found: warn

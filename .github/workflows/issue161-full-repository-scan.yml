name: DIC Issue161 exhaustive tracked source review
# Temporary private source artifact for authorized line-level GitHub forensic
# inspection, one-day retention. No secrets, data APIs, production or deploy.
on:
  push:
    branches:
      - work/issue161-full-repository-scan-20261027
    paths:
      - .github/workflows/issue161-full-repository-scan.yml
      - scripts/audit/issue161-full-source-review.mjs
      - tests/issue161-full-source-review.test.mjs
      - docs/workstreams/issue-161.md
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue161-full-repository-scan.yml
      - scripts/audit/issue161-full-source-review.mjs
      - tests/issue161-full-source-review.test.mjs
      - docs/workstreams/issue-161.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Screen all tracked files and every UTF-8 text line
        run: node scripts/audit/issue161-full-source-review.mjs
      - name: Test redaction and full-coverage scanner rules
        run: node --test tests/issue161-full-source-review.test.mjs
      - name: Reproducible tracked-only source archive for private independent audit
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=qa_artifacts/issue161/tracked-source.tar.gz HEAD
          tar -tzf qa_artifacts/issue161/tracked-source.tar.gz >/dev/null
          test -s qa_artifacts/issue161/tracked-source.tar.gz
          sha256sum qa_artifacts/issue161/tracked-source.tar.gz > qa_artifacts/issue161/archive.sha256
      - name: Private report and source archive (one day only)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dic-issue161-full-review-${{ github.run_id }}
          path: qa_artifacts/issue161/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0


  offline-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Build real allowlisted PWA before offline smoke (PR135 fixed order)
        run: npm run build:cloud && node scripts/audit/site-integrity.mjs --dist
        env:
          SUPABASE_URL: https://azviqqejypsefzilgonr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_issue161_offline_synthetic_only
      - name: Exercise installed Chromium offline, owner cache and durable queued shot
        run: python tests/browser/pwa_offline_qa.py

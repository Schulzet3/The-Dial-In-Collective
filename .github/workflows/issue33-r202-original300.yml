name: DIC Issue33 R202 selected current Sextant original300
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r202-original300.yml
      - scripts/audit/issue33-r202-original300-check.mjs
      - tests/coffee-issue33-r202-original300.test.mjs
      - docs/workstreams/ops-issue33-r202-300-20261114.md
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-selected-description-sensory.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r202-original300.yml
      - scripts/audit/issue33-r202-original300-check.mjs
      - tests/coffee-issue33-r202-original300.test.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-selected-description-sensory.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and hostile selected Black Lion actual-parser regressions
        run: node --test tests/coffee-issue33-r202-original300.test.mjs
      - name: Bounded guarded exact original selected official HTTPS and Add Coffee parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '300'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r202
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently check current selected HTML, parsed facts and raw SHA
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r202
          DIC_R202_EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r202-original300-check.mjs
      - name: Preserve time-limited source-bound evidence for independent audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r202-original300-selected-source
          path: /tmp/dic33-r202/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R277 selected original539 543
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r277-original539-543.yml
      - tests/coffee-issue33-r277-original539-543.test.mjs
      - scripts/audit/issue33-r277-original539-543-check.mjs
      - docs/workstreams/ops-issue33-r277-original539-543-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r277-original539-543.yml
      - tests/coffee-issue33-r277-original539-543.test.mjs
      - scripts/audit/issue33-r277-original539-543-check.mjs
      - docs/workstreams/ops-issue33-r277-original539-543-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected/negative tests
        run: node --test tests/coffee-issue33-r277-original539-543.test.mjs
      - name: Bounded guarded official product HTTPS and actual parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '539,543'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r277
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Rehash current HTML and compare exact Add Coffee/Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r277
          DIC_R277_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R277_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r277-original539-543-check.mjs
      - name: Preserve credential-free bounded evidence one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r277-original539-543
          path: /tmp/dic33-r277/
          retention-days: 1
          if-no-files-found: warn

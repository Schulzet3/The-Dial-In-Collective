name: DIC Issue33 R177 original253 Others selected Brazil
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r177-253.yml
      - scripts/audit/issue33-r177-253-check.mjs
      - tests/coffee-issue33-r177-253.test.mjs
      - src/server/coffee-page-metadata.mjs
      - docs/workstreams/ops-issue33-r177-253-20261113.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r177-253.yml
      - scripts/audit/issue33-r177-253-check.mjs
      - tests/coffee-issue33-r177-253.test.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused source and adversarial selected coffee tests
        run: node --test tests/coffee-issue33-r177-253.test.mjs
      - name: Guarded current official source and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '253'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r177
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict own-product source and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_R177_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r177
        run: node scripts/audit/issue33-r177-253-check.mjs
      - name: Retain bounded current-source HTML and afterproof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r177-original253
          path: /tmp/dic33-r177/
          retention-days: 2
          if-no-files-found: warn

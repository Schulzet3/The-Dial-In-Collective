name: DIC Issue33 R142 original120 current selected solar flare
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r142-120.yml
      - scripts/audit/issue33-r142-120-check.mjs
      - tests/coffee-issue33-r142-120.test.mjs
      - docs/workstreams/ops-issue33-r142-120-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r142-120.yml
      - scripts/audit/issue33-r142-120-check.mjs
      - tests/coffee-issue33-r142-120.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Synthetic selected source and adversarial controls
        run: node --test tests/coffee-issue33-r142-120.test.mjs
      - name: Guarded public selected official coffee and actual application parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '120'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r142
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict raw official selected source and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r142
          DIC_ISSUE33_R142_VERIFY: '1'
        run: node scripts/audit/issue33-r142-120-check.mjs
      - name: Preserve source bytes and failing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r142-original120-current
          path: /tmp/dic33-r142/
          retention-days: 2
          if-no-files-found: warn

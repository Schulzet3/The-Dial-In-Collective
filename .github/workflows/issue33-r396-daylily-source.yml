# Issue #33 R396: exact original603 #95 Daylily selected source only; no 603 replay or production access.
name: DIC Issue33 R396 Daylily selected original95
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r396-daylily-source.yml'
      - 'scripts/audit/issue33-original603-focused-source-review.mjs'
      - 'scripts/audit/issue33-focused-source-acceptance.mjs'
      - 'scripts/audit/issue33-selected-public-alternate.mjs'
      - 'src/server/coffee-url-guard.mjs'
      - 'src/server/coffee-page-metadata.mjs'
      - 'src/server/coffee-product-scope.mjs'
      - 'src/server/coffee-product-prose.mjs'
      - 'src/server/coffee-direct-product-prose.mjs'
      - 'src/server/coffee-selected-source-evidence.mjs'
      - 'site/cloud/coffee-url-autofill.js'
  push:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r396-daylily-source.yml'
      - 'scripts/audit/issue33-original603-focused-source-review.mjs'
      - 'scripts/audit/issue33-focused-source-acceptance.mjs'
      - 'scripts/audit/issue33-selected-public-alternate.mjs'
      - 'src/server/coffee-url-guard.mjs'
      - 'src/server/coffee-page-metadata.mjs'
      - 'src/server/coffee-product-scope.mjs'
      - 'src/server/coffee-product-prose.mjs'
      - 'src/server/coffee-direct-product-prose.mjs'
      - 'src/server/coffee-selected-source-evidence.mjs'
      - 'site/cloud/coffee-url-autofill.js'
permissions:
  contents: read
jobs:
  original95-daylily:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Hard-gated official selected Daylily source and actual parser plus no-save UI
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '95'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: ${{ runner.temp }}/dic33-original95
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Display source-bound selected producer-vs-farm outcome without auto-certification
        if: always()
        env:
          EVIDENCE_FILE: ${{ runner.temp }}/dic33-original95/focused-current-evidence.json
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const f=process.env.EVIDENCE_FILE;
          if(!existsSync(f)){console.log('DIC33_R396_OFFICIAL_UNAVAILABLE');process.exit(0)}
          const d=JSON.parse(readFileSync(f,'utf8'));
          for(const r of d.records??[]){
            console.log('DIC33_R396_DIRECT_ROLE '+JSON.stringify({
              source_sha:d.source_sha,number:r.number,official_url:r.official_url,
              status:r.status,selected_h1:r.selected_h1,
              verified_identity:r.selected_heading_identity_verified===true,
              html_sha256:r.html_sha256,parser_ok:r.parser_ok,
              producer:r.current_fields?.producer??null,
              process:r.current_fields?.process??null,
              source_review_rendered:r.source_review_rendered,
              add_coffee_ui_rendered:r.add_coffee_ui_rendered,
              conflicts:r.conflicts??[],manual_certified:false
            }));
          }
          NODE
      - name: Retain only bounded public selected HTML and parser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r396-daylily95-${{ github.run_id }}
          path: ${{ runner.temp }}/dic33-original95/
          if-no-files-found: warn
          retention-days: 1

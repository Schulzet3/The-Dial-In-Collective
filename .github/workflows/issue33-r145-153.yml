name: DIC Issue33 R145 original153 current selected Hill Tree Dragon
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r145-153.yml
      - scripts/audit/issue33-r145-153-check.mjs
      - tests/coffee-issue33-r145-153.test.mjs
      - docs/workstreams/ops-issue33-r145-153-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r145-153.yml
      - scripts/audit/issue33-r145-153-check.mjs
      - tests/coffee-issue33-r145-153.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Chosen product and adversarial source tests
        run: node --test tests/coffee-issue33-r145-153.test.mjs
      - name: Guarded exact original public source and real extractor
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '153'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r145
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Fail closed on raw source and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_R145_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r145
        run: node scripts/audit/issue33-r145-153-check.mjs
      - name: Retain source bytes and failed evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r145-original153-selected
          path: /tmp/dic33-r145/
          retention-days: 2
          if-no-files-found: warn

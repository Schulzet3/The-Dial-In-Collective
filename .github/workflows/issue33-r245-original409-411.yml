name: DIC Issue33 R245 original409-411 White Rhino selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r245-original409-411.yml
      - tests/coffee-issue33-r245-original409-411.test.mjs
      - scripts/audit/issue33-r245-original409-411-check.mjs
      - docs/workstreams/ops-issue33-r245-409-411-white-rhino-runtime-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-decaffeination-method.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r245-original409-411.yml
      - tests/coffee-issue33-r245-original409-411.test.mjs
      - scripts/audit/issue33-r245-original409-411-check.mjs
      - docs/workstreams/ops-issue33-r245-409-411-white-rhino-runtime-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-decaffeination-method.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Synthetic selected and adversarial regressions
        run: node --test tests/coffee-issue33-r245-original409-411.test.mjs
      - name: Guarded official current product Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '409,410,411'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r245
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent exact raw source hash and parser recheck
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r245
          DIC_R245_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r245-original409-411-check.mjs
      - name: Preserve bounded raw source evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r245-original409-411
          path: /tmp/dic33-r245/
          retention-days: 1
          if-no-files-found: warn

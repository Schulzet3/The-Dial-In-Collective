name: DIC Issue33 R433 original103-105 Due South selected official sources
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r433-duesouth-original103-105.yml'
      - 'scripts/audit/issue33-r433-duesouth-selected-check.mjs'
      - 'tests/issue33-r433-duesouth-selected.test.mjs'
  push:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r433-duesouth-original103-105.yml'
      - 'scripts/audit/issue33-r433-duesouth-selected-check.mjs'
      - 'tests/issue33-r433-duesouth-selected.test.mjs'
permissions:
  contents: read
jobs:
  due-south-current-three:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Exact source and scoped positive/negative tests
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$DIC_EXPECTED_SHA"
          node --check scripts/audit/issue33-r433-duesouth-selected-check.mjs
          node --test tests/issue33-r433-duesouth-selected.test.mjs
      - name: Hard required official HTTPS/H1/parser/unsaved Add Coffee for three originals
        env:
          DIC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '103,104,105'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r433
        run: GITHUB_SHA="$DIC_SOURCE_SHA" node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent current raw selected HTML digest/reparse/semantic afterproof
        if: always()
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_R433_RUN: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r433
        run: node scripts/audit/issue33-r433-duesouth-selected-check.mjs
      - name: One-day source-bound evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r433-original103-105-official
          path: /tmp/dic33-r433/
          retention-days: 1
          if-no-files-found: warn

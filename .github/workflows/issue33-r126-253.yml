name: DIC Issue33 R126 original selected 253
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r126-253.yml
      - scripts/audit/issue33-r126-253-check.mjs
      - tests/coffee-issue33-r126-253.test.mjs
      - docs/workstreams/ops-issue33-r126-253-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r126-253.yml
      - scripts/audit/issue33-r126-253-check.mjs
      - tests/coffee-issue33-r126-253.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Source-specific positive and hostile negative tests
        run: node --test tests/coffee-issue33-r126-253.test.mjs
      - name: Guarded current exact product HTTPS and real extractor/Add Coffee
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '253'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r126
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Validate exact source identity, original corpus and semantic afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r126
          DIC_ISSUE33_R126_VERIFY: '1'
        run: node scripts/audit/issue33-r126-253-check.mjs
      - name: Preserve official raw source and hash evidence for independent rehash
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r126-253-evidence
          path: /tmp/dic33-r126/
          retention-days: 1
          if-no-files-found: warn

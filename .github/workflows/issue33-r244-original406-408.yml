name: DIC Issue33 R244 original406-408 current WeBe selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r244-original406-408.yml
      - tests/coffee-issue33-r244-original406-408.test.mjs
      - scripts/audit/issue33-r244-original406-408-check.mjs
      - docs/workstreams/ops-issue33-r244-406-408-webe-runtime-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-direct-product-prose.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r244-original406-408.yml
      - tests/coffee-issue33-r244-original406-408.test.mjs
      - scripts/audit/issue33-r244-original406-408-check.mjs
      - docs/workstreams/ops-issue33-r244-406-408-webe-runtime-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-direct-product-prose.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Synthetic selected and adversarial regressions
        run: node --test tests/coffee-issue33-r244-original406-408.test.mjs
      - name: Guarded selected original public HTTPS Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '406,408'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r244
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact current raw source independent reparse and SHA256
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r244
          DIC_R244_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r244-original406-408-check.mjs
      - name: Preserve one-day bounded raw source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r244-original406-408
          path: /tmp/dic33-r244/
          retention-days: 1
          if-no-files-found: warn

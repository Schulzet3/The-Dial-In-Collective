name: DIC Issue33 R96 Blue Jazz 445-446 selected product evidence
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r96-bluejazz-445-446.yml
      - scripts/audit/issue33-r96-bluejazz-445-446-check.mjs
      - tests/coffee-issue33-r96-bluejazz-445-446.test.mjs
      - docs/workstreams/ops-issue33-r96-bluejazz-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r96-bluejazz-445-446.yml
      - scripts/audit/issue33-r96-bluejazz-445-446-check.mjs
      - tests/coffee-issue33-r96-bluejazz-445-446.test.mjs
permissions:
  contents: read
jobs:
  bluejazz-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused positive and hostile parser tests
        run: node --test tests/coffee-issue33-r96-bluejazz-445-446.test.mjs
      - name: Guarded fresh exact official selected HTTPS and actual parser, Add Coffee, Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '445,446'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r96-bluejazz
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict source-bound identity and direct official facts
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r96-bluejazz
          DIC_ISSUE33_R96_VERIFY: '1'
        run: node scripts/audit/issue33-r96-bluejazz-445-446-check.mjs
      - name: Ephemeral public exact raw HTML and source afterproof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r96-bluejazz-445-446
          path: /tmp/dic33-r96-bluejazz/
          retention-days: 1
          if-no-files-found: warn

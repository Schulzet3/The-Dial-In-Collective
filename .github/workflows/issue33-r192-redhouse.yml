name: DIC Issue33 R192 Red House original277-279
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r192-redhouse.yml
      - scripts/audit/issue33-r192-redhouse-check.mjs
      - tests/coffee-issue33-r192-redhouse.test.mjs
      - docs/workstreams/ops-issue33-r192-redhouse-277-279-20261114.md
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-processing-evidence.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r192-redhouse.yml
      - scripts/audit/issue33-r192-redhouse-check.mjs
      - tests/coffee-issue33-r192-redhouse.test.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-processing-evidence.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected positive and hostile current real parser fixtures
        run: node --test tests/coffee-issue33-r192-redhouse.test.mjs
      - name: Guarded exact original selected public HTTPS and parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '277,278,279'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r192
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact raw source, parser and review afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r192
        run: node scripts/audit/issue33-r192-redhouse-check.mjs
      - name: Retain bounded public source evidence for short audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r192-redhouse-current277-279
          path: /tmp/dic33-r192/
          retention-days: 1
          if-no-files-found: warn

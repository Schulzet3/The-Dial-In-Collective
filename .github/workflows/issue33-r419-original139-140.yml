name: DIC Issue33 R419 Grinding Gears original139 140 selected official
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r419-original139-140.yml'
      - 'scripts/audit/issue33-r419-original139-140-check.mjs'
      - 'docs/workstreams/ops-issue33-r419-original139-140-20261122.md'
  push:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r419-original139-140.yml'
      - 'scripts/audit/issue33-r419-original139-140-check.mjs'
permissions:
  contents: read
jobs:
  official-selected-original139-140:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Verify immutable checkout and checker syntax
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$DIC_EXPECTED_SHA"
          node --check scripts/audit/issue33-r419-original139-140-check.mjs
      - name: Guarded first-party selected official HTML parser and unsaved UI
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '139,140'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r419
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict exact-source first-party SHA identity and conflicting notes
        if: always()
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r419
        run: node scripts/audit/issue33-r419-original139-140-check.mjs
      - name: Retain bounded first-party source and afterproof one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r419-original139-140-current
          path: /tmp/dic33-r419/
          retention-days: 1
          if-no-files-found: warn

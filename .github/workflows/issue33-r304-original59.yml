name: DIC Issue33 R304 selected original603 Pumpkin Pacamara
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r304-original59.test.mjs
      - scripts/audit/issue33-r304-original59-check.mjs
      - .github/workflows/issue33-r304-original59.yml
      - docs/workstreams/ops-issue33-r304-original59-20261118.md
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r304-original59.test.mjs
      - scripts/audit/issue33-r304-original59-check.mjs
      - .github/workflows/issue33-r304-original59.yml
      - docs/workstreams/ops-issue33-r304-original59-20261118.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Five targeted current product and adversarial contracts
        run: node --test tests/coffee-issue33-r304-original59.test.mjs
      - name: Bounded guarded seller product HTTPS (original and validated same-handle alternate)
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '59'
          DIC_ISSUE33_FOCUSED_CURRENT_ALTERNATE_URL: https://coffeeroasterlnk.com/collections/coffee/products/nicaragua-pumpkin-spice-pacamara
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r304
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict raw current chosen product and real parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r304
          DIC_R304_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R304_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r304-original59-check.mjs
      - name: Bounded one-day diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r304-original59
          path: /tmp/dic33-r304/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R291 selected original517
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r291-original517.test.mjs
      - scripts/audit/issue33-r291-original517-check.mjs
      - .github/workflows/issue33-r291-original517.yml
      - docs/workstreams/ops-issue33-r291-original517-20261118.md
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r291-original517.test.mjs
      - scripts/audit/issue33-r291-original517-check.mjs
      - .github/workflows/issue33-r291-original517.yml
      - docs/workstreams/ops-issue33-r291-original517-20261118.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Current selected and hostile parser tests
        run: node --test tests/coffee-issue33-r291-original517.test.mjs
      - name: Fresh selected public HTTPS through existing DNS TLS SSRF guard
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '517'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r291
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Require raw hash identity parser Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r291
          DIC_R291_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R291_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r291-original517-check.mjs
      - name: Save audit-only raw source one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r291-original517
          path: /tmp/dic33-r291/
          retention-days: 1
          if-no-files-found: warn

name: DIC cloud app build and tests

# Independent, secret-free check before any hosted beta release.
# Netlify also runs npm test and build:cloud on development deploys.
on:
  push:
    branches:
      - development/backend-foundation
      - 'release-candidates/**'
    paths:
      - '.github/workflows/cloud-beta-ci.yml'
      - 'docs/RELEASE_CANDIDATE.json'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'scripts/pwa/**'
      - 'build_cloud.mjs'
      - 'netlify.toml'
      - 'scripts/netlify/**'
      - 'docs/NETLIFY_CREDIT_LEDGER.json'
      - 'site/**'
      - 'src/server/**'
      - 'netlify/functions/**'
      - 'supabase/functions/**'
      - 'scripts/audit/**'
      - 'tests/**'
  pull_request:
    branches:
      - development/backend-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dic-cloud-beta-ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Conservatively classify exact changed source
        id: scope
        env:
          DIC_CI_EVENT: ${{ github.event_name }}
          DIC_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIC_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_CI_REF: ${{ github.ref }}
        run: node scripts/audit/ci-scope.mjs
      - name: Report NOT_APPLICABLE, not an app test PASS
        if: steps.scope.outputs.docs_only == 'true'
        run: echo 'NOT_APPLICABLE: governance only. Approval/continuity still required.'
      - uses: actions/setup-node@v7.1.0
        if: steps.scope.outputs.provider_guard == 'true'
        with:
          node-version: '18.20.8'
      - name: Verify Netlify pre-install guard (infra changes only)
        if: steps.scope.outputs.provider_guard == 'true'
        run: node --test tests/netlify-credit-guard.test.mjs tests/one-use-claim.test.mjs
      - uses: actions/setup-node@v7.1.0
        if: steps.scope.outputs.node_mode != 'none' || steps.scope.outputs.lint == 'true' || steps.scope.outputs.build_validate == 'true'
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies for affected Node/build tasks
        if: steps.scope.outputs.node_mode != 'none' || steps.scope.outputs.lint == 'true' || steps.scope.outputs.build_validate == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run all checked-in Node tests (HIGH risk only)
        if: steps.scope.outputs.node_mode == 'full'
        run: node scripts/audit/measure-stage.mjs --name full-tests --out qa_artifacts/ci-metrics/validate.jsonl -- npm test
      - name: Focused Log Shot, grinder, recommendations and offline regressions
        if: steps.scope.outputs.node_mode == 'shots'
        run: node --test tests/grind-*.test.mjs tests/grinder17-*.test.mjs tests/shot-*.test.mjs tests/cloud-shot-*.test.mjs tests/recommendation-*.test.mjs tests/recipe-*.test.mjs tests/next-shot-*.test.mjs tests/legacy-shot-history-ratio.test.mjs tests/fast-flow-hybrid.test.mjs tests/offline-*.test.mjs
      - name: Focused coffee source/identity and preview regressions
        if: steps.scope.outputs.node_mode == 'coffee'
        run: node --test tests/coffee-*.test.mjs tests/preview-request-bounds.test.mjs tests/universal-coffee-preview.test.mjs
      - name: Lint affected JS or workflow source
        if: steps.scope.outputs.lint == 'true'
        run: node scripts/audit/measure-stage.mjs --name lint --out qa_artifacts/ci-metrics/validate.jsonl -- npm run lint
      - name: Build once for NON-UI changes
        if: steps.scope.outputs.build_validate == 'true'
        env:
          SUPABASE_URL: https://azviqqejypsefzilgonr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_nonfunctional
        run: node scripts/audit/measure-stage.mjs --name build --out qa_artifacts/ci-metrics/validate.jsonl -- npm run build:cloud
      - name: Verify packaged graph from this job's build
        if: steps.scope.outputs.build_validate == 'true'
        run: node scripts/audit/site-integrity.mjs --dist
      - name: Report test applicability explicitly
        if: always()
        run: echo 'See classification log for actually executed tests. NOT_APPLICABLE is NOT PASS.'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dic-validate-timing-${{ github.run_id }}
          path: qa_artifacts/ci-metrics/validate.jsonl
          if-no-files-found: ignore
          retention-days: 7

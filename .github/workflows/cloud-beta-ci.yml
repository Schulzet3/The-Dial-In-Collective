name: DIC cloud app build and tests

# Independent, secret-free check before any hosted beta release.
# Netlify also runs npm test and build:cloud on development deploys.
on:
  push:
    branches:
      - development/backend-foundation
    paths:
      - '.github/workflows/cloud-beta-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'scripts/pwa/**'
      - 'build_cloud.mjs'
      - 'netlify.toml'
      - 'scripts/netlify/**'
      - 'docs/NETLIFY_CREDIT_LEDGER.json'
      - 'site/**'
      - 'src/server/**'
      - 'netlify/functions/**'
      - 'supabase/functions/**'
      - 'scripts/audit/**'
      - 'tests/**'
  pull_request:
    branches:
      - development/backend-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dic-cloud-beta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify documentation-only change (unknown means full CI)
        id: scope
        env:
          DIC_CI_EVENT: ${{ github.event_name }}
          DIC_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIC_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/ci-scope.mjs
      - name: Explain optimized no-op CI
        if: steps.scope.outputs.docs_only == 'true'
        run: echo 'Documentation-only change; expensive suite not applicable; exact-source release guard remains in place.'
      # Netlify's ignore command runs before install on Node 18, independently
      # of the application's configured Node 22. Exercise that real boundary.
      - uses: actions/setup-node@v7.1.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: '18.20.8'
      - name: Verify Netlify ignore guard on its pre-install Node 18 runtime
        if: steps.scope.outputs.docs_only != 'true'
        run: node --test tests/netlify-credit-guard.test.mjs tests/one-use-claim.test.mjs
      - uses: actions/setup-node@v7.1.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install exact locked dependency tree
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/audit/measure-stage.mjs --name install --out qa_artifacts/ci-metrics/validate.jsonl -- npm ci --ignore-scripts --no-audit --no-fund
      - name: Run all checked-in Node tests
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/audit/measure-stage.mjs --name full-tests --out qa_artifacts/ci-metrics/validate.jsonl -- npm test
      - name: Lint browser, server, Edge and audit JavaScript
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/audit/measure-stage.mjs --name lint --out qa_artifacts/ci-metrics/validate.jsonl -- npm run lint
      - name: Build static beta assets with nonfunctional public test coordinates
        if: steps.scope.outputs.docs_only != 'true'
        env:
          SUPABASE_URL: https://azviqqejypsefzilgonr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_nonfunctional
        run: node scripts/audit/measure-stage.mjs --name build --out qa_artifacts/ci-metrics/validate.jsonl -- npm run build:cloud
      - name: Fail if any development-only or private source leaks into dist
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          test -s dist/index.html
          test -s dist/admin.html
          test -s dist/admin/main.js
          test -s dist/admin/view.js
          test -s dist/cloud/coffee-match-ui.js
          test -s dist/vendor/supabase.js
          test -s dist/cloud/config.js
          test ! -e dist/docs
          test ! -e dist/tests
          test ! -e dist/supabase
          test ! -e dist/scripts
          test ! -e dist/.github
          echo "PASS: Cloud app tests/build complete; no private source trees published."
      - name: Retain source validation timing receipts even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic-validate-timing-${{ github.run_id }}
          path: qa_artifacts/ci-metrics/validate.jsonl
          if-no-files-found: warn
          retention-days: 7

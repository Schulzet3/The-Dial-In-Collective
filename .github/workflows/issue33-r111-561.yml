name: DIC Issue33 R111 exact original selected 561
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r111-561.yml
      - scripts/audit/issue33-r111-561-check.mjs
      - tests/coffee-issue33-r111-561.test.mjs
      - docs/workstreams/ops-issue33-r111-561-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r111-561.yml
      - scripts/audit/issue33-r111-561-check.mjs
      - tests/coffee-issue33-r111-561.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Exact selected field positive and adversarial parser tests
        run: node --test tests/coffee-issue33-r111-561.test.mjs
      - name: Guarded selected official HTTPS parser/Add Coffee/Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '561'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r111
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify exact live selected H1, direct fields, source hashes
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r111
          DIC_ISSUE33_R111_VERIFY: '1'
        run: node scripts/audit/issue33-r111-561-check.mjs
      - name: Save bounded public-only evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r111-561
          path: /tmp/dic33-r111/
          retention-days: 1
          if-no-files-found: warn

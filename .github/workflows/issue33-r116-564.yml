name: DIC Issue33 R116 original selected 564
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r116-564.yml
      - scripts/audit/issue33-r116-564-check.mjs
      - tests/coffee-issue33-r116-564.test.mjs
      - docs/workstreams/ops-issue33-r116-564-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r116-564.yml
      - scripts/audit/issue33-r116-564-check.mjs
      - tests/coffee-issue33-r116-564.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Test actual parser, selected identity and adversarial HTML
        run: node --test tests/coffee-issue33-r116-564.test.mjs
      - name: Guarded exact official HTTPS and parser / Add Coffee / Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '564'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r116
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify actual selected source, raw bytes and output
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r116
          DIC_ISSUE33_R116_VERIFY: '1'
        run: node scripts/audit/issue33-r116-564-check.mjs
      - name: Preserve bounded public source evidence for readback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r116-564
          path: /tmp/dic33-r116/
          retention-days: 1
          if-no-files-found: warn

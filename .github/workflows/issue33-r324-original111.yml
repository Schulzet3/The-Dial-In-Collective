name: DIC Issue33 R324 original603 #111 first-party producer contradiction
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r324-original111.yml
      - scripts/audit/issue33-r324-original111-check.mjs
      - tests/coffee-issue33-r324-original111.test.mjs
      - docs/workstreams/ops-issue33-r324-original111-20261119.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r324-original111.yml
      - scripts/audit/issue33-r324-original111-check.mjs
      - tests/coffee-issue33-r324-original111.test.mjs
      - docs/workstreams/ops-issue33-r324-original111-20261119.md
permissions:
  contents: read
jobs:
  original111-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Six positive and adversarial exact selected scope tests
        run: node --test tests/coffee-issue33-r324-original111.test.mjs
      - name: One guarded public HTTPS exact original selected product
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '111'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r324
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: H1 SHA parser UI and two current seller name forms afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r324
          DIC_R324_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R324_EVENT_SHA: ${{ github.sha }}
          DIC_R324_VERIFY: '1'
        run: node scripts/audit/issue33-r324-original111-check.mjs
      - name: One-day original selected public evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r324-original111
          path: /tmp/dic33-r324/
          retention-days: 1
          if-no-files-found: warn

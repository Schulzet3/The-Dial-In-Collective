name: DIC Issue33 R285 selected original549 555
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r285-original549-555.yml
      - tests/coffee-issue33-r285-original549-555.test.mjs
      - scripts/audit/issue33-r285-original549-555-check.mjs
      - docs/workstreams/ops-issue33-r285-original549-555-20261117.md
      - src/server/coffee-selected-description-sensory.mjs
      - src/server/coffee-page-metadata.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r285-original549-555.yml
      - tests/coffee-issue33-r285-original549-555.test.mjs
      - scripts/audit/issue33-r285-original549-555-check.mjs
      - docs/workstreams/ops-issue33-r285-original549-555-20261117.md
      - src/server/coffee-selected-description-sensory.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused direct selected and adversarial tests
        run: node --test tests/coffee-issue33-r285-original549-555.test.mjs
      - name: Guarded current exact primary public HTTPS and actual parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '549,555'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r285
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Selected raw source SHA and Add Coffee source-review afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r285
          DIC_R285_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R285_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r285-original549-555-check.mjs
      - name: Preserve nonsecret selected-source proof for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r285-original549-555
          path: /tmp/dic33-r285/
          retention-days: 1
          if-no-files-found: warn

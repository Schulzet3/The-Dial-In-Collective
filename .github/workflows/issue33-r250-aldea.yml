name: DIC Issue33 R250 Aldea original424-426 official public verification
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r250-aldea.yml
      - scripts/audit/issue33-r250-aldea-check.mjs
      - tests/coffee-issue33-r250-aldea.test.mjs
      - docs/workstreams/ops-issue33-r250-424-426-aldea-runtime-20261116.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r250-aldea.yml
      - scripts/audit/issue33-r250-aldea-check.mjs
      - tests/coffee-issue33-r250-aldea.test.mjs
      - docs/workstreams/ops-issue33-r250-424-426-aldea-runtime-20261116.md
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused positive and hostile tests
        run: node --test tests/coffee-issue33-r250-aldea.test.mjs
      - name: Guarded current official parser and Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '424,425,426'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r250
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify exact raw source hashes and selected assertions
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r250
          DIC_R250_VERIFY: '1'
          DIC_R250_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R250_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r250-aldea-check.mjs
      - name: Retain bounded public raw evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r250-aldea-original424-426
          path: /tmp/dic33-r250/
          retention-days: 1
          if-no-files-found: warn

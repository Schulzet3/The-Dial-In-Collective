name: DIC Issue33 R293 selected original520
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r293-original520.test.mjs
      - scripts/audit/issue33-r293-original520-check.mjs
      - .github/workflows/issue33-r293-original520.yml
      - docs/workstreams/ops-issue33-r293-original520-20261118.md
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r293-original520.test.mjs
      - scripts/audit/issue33-r293-original520-check.mjs
      - .github/workflows/issue33-r293-original520.yml
      - docs/workstreams/ops-issue33-r293-original520-20261118.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected and adversarial actual parser tests
        run: node --test tests/coffee-issue33-r293-original520.test.mjs
      - name: Guarded fresh selected official public HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '520'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r293
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify source-bound bytes identity and omitted original floral
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r293
          DIC_R293_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R293_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r293-original520-check.mjs
      - name: Archive public selected-source evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r293-original520
          path: /tmp/dic33-r293/
          retention-days: 1
          if-no-files-found: warn

name: DIC prepare verified Issue96 documentation receipt
# Creates an unreferenced docs-only commit. The connector verifies it before any ref update.
on:
  push:
    branches: [work/issue96-security-audit-20261023]
    paths: [.github/workflows/issue96-receipts-once.yml]
permissions:
  contents: write
  actions: read
  checks: read
jobs:
  prepare-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3dabb36ea3837bbbcd970559073d35f06ab3bd7d
          persist-credentials: false
      - name: Verify exact CI and preserve existing queue/history before generating receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import copy,datetime,hashlib,json,os,pathlib,urllib.request
          repo='Schulzet3/The-Dial-In-Collective'
          merged='3dabb36ea3837bbbcd970559073d35f06ab3bd7d'
          tested='3064504ad8b4df64994c356f3dba30063209d403'
          tree='721d65a143e973226bb06ffbe8f892548efa0b2b'
          def api(method,path,data=None):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          assert os.environ['GITHUB_REF']=='refs/heads/work/issue96-security-audit-20261023'
          assert api('GET','git/ref/heads/development/backend-foundation')['object']['sha']==merged
          assert api('GET','git/ref/heads/work/issue96-security-audit-20261023')['object']['sha']==os.environ['GITHUB_SHA']
          assert api('GET','git/ref/heads/release/production')['object']['sha']=='f97b8f30c25f6d4ef30c5d79d12daf4fb0670e2f'
          for source in [merged,tested,'69620de239d88b2f4cbfece93aecc739b9c3fd40']:
              assert api('GET','git/commits/'+source)['tree']['sha']==tree
          pr_runs=[39908333705,39908333731,39908333693,39908334166,39908333715,39908333882]
          for run in pr_runs:
              r=api('GET','actions/runs/'+str(run));assert r['head_sha']==tested and r['status']=='completed' and r['conclusion']=='success'
          checks=api('GET','commits/'+merged+'/check-runs?per_page=100')['check_runs']
          required=['approval','validate','cloud-tests','mobile-browser-qa','sql','review']
          verified={}
          for name in required:
              rows=[r for r in checks if r['name']==name and r['head_sha']==merged]
              assert rows and rows[0]['status']=='completed' and rows[0]['conclusion']=='success',name
              verified[name]={'check_id':rows[0]['id'],'url':rows[0]['html_url']}
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          files={}
          root=pathlib.Path('.')
          dump=lambda data:json.dumps(data,indent=2,ensure_ascii=False)+'\n'
          q=json.loads((root/'docs/RELEASE_QUEUE.json').read_text());old=copy.deepcopy(q)
          item=next(x for x in q['items'] if x['id']=='DIC-Q-96-security-repairs')
          item.update(state='READY',pr=97,merged_source_sha=merged,blockers=[],ci_runs=pr_runs,tests=[
            '672/672 Node tests; exact-source lint/build and source allowlist PASS on PR head '+tested+' and merged source '+merged+'.',
            'All six PR workflows/seven checks PASS: approval, validate, cloud-tests, mobile-browser-qa, sql, review, security-inventory. All six applicable exact merged-source checks independently PASS.',
            'Disposable PostgreSQL17.11 all migrations, SQL suites including security_surface_inventory, real generated-HMAC PostgREST authorization/ownership/replay and concurrent backup snapshot tests PASS. No production identities or database mutations.',
            'Synthetic mobile/admin browser,167 visual assertions, real Chromium service-worker offline and packaged-app checks PASS. Sampled screenshot contact sheet independently inspected; no real physical-device claim.',
            'Inventory469 tracked files/72838 lines/3 binaries; zero redacted credential signatures. Dependency advisory has zero known production vulnerabilities. Artifact12481468441 SHA256c7e478a849cf88480ab1e00afc4bcd318dd71cf7f67a3808d32a67fba5ac4d6c independently matched all39 changed file hashes.',
            'Prior unchanged-production public/anonymous probes32/32 PASS in39905265823. Live provider readback22shots/22notes/5accounts/2Community/48receipts/43migrations unchanged.'
          ],notes='READY source repairs, not deployed. Later owner-approved release must include Netlify/app and BOTH Edge functions with shared modules; no new SQL migration. Six scoped findings addressed; no blanket manual-all-history or complete authenticated-production penetration-test claim.')
          assert q['history']==old['history'] and q['published_base']==old['published_base']
          assert next(x for x in q['items'] if x['issue']==93)==next(x for x in old['items'] if x['issue']==93)
          files['docs/RELEASE_QUEUE.json']=dump(q)
          summary='\n## Issue96 source repairs READY, not deployed ('+now+')\nPR97 merged nonforce at '+merged+' with tree '+tree+', identical to tested PR source '+tested+'. All seven PR checks and all six applicable merged-source checks PASS. Six findings repaired: password composition, bounded requests, truthful cache provenance, long-note preservation, privacy copy and malformed-HTML CPU.672 Node tests;167 synthetic visual assertions; browser/offline/packaged-app and isolated SQL/signedHTTP/snapshot suites passed. Current dependency advisories zero;469-file inventory artifact hash and39 repaired bytes independently matched. Queue now preserves93 READY and adds96 READY. Production remains6adabcecd4a2a68e94cdc09a/f97b8f30; no hosted SQL/Edge/Auth/member data or publication. Manual every archived line, real signed production sessions, physical devices and inaccessible provider controls remain unverified, not PASS. Full evidence: audits/2026-10-23-security-ready-receipt.json. No new Project Settings rule is required for these routine approved fixes.\n'
          for path in ['docs/CURRENT_STATUS.md','docs/ACTIVE_WORK_2026-10-20_APPROVAL_TO_RELEASE_INTEGRITY.md']:
              original=(root/path).read_text();files[path]=summary+'\n'+original
          journal='docs/workstreams/issue-96.md'
          files[journal]=(root/journal).read_text()+summary+'\nReceipt preparation re-read live GitHub exact-source CI and all three equal trees before marking READY. This docs-only commit preserves the complete previous queue history, published base, #93 entry, approval decisions and source contracts. No temporary receipt workflow enters its final tree; its bootstrap history is retained as the second parent. Connector must compare changed files and read back before nonforce ref integration.\n'
          matrixpath='docs/APPROVAL_COVERAGE_MATRIX.json'
          matrix=json.loads((root/matrixpath).read_text());original_matrix=copy.deepcopy(matrix)
          matrix['security_inspection_issue96']={'issue':96,'pr':97,'state':'READY_NOT_DEPLOYED','tested_source_sha':tested,'merged_source_sha':merged,'tree_sha':tree,'findings_repaired':6,'node_tests':672,'visual_assertions':167,'provider_public_checks':32,'receipt':'docs/audits/2026-10-23-security-ready-receipt.json','no_new_locked_decisions':True,'production_unchanged':True,'coverage_limits':'Automated every-file/text-line screening plus targeted semantic review; not complete manual-all-archive or authenticated-production penetration certification.'}
          for key,value in original_matrix.items():assert matrix[key]==value
          files[matrixpath]=dump(matrix)
          reportpath='docs/audits/2026-10-23-security-inspection.md'
          files[reportpath]=(root/reportpath).read_text()+summary+'\nFinal exact CI inventory is469 files/72838 text lines/3 binary assets. The earlier456-file count is the starting application snapshot, not a contradictory final count. Runtime/source repairs are complete and queued; no new production release has occurred. Tests and known gaps are separated in the structured receipt.\n'
          receipt={'version':1,'observed_at_utc':now,'issue':96,'pr':97,'status':'SOURCE_REPAIRS_READY_NOT_DEPLOYED','tested_source_sha':tested,'merged_source_sha':merged,'tested_merge_ref_sha':'69620de239d88b2f4cbfece93aecc739b9c3fd40','equal_tree_sha':tree,'pr_ci_runs':pr_runs,'merged_checks':verified,'node_tests':672,'visual_assertions':167,'runtime_dependency_vulnerabilities':0,'inventory':{'files':469,'text_lines':72838,'binary_files':3,'artifact':12481468441,'sha256':'c7e478a849cf88480ab1e00afc4bcd318dd71cf7f67a3808d32a67fba5ac4d6c','all39_changed_sha256_matched':True},'visual_artifact':{'id':12481573477,'sha256':'cf5d45dea317e584212a67c041671b43be4a2d0f71f7019783ff5dba16b72fab'},'live_provider_http':{'run':39905265823,'pass':32,'scope':'Nonmutating public/anonymous HTTP on unchanged production'},'production':{'release_sha':'f97b8f30c25f6d4ef30c5d79d12daf4fb0670e2f','netlify_deploy':'6adabcecd4a2a68e94cdc09a','accounts':5,'shots':22,'notes':22,'community':2,'receipts':48,'migrations':43,'application_tables':46,'missing_rls':0,'new_publication':False},'later_release_requirements':['Netlify/application source','dic-preview-coffee with shared helpers','dic-verify-coffee with shared helpers','No new SQL migration'],'unverified':['Manual interpretation of every archived repository line','Production GoTrue/member/admin signed penetration sessions','Hosted Auth password configuration not exposed by tools','Genuine nonproduction SSO challenge behavior','Physical WebKit/VoiceOver/storage-eviction scenarios','Provider administration/build-hook controls not exposed by tools','Full-history secret clearance and third-party infrastructure penetration','Previously truncated historical note text cannot be reconstructed'],'preserved':['All canonical Locked decisions','Existing #93 READY entry','Queue published_base and complete history','Original member records and offline/Community history','Private Free and one-use publication boundaries']}
          files['docs/audits/2026-10-23-security-ready-receipt.json']=dump(receipt)
          elements=[]
          for path,content in files.items():
              assert path.startswith('docs/')
              blob=api('POST','git/blobs',{'content':content,'encoding':'utf-8'})
              elements.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          resulttree=api('POST','git/trees',{'base_tree':tree,'tree':elements})
          commit=api('POST','git/commits',{'message':'docs: record verified security repairs and queue READY [skip netlify]','tree':resulttree['sha'],'parents':[merged,os.environ['GITHUB_SHA']]})
          result={'sha':commit['sha'],'tree':resulttree['sha'],'base':merged,'bootstrap':os.environ['GITHUB_SHA'],'paths':list(files),'source_changes':False,'ref_updated':False}
          pathlib.Path('qa_artifacts').mkdir(exist_ok=True)
          pathlib.Path('qa_artifacts/issue96-receipt-commit.json').write_text(dump(result))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dic-issue96-receipt-reference
          path: qa_artifacts/issue96-receipt-commit.json
          retention-days: 7

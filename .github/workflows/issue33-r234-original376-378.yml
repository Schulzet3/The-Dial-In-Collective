name: DIC Issue33 R234 original376-378 current Tenfold official selected source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r234-original376-378.yml
      - tests/coffee-issue33-r234-original376-378.test.mjs
      - scripts/audit/issue33-r234-original376-378-check.mjs
      - docs/workstreams/ops-issue33-r234-376-378-tenfold-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-focused-source-acceptance.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-identity-evidence.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-product-prose.mjs
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-selected-source-evidence.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r234-original376-378.yml
      - tests/coffee-issue33-r234-original376-378.test.mjs
      - scripts/audit/issue33-r234-original376-378-check.mjs
      - docs/workstreams/ops-issue33-r234-376-378-tenfold-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-focused-source-acceptance.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-identity-evidence.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-product-prose.mjs
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-selected-source-evidence.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused positive and hostile selected-source contracts
        run: node --test tests/coffee-issue33-r234-original376-378.test.mjs
      - name: Bounded current official public HTTPS Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '376,377,378'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r234
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify raw SHA selected H1 and current parser evidence
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r234
          DIC_R234_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r234-original376-378-check.mjs
      - name: Save bounded selected official source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r234-original376-378
          path: /tmp/dic33-r234/
          retention-days: 1
          if-no-files-found: warn

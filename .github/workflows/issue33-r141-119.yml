name: DIC Issue33 R141 original119 current exact chosen source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r141-119.yml
      - scripts/audit/issue33-r141-119-check.mjs
      - tests/coffee-issue33-r141-119.test.mjs
      - docs/workstreams/ops-issue33-r141-119-20261112.md
      - src/server/coffee-blend-evidence.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r141-119.yml
      - scripts/audit/issue33-r141-119-check.mjs
      - tests/coffee-issue33-r141-119.test.mjs
      - src/server/coffee-blend-evidence.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Synthetic exact selected current and adversarial controls
        run: node --test tests/coffee-issue33-r141-119.test.mjs
      - name: Guarded public official selected radiate and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '119'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r141
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict official raw SHA and selected current afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r141
          DIC_ISSUE33_R141_VERIFY: '1'
        run: node scripts/audit/issue33-r141-119-check.mjs
      - name: Preserve bounded source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r141-original119-current
          path: /tmp/dic33-r141/
          retention-days: 2
          if-no-files-found: warn

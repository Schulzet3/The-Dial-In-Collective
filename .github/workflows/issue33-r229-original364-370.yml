name: DIC Issue33 R229 original364-370 exact selected source afterproof
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r229-original364-370.yml
      - tests/coffee-issue33-r229-original364-370.test.mjs
      - scripts/audit/issue33-r229-original364-370-check.mjs
      - docs/workstreams/ops-issue33-r229-364-367-370-source-triage-20261115.md
      - src/server/coffee-page-metadata.mjs
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-focused-source-acceptance.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r229-original364-370.yml
      - tests/coffee-issue33-r229-original364-370.test.mjs
      - scripts/audit/issue33-r229-original364-370-check.mjs
      - docs/workstreams/ops-issue33-r229-364-367-370-source-triage-20261115.md
      - src/server/coffee-page-metadata.mjs
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-focused-source-acceptance.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected and adversarial actual-parser fixtures
        run: node --test tests/coffee-issue33-r229-original364-370.test.mjs
      - name: Bounded current exact source and Add Coffee preview
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '364,370'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r229
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent raw SHA source-bound exact field afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r229
          DIC_R229_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r229-original364-370-check.mjs
      - name: Save bounded raw source snapshots for independent SHA verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r229-original364-370
          path: /tmp/dic33-r229/
          retention-days: 1
          if-no-files-found: warn

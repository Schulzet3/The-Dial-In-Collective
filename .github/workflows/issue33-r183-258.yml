name: DIC Issue33 R183 original258 Kibaya selected source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r183-258.yml
      - scripts/audit/issue33-r183-258-check.mjs
      - tests/coffee-issue33-r183-258.test.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
      - docs/workstreams/ops-issue33-r183-258-20261113.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r183-258.yml
      - scripts/audit/issue33-r183-258-check.mjs
      - tests/coffee-issue33-r183-258.test.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected identity and negative role regressions
        run: node --test tests/coffee-issue33-r183-258.test.mjs
      - name: Guarded public HTTPS original case 258 and actual current parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '258'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r183
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently enforce exact selected source and retain diagnosis
        if: always()
        env:
          DIC_ISSUE33_R183_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r183
        run: node scripts/audit/issue33-r183-258-check.mjs
      - name: Retain raw official HTML and bounded afterproof for human review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r183-original258
          path: /tmp/dic33-r183/
          retention-days: 2
          if-no-files-found: warn

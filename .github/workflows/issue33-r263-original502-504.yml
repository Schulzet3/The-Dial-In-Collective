name: DIC Issue33 R263 exact selected Kamiak original502 504
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r263-original502-504.yml
      - scripts/audit/issue33-r263-502-504-check.mjs
      - tests/coffee-issue33-r263-502-504.test.mjs
      - docs/workstreams/ops-issue33-r263-502-504-kamiak-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r263-original502-504.yml
      - scripts/audit/issue33-r263-502-504-check.mjs
      - tests/coffee-issue33-r263-502-504.test.mjs
      - docs/workstreams/ops-issue33-r263-502-504-kamiak-20261117.md
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected and hostile parser contracts
        run: node --test tests/coffee-issue33-r263-502-504.test.mjs
      - name: Actual bounded official HTTPS parser Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '502,504'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r263
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent selected H1 literal source and raw HTML SHA checks
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r263
          DIC_R263_VERIFY: '1'
          DIC_R263_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R263_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r263-502-504-check.mjs
      - name: Private expiring current selected source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r263-original502-504
          path: /tmp/dic33-r263/
          retention-days: 1
          if-no-files-found: warn

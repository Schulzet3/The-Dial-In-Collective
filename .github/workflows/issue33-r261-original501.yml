name: DIC Issue33 R261 exact original501 IXXA source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r261-original501.yml
      - scripts/audit/issue33-r261-501-check.mjs
      - tests/coffee-issue33-r261-501.test.mjs
      - docs/workstreams/ops-issue33-r261-501-ixxa-current-source-20261116.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r261-original501.yml
      - scripts/audit/issue33-r261-501-check.mjs
      - tests/coffee-issue33-r261-501.test.mjs
      - docs/workstreams/ops-issue33-r261-501-ixxa-current-source-20261116.md
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Exact selected product positive and hostile parser regressions
        run: node --test tests/coffee-issue33-r261-501.test.mjs
      - name: Fresh bounded original501 exact selected HTTPS HTML parser and Add Coffee
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '501'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r261
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent exact seller identity/raw SHA/source afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r261
          DIC_R261_VERIFY: '1'
          DIC_R261_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R261_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r261-501-check.mjs
      - name: Expiring raw current selected product bytes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r261-selected501
          path: /tmp/dic33-r261/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R232 original371-372 current selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r232-original371-372.yml
      - tests/coffee-issue33-r232-original371-372.test.mjs
      - scripts/audit/issue33-r232-original371-372-check.mjs
      - docs/workstreams/ops-issue33-r232-371-372-current-parser-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-focused-source-acceptance.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-identity-evidence.mjs
      - src/server/coffee-selected-context-roles.mjs
      - src/server/coffee-espresso-evidence.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-product-prose.mjs
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-selected-offer-h2.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-selected-source-evidence.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r232-original371-372.yml
      - tests/coffee-issue33-r232-original371-372.test.mjs
      - scripts/audit/issue33-r232-original371-372-check.mjs
      - docs/workstreams/ops-issue33-r232-371-372-current-parser-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-focused-source-acceptance.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-identity-evidence.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-product-prose.mjs
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-selected-offer-h2.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-selected-source-evidence.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Source-bounded positive, hostile and missing-original fixtures
        run: node --test tests/coffee-issue33-r232-original371-372.test.mjs
      - name: Exact current public HTTPS and Add Coffee/Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '371,372'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r232
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently verify selected raw bytes and true current parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r232
          DIC_R232_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r232-original371-372-check.mjs
      - name: Save bounded selected official raw evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r232-original371-372
          path: /tmp/dic33-r232/
          retention-days: 1
          if-no-files-found: warn

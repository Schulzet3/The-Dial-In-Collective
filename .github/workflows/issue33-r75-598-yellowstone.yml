name: DIC Issue33 R75 original603 598 selected Bolivia source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r75-598-yellowstone.yml
      - scripts/audit/issue33-r75-598-selected-contract.mjs
      - scripts/audit/issue33-r75-598-afterproof.mjs
      - tests/coffee-issue33-r75-598-selected-contract.test.mjs
      - docs/workstreams/ops-issue33-r75-598-yellowstone-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r75-598-yellowstone.yml
      - scripts/audit/issue33-r75-598-selected-contract.mjs
      - scripts/audit/issue33-r75-598-afterproof.mjs
      - tests/coffee-issue33-r75-598-selected-contract.test.mjs
permissions:
  contents: read
jobs:
  current-bolivia-selected:
    name: original603-598-current-official-bolivia
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Strict selected official positive and adversarial contract
        run: node --test tests/coffee-issue33-r75-598-selected-contract.test.mjs
      - name: Guarded original selected URL, actual parser, Add Coffee and Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '598'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r75-598
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Fail-closed current identity, selected facts, parser and raw SHA afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r75-598
        run: node scripts/audit/issue33-r75-598-afterproof.mjs
      - name: Short retention source captures and explicit verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r75-bolivia-598
          path: /tmp/dic33-r75-598/
          if-no-files-found: warn
          retention-days: 1

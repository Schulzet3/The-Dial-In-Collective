name: DIC Issue33 R125 original selected 586
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r125-586.yml
      - scripts/audit/issue33-r125-586-check.mjs
      - tests/coffee-issue33-r125-586.test.mjs
      - docs/workstreams/ops-issue33-r125-586-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r125-586.yml
      - scripts/audit/issue33-r125-586-check.mjs
      - tests/coffee-issue33-r125-586.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Source-specific positive and hostile negative tests
        run: node --test tests/coffee-issue33-r125-586.test.mjs
      - name: Guarded exact official public HTTPS with actual parser, Add Coffee and Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '586'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r125
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Afterproof source identity hashes and conflicting literal details
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r125
          DIC_ISSUE33_R125_VERIFY: '1'
        run: node scripts/audit/issue33-r125-586-check.mjs
      - name: Public evidence for independent source and hash validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r125-586-evidence
          path: /tmp/dic33-r125/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R269 original523-525 Millcreek selected seller source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r269-millcreek-original523-525.yml
      - tests/coffee-issue33-r269-millcreek-original523-525.test.mjs
      - scripts/audit/issue33-r269-millcreek-original523-525-check.mjs
      - docs/workstreams/ops-issue33-r269-millcreek-original523-525-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r269-millcreek-original523-525.yml
      - tests/coffee-issue33-r269-millcreek-original523-525.test.mjs
      - scripts/audit/issue33-r269-millcreek-original523-525-check.mjs
      - docs/workstreams/ops-issue33-r269-millcreek-original523-525-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and adverse identity tests
        run: node --test tests/coffee-issue33-r269-millcreek-original523-525.test.mjs
      - name: Fresh guarded selected merchant HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '523,524,525'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r269
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently validate selected seller byte and parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r269
          DIC_R269_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R269_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r269-millcreek-original523-525-check.mjs
      - name: One-day current selected raw source artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r269-millcreek-523-525
          path: /tmp/dic33-r269/
          retention-days: 1
          if-no-files-found: warn

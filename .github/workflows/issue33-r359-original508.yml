name: DIC Issue33 R359 original508 selected Munsinger conflict
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r359-original508.yml
      - scripts/audit/issue33-r359-original508-check.mjs
      - tests/coffee-issue33-r359-original508.test.mjs
      - docs/workstreams/ops-issue33-r359-original508-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r359-original508.yml
      - scripts/audit/issue33-r359-original508-check.mjs
      - tests/coffee-issue33-r359-original508.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused original508 identity and adversarial regressions
        run: node --test tests/coffee-issue33-r359-original508.test.mjs
      - name: Bounded official original508 current HTTPS fetch
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '508'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r359
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict raw selected HTML identity parser UI afterproof
        if: always()
        env:
          DIC_R359_VERIFY: '1'
          DIC_R359_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R359_EVENT_SHA: ${{ github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r359
        run: node scripts/audit/issue33-r359-original508-check.mjs
      - name: Retain evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r359-original508
          path: /tmp/dic33-r359/
          retention-days: 1
          if-no-files-found: warn

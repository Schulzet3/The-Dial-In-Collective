name: DIC Issue33 R153 exact June current 169 171
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r153-june-169-171.yml
      - scripts/audit/issue33-r153-june-169-171-check.mjs
      - tests/coffee-issue33-r153-june-169-171.test.mjs
      - docs/workstreams/ops-issue33-r153-june-169-171-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r153-june-169-171.yml
      - scripts/audit/issue33-r153-june-169-171-check.mjs
      - tests/coffee-issue33-r153-june-169-171.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Chosen current source scope positive and negative regressions
        run: node --test tests/coffee-issue33-r153-june-169-171.test.mjs
      - name: Guarded HTTPS, chosen official pages and current real extractor
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '169,171'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r153
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict current official evidence and chosen source afterproof
        if: always()
        env:
          DIC_ISSUE33_R153_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r153
        run: node scripts/audit/issue33-r153-june-169-171-check.mjs
      - name: Archive exact bounded HTML and status for independent review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r153-june-selected-169-171
          path: /tmp/dic33-r153/
          retention-days: 2
          if-no-files-found: warn

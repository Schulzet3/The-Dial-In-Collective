name: DIC Issue33 R298 selected original588
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r298-original588.test.mjs
      - scripts/audit/issue33-r298-original588-check.mjs
      - .github/workflows/issue33-r298-original588.yml
      - docs/workstreams/ops-issue33-r298-original588-20261118.md
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r298-original588.test.mjs
      - scripts/audit/issue33-r298-original588-check.mjs
      - .github/workflows/issue33-r298-original588.yml
      - docs/workstreams/ops-issue33-r298-original588-20261118.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused current parser and adversarial source controls
        run: node --test tests/coffee-issue33-r298-original588.test.mjs
      - name: Guarded exact official public URL with same-handle collection fallback
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '588'
          DIC_ISSUE33_FOCUSED_CURRENT_ALTERNATE_URL: 'https://www.unlockedcoffee.com/collections/colombia-premium/products/the-pleasant'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r298
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Real selected source bytes, identity and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r298
          DIC_R298_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R298_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r298-original588-check.mjs
      - name: Retain public selected evidence one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r298-original588
          path: /tmp/dic33-r298/
          retention-days: 1
          if-no-files-found: warn

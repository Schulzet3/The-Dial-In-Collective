name: DIC Issue33 R197 original288 selected current human grower
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r197-original288.yml
      - scripts/audit/issue33-r197-original288-check.mjs
      - tests/coffee-issue33-r197-original288.test.mjs
      - docs/workstreams/ops-issue33-r197-288-20261114.md
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-page-metadata.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r197-original288.yml
      - scripts/audit/issue33-r197-original288-check.mjs
      - tests/coffee-issue33-r197-original288.test.mjs
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused chosen grower versus farm regressions
        run: node --test tests/coffee-issue33-r197-original288.test.mjs
      - name: Guarded current official HTTPS and actual parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '288'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r197
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify actual selected current H1 and grower/farm source roles
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r197
        run: node scripts/audit/issue33-r197-original288-check.mjs
      - name: Save one-day public official-source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r197-original288-current-source
          path: /tmp/dic33-r197/
          retention-days: 1
          if-no-files-found: warn

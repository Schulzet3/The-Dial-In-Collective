name: DIC Issue33 R105 original603 selected 543
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r105-543.yml
      - scripts/audit/issue33-r105-543-check.mjs
      - tests/coffee-issue33-r105-543.test.mjs
      - docs/workstreams/ops-issue33-r105-543-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r105-543.yml
      - scripts/audit/issue33-r105-543-check.mjs
      - tests/coffee-issue33-r105-543.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    name: original603-543-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Bounded positive and hostile selected-coffee regressions
        run: node --test tests/coffee-issue33-r105-543.test.mjs
      - name: Guarded public HTTPS selected coffee and actual parser/Add Coffee/Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '543'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r105
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected-source byte and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r105
          DIC_ISSUE33_R105_VERIFY: '1'
        run: node scripts/audit/issue33-r105-543-check.mjs
      - name: One-day source-bound evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r105-543-selected
          path: /tmp/dic33-r105/
          retention-days: 1
          if-no-files-found: warn

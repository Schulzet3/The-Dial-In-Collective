name: DIC Issue33 disposable hosted auth and Add Coffee acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dic-issue33-hosted-auth-one-at-a-time
  cancel-in-progress: false
jobs:
  hosted-disposable-member:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned browser runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Assert host database client is present
        run: command -v psql
      - name: Real disposable-account hosted authentication and persistence
        run: python scripts/qa/issue33-hosted-auth-e2e.py

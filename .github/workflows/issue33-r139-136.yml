name: DIC Issue33 R139 original136 exact official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r139-136.yml
      - scripts/audit/issue33-r139-136-check.mjs
      - tests/coffee-issue33-r139-136.test.mjs
      - docs/workstreams/ops-issue33-r139-136-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r139-136.yml
      - scripts/audit/issue33-r139-136-check.mjs
      - tests/coffee-issue33-r139-136.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Adversarial selected current product tests
        run: node --test tests/coffee-issue33-r139-136.test.mjs
      - name: Guarded selected official HTTPS and real parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '136'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r139
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact-source strict afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r139
          DIC_ISSUE33_R139_VERIFY: '1'
        run: node scripts/audit/issue33-r139-136-check.mjs
      - name: Preserve raw evidence and failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r139-original136-current
          path: /tmp/dic33-r139/
          retention-days: 2
          if-no-files-found: warn

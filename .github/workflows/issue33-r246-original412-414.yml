name: DIC Issue33 R246 original412-414 Woods selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r246-original412-414.yml
      - tests/coffee-issue33-r246-original412-414.test.mjs
      - scripts/audit/issue33-r246-original412-414-check.mjs
      - docs/workstreams/ops-issue33-r246-412-414-woods-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-decaffeination-method.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r246-original412-414.yml
      - tests/coffee-issue33-r246-original412-414.test.mjs
      - scripts/audit/issue33-r246-original412-414-check.mjs
      - docs/workstreams/ops-issue33-r246-412-414-woods-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-decaffeination-method.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Synthetic selected and adversarial regressions
        run: node --test tests/coffee-issue33-r246-original412-414.test.mjs
      - name: Guarded current selected official Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '412,413,414'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r246
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent exact raw hash and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r246
          DIC_R246_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r246-original412-414-check.mjs
      - name: Preserve current selected raw HTML one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r246-original412-414
          path: /tmp/dic33-r246/
          retention-days: 1
          if-no-files-found: warn

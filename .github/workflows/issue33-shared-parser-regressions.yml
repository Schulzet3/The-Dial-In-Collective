name: DIC Issue33 selected-source shared-dependency offline regressions
# N508-075: run bounded synthetic parser/identity/UI contracts on imported-source changes.
# Historical per-case LIVE product workflows retain their explicit own-case paths;
# this common dependency check never re-fetches any original603 web product.
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - 'src/server/coffee-*.mjs'
      - 'src/server/roast-level-evidence.mjs'
      - 'src/server/agtron-roast.mjs'
      - 'site/cloud/coffee-url-autofill.js'
      - 'site/cloud/coffee-match-ui.js'
      - 'site/lib/ui.js'
      - 'site/lib/constants.js'
      - 'site/cloud/main.js'
      - 'supabase/functions/_shared/html-scan.mjs'
      - 'supabase/functions/_shared/coffee-release-label.mjs'
      - 'scripts/audit/issue33-*.mjs'
      - 'tests/coffee-issue33-r31*.test.mjs'
      - 'tests/coffee-issue33-shared-ci-trigger.test.mjs'
      - '.github/workflows/issue33-shared-parser-regressions.yml'
      - 'docs/workstreams/ops-issue33-r319-shared-parser-ci-20261119.md'
      - 'docs/workstreams/ops-issue33-r333-client-ui-ci-20261119.md'
  push:
    branches: [development/backend-foundation]
    paths:
      - 'src/server/coffee-*.mjs'
      - 'src/server/roast-level-evidence.mjs'
      - 'src/server/agtron-roast.mjs'
      - 'site/cloud/coffee-url-autofill.js'
      - 'site/cloud/coffee-match-ui.js'
      - 'site/lib/ui.js'
      - 'site/lib/constants.js'
      - 'site/cloud/main.js'
      - 'supabase/functions/_shared/html-scan.mjs'
      - 'supabase/functions/_shared/coffee-release-label.mjs'
      - 'scripts/audit/issue33-*.mjs'
      - 'tests/coffee-issue33-r31*.test.mjs'
      - 'tests/coffee-issue33-shared-ci-trigger.test.mjs'
      - '.github/workflows/issue33-shared-parser-regressions.yml'
      - 'docs/workstreams/ops-issue33-r319-shared-parser-ci-20261119.md'
      - 'docs/workstreams/ops-issue33-r333-client-ui-ci-20261119.md'
permissions:
  contents: read
concurrency:
  group: dic33-shared-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  imported-source-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Exact checked-out commit, no network product fetch
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$DIC_EXPECTED_SHA"
      - name: Shared parser selected-product positive and adversarial contracts (offline)
        run: |
          node --test \
            tests/coffee-issue33-shared-ci-trigger.test.mjs \
            tests/coffee-issue33-r315-original63.test.mjs \
            tests/coffee-issue33-r316-original71.test.mjs \
            tests/coffee-issue33-r317-original79-80.test.mjs \
            tests/coffee-issue33-r318-original91-92.test.mjs \
            tests/coffee-issue33-r330-original153.test.mjs \
            tests/coffee-issue33-r332-original157.test.mjs

name: DIC Issue33 R320 Novo Buesaco runner DIAGNOSIS (NOT original source acceptance)
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r320-buesaco-runner-probe.yml
      - scripts/audit/issue33-r320-buesaco-probe.mjs
      - tests/coffee-issue33-r320-buesaco-probe.test.mjs
      - docs/workstreams/ops-issue33-r320-buesaco-runner-probe-20261119.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r320-buesaco-runner-probe.yml
      - scripts/audit/issue33-r320-buesaco-probe.mjs
      - tests/coffee-issue33-r320-buesaco-probe.test.mjs
      - docs/workstreams/ops-issue33-r320-buesaco-runner-probe-20261119.md
permissions:
  contents: read
jobs:
  bounded-runner-diagnosis-not-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Five source/lot/anti-bot/Woo diagnostic positive and negative cases
        run: node --test tests/coffee-issue33-r320-buesaco-probe.test.mjs
      - name: Three first-party guarded actual HTTPS probes; blocked is NOT acceptance
        env:
          DIC_R320_RUN: '1'
          DIC_R320_DIR: /tmp/dic33-r320
          DIC_R320_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R320_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r320-buesaco-probe.mjs
      - name: Public origin evidence for one day, no cookies, Auth or member data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r320-buesaco-runner-diagnostic-only
          path: /tmp/dic33-r320/
          retention-days: 1
          if-no-files-found: warn

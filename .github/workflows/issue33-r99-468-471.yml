name: DIC Issue33 R99 original603 selected 468 and 471
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r99-468-471.yml
      - scripts/audit/issue33-r99-468-471-check.mjs
      - tests/coffee-issue33-r99-468-471.test.mjs
      - docs/workstreams/ops-issue33-r99-468-471-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r99-468-471.yml
      - scripts/audit/issue33-r99-468-471-check.mjs
      - tests/coffee-issue33-r99-468-471.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    name: original603-468-471-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected and hostile context regressions
        run: node --test tests/coffee-issue33-r99-468-471.test.mjs
      - name: Guarded current exact selected official HTTPS and actual parser/UI
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '468,471'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r99
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict source-bound chosen product and immutable CSV afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r99
          DIC_ISSUE33_R99_VERIFY: '1'
        run: node scripts/audit/issue33-r99-468-471-check.mjs
      - name: Preserve bounded raw selected evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r99-468-471-selected
          path: /tmp/dic33-r99/
          retention-days: 1
          if-no-files-found: warn

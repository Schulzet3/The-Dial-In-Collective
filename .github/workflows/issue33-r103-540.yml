name: DIC Issue33 R103 original603 selected 540
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r103-540.yml
      - scripts/audit/issue33-r103-540-check.mjs
      - tests/coffee-issue33-r103-540.test.mjs
      - docs/workstreams/ops-issue33-r103-540-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r103-540.yml
      - scripts/audit/issue33-r103-540-check.mjs
      - tests/coffee-issue33-r103-540.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    name: original603-540-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Strict positive and hostile selected product cases
        run: node --test tests/coffee-issue33-r103-540.test.mjs
      - name: Guarded public HTTPS exact selected 540 and actual parser Add Coffee Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '540'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r103
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact current selected source-bound afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r103
          DIC_ISSUE33_R103_VERIFY: '1'
        run: node scripts/audit/issue33-r103-540-check.mjs
      - name: One-day bounded public source artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r103-540-selected
          path: /tmp/dic33-r103/
          retention-days: 1
          if-no-files-found: warn

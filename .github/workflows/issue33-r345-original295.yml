name: DIC Issue33 R345 original295 exact selected Seldovia
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r345-original295.yml
      - scripts/audit/issue33-r345-original295-check.mjs
      - tests/coffee-issue33-r345-original295.test.mjs
      - docs/workstreams/ops-issue33-r345-original295-seldovia-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r345-original295.yml
      - scripts/audit/issue33-r345-original295-check.mjs
      - tests/coffee-issue33-r345-original295.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected exact coffee positive and adversarial tests
        run: node --test tests/coffee-issue33-r345-original295.test.mjs
      - name: One bounded guarded original product official HTTPS fetch
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '295'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r345
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict raw SHA H1 real parser Add Coffee and no save afterproof
        if: always()
        env:
          DIC_R345_VERIFY: '1'
          DIC_R345_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R345_EVENT_SHA: ${{ github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r345
        run: node scripts/audit/issue33-r345-original295-check.mjs
      - name: Retain 1 day official source hashes and diagnostic files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r345-original295
          path: /tmp/dic33-r345/
          retention-days: 1
          if-no-files-found: warn

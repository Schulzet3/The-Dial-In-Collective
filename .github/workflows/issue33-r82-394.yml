name: DIC Issue33 R82 original603 394 VESTA selected source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r82-394.yml
      - scripts/audit/issue33-r82-394-check.mjs
      - tests/coffee-issue33-r82-394-contract.test.mjs
      - docs/workstreams/ops-issue33-r82-394-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r82-394.yml
      - scripts/audit/issue33-r82-394-check.mjs
      - tests/coffee-issue33-r82-394-contract.test.mjs
permissions:
  contents: read
jobs:
  selected-394:
    name: original603-394-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Source-specific positive and adversarial cases
        run: node --test tests/coffee-issue33-r82-394-contract.test.mjs
      - name: Fresh guarded official selected HTTPS plus real parser and Add Coffee
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '394'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r82-394
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected-source afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r82-394
          DIC_ISSUE33_R82_VERIFY: '1'
        run: node scripts/audit/issue33-r82-394-check.mjs
      - name: One-day official source and raw hash evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r82-394
          path: /tmp/dic33-r82-394/
          retention-days: 1
          if-no-files-found: warn

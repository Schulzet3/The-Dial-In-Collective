name: DIC Issue33 R143 original122 current selected Favor Malaki
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r143-122.yml
      - scripts/audit/issue33-r143-122-check.mjs
      - tests/coffee-issue33-r143-122.test.mjs
      - docs/workstreams/ops-issue33-r143-122-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r143-122.yml
      - scripts/audit/issue33-r143-122-check.mjs
      - tests/coffee-issue33-r143-122.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected product positive and adversarial tests
        run: node --test tests/coffee-issue33-r143-122.test.mjs
      - name: Guarded official selected public HTTPS and actual application parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '122'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r143
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Fail closed on original selected identity, raw source, parser and provenance
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r143
          DIC_ISSUE33_R143_VERIFY: '1'
        run: node scripts/audit/issue33-r143-122-check.mjs
      - name: Preserve official bytes and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r143-original122-selected
          path: /tmp/dic33-r143/
          retention-days: 2
          if-no-files-found: warn

name: DIC Issue33 R325 original603 #114 current Elixr selected station-owner boundary
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r325-original114.yml
      - scripts/audit/issue33-r325-original114-check.mjs
      - tests/coffee-issue33-r325-original114.test.mjs
      - docs/workstreams/ops-issue33-r325-original114-20261119.md
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-source-facts.mjs
      - src/server/coffee-semantic-specs.mjs
      - src/server/coffee-product-scope.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r325-original114.yml
      - scripts/audit/issue33-r325-original114-check.mjs
      - tests/coffee-issue33-r325-original114.test.mjs
      - docs/workstreams/ops-issue33-r325-original114-20261119.md
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-source-facts.mjs
      - src/server/coffee-semantic-specs.mjs
      - src/server/coffee-product-scope.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  original114-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Seven focused current parser and negative source tests
        run: node --test tests/coffee-issue33-r325-original114.test.mjs
      - name: One guarded public HTTPS exact official selected product
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '114'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r325
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Fail closed H1 HTML hash current parser UI and no station owner invention
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r325
          DIC_R325_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R325_EVENT_SHA: ${{ github.sha }}
          DIC_R325_VERIFY: '1'
        run: node scripts/audit/issue33-r325-original114-check.mjs
      - name: One-day current official source proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r325-original114
          path: /tmp/dic33-r325/
          retention-days: 1
          if-no-files-found: warn

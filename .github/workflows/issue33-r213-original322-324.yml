name: DIC Issue33 R213 original322 324 selected official evidence
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r213-original322-324.yml
      - tests/coffee-issue33-r213-original322-324.test.mjs
      - scripts/audit/issue33-r213-original322-324-check.mjs
      - docs/workstreams/ops-issue33-r213-322-324-20261115.md
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-selected-description-sensory.mjs
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-product-scope.mjs
      - tests/coffee-issue33-r213-workflow-dependencies.test.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r213-original322-324.yml
      - tests/coffee-issue33-r213-original322-324.test.mjs
      - scripts/audit/issue33-r213-original322-324-check.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-selected-description-sensory.mjs
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-product-scope.mjs
      - docs/workstreams/ops-issue33-r213-322-324-20261115.md
      - tests/coffee-issue33-r213-workflow-dependencies.test.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Seven selected positive and hostile parser contracts
        run: node --test tests/coffee-issue33-r213-original322-324.test.mjs
      - name: Validate source workflow dependency triggers
        run: node --test tests/coffee-issue33-r213-workflow-dependencies.test.mjs
      - name: Bounded chosen public HTTPS and Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '322,323,324'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r213
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected raw SHA and current parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r213
          DIC_R213_EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r213-original322-324-check.mjs
      - name: Capture selected source diagnostics for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r213-original322-324
          path: /tmp/dic33-r213/
          retention-days: 1
          if-no-files-found: warn

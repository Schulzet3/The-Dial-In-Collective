name: DIC Issue33 R347 original299 Sextant selected description truth
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r347-original299.yml
      - scripts/audit/issue33-r347-original299-check.mjs
      - tests/coffee-issue33-r347-original299.test.mjs
      - docs/workstreams/ops-issue33-r347-original299-sextant-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r347-original299.yml
      - scripts/audit/issue33-r347-original299-check.mjs
      - tests/coffee-issue33-r347-original299.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: One original299 synthetic positive and hostile parser suite
        run: node --test tests/coffee-issue33-r347-original299.test.mjs
      - name: One bounded original299 public first-party source probe
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '299'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r347
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Raw HTML SHA original H1 parser and Add Coffee no-save afterproof
        if: always()
        env:
          DIC_R347_VERIFY: '1'
          DIC_R347_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R347_EVENT_SHA: ${{ github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r347
        run: node scripts/audit/issue33-r347-original299-check.mjs
      - name: One day public only selected source diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r347-original299
          path: /tmp/dic33-r347/
          retention-days: 1
          if-no-files-found: warn

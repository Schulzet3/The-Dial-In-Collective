name: DIC Issue33 R366 original38 Ethiopia Natural selected product
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r366-original38.yml
      - scripts/audit/issue33-r366-original38-check.mjs
      - tests/coffee-issue33-r366-original38.test.mjs
      - docs/workstreams/ops-issue33-r366-original38-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r366-original38.yml
      - scripts/audit/issue33-r366-original38-check.mjs
      - tests/coffee-issue33-r366-original38.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and adversarial product source rules
        run: node --test tests/coffee-issue33-r366-original38.test.mjs
      - name: Bounded official selected original38 HTML, parser and UI
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '38'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r366
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify raw selected source SHA and no-save parser facts
        if: always()
        env:
          DIC_R366_VERIFY: '1'
          DIC_R366_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R366_EVENT_SHA: ${{ github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r366
        run: node scripts/audit/issue33-r366-original38-check.mjs
      - name: Keep strictly bounded current source evidence one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r366-original38
          path: /tmp/dic33-r366/
          retention-days: 1
          if-no-files-found: warn

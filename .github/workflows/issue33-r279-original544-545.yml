name: DIC Issue33 R279 changed-title original544 545
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r279-original544-545.yml
      - tests/coffee-issue33-r279-original544-545.test.mjs
      - scripts/audit/issue33-r279-original544-545-check.mjs
      - docs/workstreams/ops-issue33-r279-reading-original544-545-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r279-original544-545.yml
      - tests/coffee-issue33-r279-original544-545.test.mjs
      - scripts/audit/issue33-r279-original544-545-check.mjs
      - docs/workstreams/ops-issue33-r279-reading-original544-545-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and adversarial changed-identity regression
        run: node --test tests/coffee-issue33-r279-original544-545.test.mjs
      - name: Bounded guarded exact selected product HTTPS and actual parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '544,545'
          DIC_ISSUE33_FOCUSED_IDENTITY_NEGATIVE_NUMBERS: '544,545'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r279
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Hash exact source and verify conservative Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r279
          DIC_R279_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R279_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r279-original544-545-check.mjs
      - name: Preserve source-bound credential-free evidence one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r279-original544-545
          path: /tmp/dic33-r279/
          retention-days: 1
          if-no-files-found: warn

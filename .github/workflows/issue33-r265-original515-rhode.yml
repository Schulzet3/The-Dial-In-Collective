name: DIC Issue33 R265 original515 Rhode Scholar current selected
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r265-original515-rhode.yml
      - tests/coffee-issue33-r265-515-rhode-source.test.mjs
      - scripts/audit/issue33-r265-515-rhode-check.mjs
      - docs/workstreams/ops-issue33-r265-515-rhode-live-source-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r265-original515-rhode.yml
      - tests/coffee-issue33-r265-515-rhode-source.test.mjs
      - scripts/audit/issue33-r265-515-rhode-check.mjs
      - docs/workstreams/ops-issue33-r265-515-rhode-live-source-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: R265 current selected shape and hostile source regressions
        run: node --test tests/coffee-issue33-r265-515-rhode-source.test.mjs
      - name: Fresh exact selected official HTTPS parser Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '515'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r265
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact official selected raw HTML SHA and field afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r265
          DIC_R265_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R265_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r265-515-rhode-check.mjs
      - name: Expiring raw HTML and source reports for independent verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r265-original515
          path: /tmp/dic33-r265/
          retention-days: 1
          if-no-files-found: warn

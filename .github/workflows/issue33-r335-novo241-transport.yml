name: DIC Issue33 R335 Novo241 bounded runner transport diagnosis
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r335-novo241-transport.yml
      - scripts/audit/issue33-r335-novo-241-transport.mjs
      - tests/coffee-issue33-r335-novo-241.test.mjs
      - docs/workstreams/ops-issue33-r335-novo241-20261119.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r335-novo241-transport.yml
      - scripts/audit/issue33-r335-novo-241-transport.mjs
      - tests/coffee-issue33-r335-novo-241.test.mjs
      - docs/workstreams/ops-issue33-r335-novo241-20261119.md
permissions:
  contents: read
jobs:
  novo241-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Strict transport challenge identity and negative regressions
        run: node --test tests/coffee-issue33-r335-novo-241.test.mjs
      - name: At most three guarded first-party public HTTPS runner probes, strict selected H1/parser/UI
        env:
          DIC_R335_RUN: '1'
          DIC_R335_DIR: /tmp/dic33-r335
          DIC_R335_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R335_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r335-novo-241-transport.mjs
      - name: One-day public-source diagnostic; UNAVAILABLE remains a real failed required source
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r335-novo241
          path: /tmp/dic33-r335/
          retention-days: 1
          if-no-files-found: warn

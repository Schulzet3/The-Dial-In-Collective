name: DIC encrypted Drive-copy isolated restore (weekly + manual, no live writes)
# Encrypted recovery: manual owner-selected Drive-verified ZIP or weekly recent
# scheduled GitHub archive. First scheduled test pins the previously independently
# Drive-verified Nov 1 2026 ZIP; later runs report GH-only offsite proof limitation.
# No production DB writes, extra exports, or automatic Netlify publication.
on:
  # 13:17 UTC Tuesday; separate from Sunday fresh-snapshot restore and daily exports.
  # GitHub scheduled jobs are best effort and may run late.
  schedule:
    - cron: '17 13 * * 2'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub scheduled backup run ID matching the verified Drive ZIP
        type: string
        required: true
      verified_drive_zip_sha256:
        description: Independently verified SHA-256 of the exact PRIVATE Drive ZIP
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: dic-saved-drive-archive-restore
  cancel-in-progress: false
jobs:
  offline-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DIC_ARCHIVE_PROJECT_REF: azviqqejypsefzilgonr
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve one existing archived source (scheduled or manual)
        env:
          MANUAL_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          MANUAL_DRIVE_SHA256: ${{ inputs.verified_drive_zip_sha256 }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            node scripts/backups/select-archived-restore-source.mjs
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'DIC_SOURCE_RUN_ID=%s\n' "$MANUAL_SOURCE_RUN_ID" >> "$GITHUB_ENV"
            printf 'DIC_EXPECTED_ZIP_SHA256=%s\n' "$MANUAL_DRIVE_SHA256" >> "$GITHUB_ENV"
            echo 'DIC_ARCHIVE_SOURCE_PROOF=independent-drive-manual' >> "$GITHUB_ENV"
          else
            echo "::error::Unexpected event; no restore action permitted"; exit 2
          fi
      - name: Require configured recovery secret and exact archive source
        env:
          DIC_ARCHIVE_AGE_IDENTITY: ${{ secrets.DIC_ARCHIVE_AGE_IDENTITY }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$DIC_ARCHIVE_AGE_IDENTITY" ]]; then
            echo '::error::BLOCKED: DIC_ARCHIVE_AGE_IDENTITY absent; no saved ciphertext has been decrypted'
            exit 2
          fi
          if [[ ! "$DIC_SOURCE_RUN_ID" =~ ^[1-9][0-9]{7,15}$ ||
                ! "$DIC_EXPECTED_ZIP_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo '::error::Invalid scheduled backup run ID or independent Drive digest'
            exit 2
          fi
      - name: Verify scheduled backup provenance and scope of archive hash evidence
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DIC_SOURCE_RUN_ID" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DIC_SOURCE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          python3 - "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/artifacts.json" <<'PY'
          import json,os,re,sys
          run=json.load(open(sys.argv[1])); listing=json.load(open(sys.argv[2]))
          requested=os.environ['DIC_SOURCE_RUN_ID']; expected=os.environ['DIC_EXPECTED_ZIP_SHA256']; proof=os.environ['DIC_ARCHIVE_SOURCE_PROOF']
          if (str(run.get('id'))!=requested or run.get('event')!='schedule' or
              run.get('head_branch')!='main' or run.get('conclusion')!='success' or
              run.get('path')!='.github/workflows/nightly-backup.yml'):
              raise SystemExit('Not a completed scheduled main-branch encrypted backup')
          if listing.get('total_count',101)>100: raise SystemExit('Incomplete artifact inventory')
          files=[x for x in listing.get('artifacts',[]) if x.get('name')=='dic-encrypted-nightly-'+requested]
          if len(files)!=1 or files[0].get('expired') or files[0].get('size_in_bytes',0)<128:
              raise SystemExit('Unique live ciphertext artifact unavailable')
          if files[0].get('digest')!='sha256:'+expected:
              raise SystemExit('GitHub artifact ZIP digest differs from expected source-bound SHA-256')
          if proof in ('independent-drive-manual','independent-drive-nov1-2026'):
              print('PASS: Exact historical scheduled artifact matches independently verified private Drive ZIP SHA-256')
          elif proof=='github-artifact-only':
              print('PASS: GitHub scheduled source and artifact digest verified; Drive copy NOT independently checked by this job')
          else:
              raise SystemExit('Missing recognized Drive/source evidence classification')
          PY
      - name: Download verified original ciphertext artifact (no new backup)
        run: |
          set -Eeuo pipefail
          mkdir -m 700 "$RUNNER_TEMP/source"
          gh run download "$DIC_SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "dic-encrypted-nightly-$DIC_SOURCE_RUN_ID" --dir "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/backup.age"
      - name: Install age and restore exact saved ciphertext into disconnected PostgreSQL
        env:
          DIC_ARCHIVE_AGE_IDENTITY: ${{ secrets.DIC_ARCHIVE_AGE_IDENTITY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          bash scripts/backups/restore-saved-age-archive.sh "$RUNNER_TEMP/source/backup.age"
      - name: Cleanup retained ciphertext from runner scratch
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/source" "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/artifacts.json"

name: DIC controlled public roaster source probe
on:
  push:
    branches:
      - development/backend-foundation
    paths:
      - 'scripts/audit/**'
      - 'src/server/**'
      - .github/workflows/roaster-source-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unprivileged-public-pages:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dic-live-probe]') || contains(github.event.head_commit.message, '[dic-platform-probe]') || contains(github.event.head_commit.message, '[dic-issue33-source-probe]') || contains(github.event.head_commit.message, '[dic-issue33-ready-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Probe exact Sweet Bloom Wuri with official verification parser (no credentials)
        if: contains(github.event.head_commit.message, '[dic-live-probe]')
        run: node scripts/audit/wuri-official-verifier-live-probe.mjs
      - name: Safely probe public HTTPS product pages
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dic-live-probe]')
        run: node scripts/audit/coffee-roaster-live-probe.mjs
      - name: Validate real compressed adaptive product extraction and full semantic parity
        if: contains(github.event.head_commit.message, '[dic-live-probe]')
        run: node scripts/audit/coffee-adaptive-public-acceptance.mjs
      - name: Check public platform-specific product endpoints without tokens
        if: contains(github.event.head_commit.message, '[dic-platform-probe]')
        run: node scripts/audit/public-product-endpoint-probe.mjs
      - name: Record Issue33 exact selected current product source provenance without credentials
        if: contains(github.event.head_commit.message, '[dic-issue33-source-probe]')
        run: node scripts/audit/issue33-current-selected-source-probe.mjs
      - name: Real full public-page extraction acceptance for latest READY Issue33 fixes
        if: contains(github.event.head_commit.message, '[dic-issue33-ready-live]')
        env:
          DIC_ISSUE33_READY_LIVE_OUTDIR: ${{ runner.temp }}/dic33-ready-live
        run: node scripts/audit/issue33-recent-ready-live-probe.mjs
      - name: Preserve exact-source, credential-free live extraction evidence
        if: always() && contains(github.event.head_commit.message, '[dic-issue33-ready-live]')
        uses: actions/upload-artifact@v7
        with:
          name: dic33-ready-live-${{ github.run_id }}
          path: ${{ runner.temp }}/dic33-ready-live/
          if-no-files-found: error
          retention-days: 30
  isolated-size-study:
    if: contains(github.event.head_commit.message, '[dic-size-study]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Compare bounded HTML parsers in disposable runner temp copies
        run: node --expose-gc scripts/audit/coffee-extractor-2mb-study.mjs

  issue33-all77-direct-current:
    if: contains(github.event.head_commit.message, '[dic-issue33-77-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Probe all 77 exact official URLs through isolated selected-product parser
        run: node scripts/audit/issue33-current-all77-source-probe.mjs

  issue33-oversized-products:
    if: contains(github.event.head_commit.message, '[dic-issue33-oversize-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Retry only two safe oversized selected-product URLs at the preexisting product-only cap
        run: node scripts/audit/issue33-oversized-source-probe.mjs

  owner77-evidence:
    if: contains(github.event.head_commit.message, '[dic-issue33-owner77]')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Audit all 77 owner decisions against current official page and Add Coffee preview
        env:
          DIC_OWNER77_PUBLIC_CAPTURE_DIR: ${{ runner.temp }}/dic33-owner77-public-sources
        run: node scripts/audit/issue33-owner77-evidence-probe.mjs
      - name: Retain bounded selected public HTML and 77-row actual parser readback for independent owner decision certification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-owner77-current-public-${{ github.run_id }}
          path: ${{ runner.temp }}/dic33-owner77-public-sources/
          if-no-files-found: error
          retention-days: 1

  issue33-original603-focused-current-review:
    if: contains(github.event.head_commit.message, '[dic-issue33-focus]') || contains(github.event.head_commit.message, '[dic-issue33-next20]') || contains(github.event.head_commit.message, '[dic-issue33-third20]') || contains(github.event.head_commit.message, '[dic-issue33-fourth20]') || contains(github.event.head_commit.message, '[dic-issue33-fifth20]') || contains(github.event.head_commit.message, '[dic-issue33-sixth4]') || contains(github.event.head_commit.message, '[dic-issue33-seventh4]') || contains(github.event.head_commit.message, '[dic-issue33-eighth3]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Capture bounded original603 public current official selected product pages
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: ${{ runner.temp }}/dic33-original603-focused
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: ${{ contains(github.event.head_commit.message, '[dic-issue33-seventh4]') && '3,10,35,550' || contains(github.event.head_commit.message, '[dic-issue33-eighth3]') && '119,268,316' || contains(github.event.head_commit.message, '[dic-issue33-sixth4]') && '16,25,31,490' || contains(github.event.head_commit.message, '[dic-issue33-fifth20]') && '14,26,59,62,98,101,107,119,152,263,269,283,484,499,502,517,520,526,532,571' || contains(github.event.head_commit.message, '[dic-issue33-fourth20]') && '23,29,38,65,92,122,125,126,132,149,176,191,194,200,215,248,251,287,290,320' || contains(github.event.head_commit.message, '[dic-issue33-third20]') && '268,286,307,316,319,322,346,361,391,394,409,436,439,445,451,454,457,469,475,490' || contains(github.event.head_commit.message, '[dic-issue33-next20]') && '40,58,67,79,97,100,106,118,127,148,151,157,190,214,217,220,247,253,259,262' || '' }}
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Retain source evidence privately for individual manual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-original603-focused-${{ github.run_id }}
          path: ${{ runner.temp }}/dic33-original603-focused/
          if-no-files-found: error
          retention-days: 1

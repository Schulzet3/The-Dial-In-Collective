name: DIC controlled public roaster source probe
on:
  push:
    branches:
      - development/backend-foundation
    paths:
      - scripts/audit/coffee-roaster-live-probe.mjs
      - scripts/audit/mango-tree-public-probe.mjs
      - scripts/audit/mango-tree-browser-probe.py
      - src/server/coffee-product-layouts.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/agtron-roast.mjs
      - .github/workflows/roaster-source-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unprivileged-public-pages:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dic-live-probe]') || contains(github.event.head_commit.message, '[dic-mango-probe]') || contains(github.event.head_commit.message, '[dic-mango-browser]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Safely probe only public HTTPS coffee sources
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dic-live-probe]')
        run: node scripts/audit/coffee-roaster-live-probe.mjs
      - name: Diagnose Mango Tree public product only
        if: contains(github.event.head_commit.message, '[dic-mango-probe]')
        run: node scripts/audit/mango-tree-public-probe.mjs

      - uses: actions/setup-python@v6
        if: contains(github.event.head_commit.message, '[dic-mango-browser]')
        with:
          python-version: '3.12'
      - name: Install isolated public browser
        if: contains(github.event.head_commit.message, '[dic-mango-browser]')
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Inspect public shop and iframe product text (no login)
        if: contains(github.event.head_commit.message, '[dic-mango-browser]')
        run: python scripts/audit/mango-tree-browser-probe.py

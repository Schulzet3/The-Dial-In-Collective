name: DIC controlled public roaster source probe
on:
  push:
    branches:
      - development/backend-foundation
    paths:
      - 'scripts/audit/**'
      - 'src/server/**'
      - .github/workflows/roaster-source-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unprivileged-public-pages:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dic-live-probe]') || contains(github.event.head_commit.message, '[dic-platform-probe]') || contains(github.event.head_commit.message, '[dic-issue33-source-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Probe exact Sweet Bloom Wuri with official verification parser (no credentials)
        if: contains(github.event.head_commit.message, '[dic-live-probe]')
        run: node scripts/audit/wuri-official-verifier-live-probe.mjs
      - name: Safely probe public HTTPS product pages
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dic-live-probe]')
        run: node scripts/audit/coffee-roaster-live-probe.mjs
      - name: Validate real compressed adaptive product extraction and full semantic parity
        if: contains(github.event.head_commit.message, '[dic-live-probe]')
        run: node scripts/audit/coffee-adaptive-public-acceptance.mjs
      - name: Check public platform-specific product endpoints without tokens
        if: contains(github.event.head_commit.message, '[dic-platform-probe]')
        run: node scripts/audit/public-product-endpoint-probe.mjs
      - name: Record Issue33 exact selected current product source provenance without credentials
        if: contains(github.event.head_commit.message, '[dic-issue33-source-probe]')
        run: node scripts/audit/issue33-current-selected-source-probe.mjs
  isolated-size-study:
    if: contains(github.event.head_commit.message, '[dic-size-study]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Compare bounded HTML parsers in disposable runner temp copies
        run: node --expose-gc scripts/audit/coffee-extractor-2mb-study.mjs

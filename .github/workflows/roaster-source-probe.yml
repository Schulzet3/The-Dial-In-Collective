# Issue33 original603 #13/#19/#25 exact current selected product checks (identity, geographic and method claims): [dic-issue33-fiftythird3].
# Issue33 original603 #1/#70/#73 fresh selected-product provenance readback: [dic-issue33-fiftysecond3].
# Issue33 controlled public selected-product source review: each commit selector uses a bounded original603 cohort.
# Issue33 #97 original603 fresh strict exact selected unnamed-decaf Water Process contract: [dic-issue33-fiftyfirst1].
# Issue33 #7 exact same-handle/selected-product canonical collection fallback with identity guard: [dic-issue33-fiftieth1].
# Issue33 fresh source-only original603 #4/#7/#28 independent location, varietal and disputed geography review: [dic-issue33-fortyninth3].
# Issue33 #154 named producer vs named estate and #196 farmer vs estate process controls: [dic-issue33-fortyeighth1].
# Issue33 #570/#585/#600 current exact selected source and safe American roast-legend negative control: [dic-issue33-fortyfifth3].
# Issue33 #575/#596/#593 independently scoped new current selected cohort `[dic-issue33-fortythird3]`.

name: DIC Issue33 R119 original selected 565
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r119-565.yml
      - scripts/audit/issue33-r119-565-check.mjs
      - tests/coffee-issue33-r119-565.test.mjs
      - docs/workstreams/ops-issue33-r119-565-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r119-565.yml
      - scripts/audit/issue33-r119-565-check.mjs
      - tests/coffee-issue33-r119-565.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Real-parser focused positive/negative selected product regressions
        run: node --test tests/coffee-issue33-r119-565.test.mjs
      - name: Guarded public selected product HTTPS, parser and Add Coffee/Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '565'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r119
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify actual current identity, direct mixed process, source SHA and hashes
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r119
          DIC_ISSUE33_R119_VERIFY: '1'
        run: node scripts/audit/issue33-r119-565-check.mjs
      - name: Retain bounded public official HTML and source artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r119-original565
          path: /tmp/dic33-r119/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R412 original126 127 exact selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r412-original126-127.yml'
      - 'scripts/audit/issue33-r412-original126-127-check.mjs'
      - 'docs/workstreams/ops-issue33-r412-original126-127-20261122.md'
  push:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r412-original126-127.yml'
      - 'scripts/audit/issue33-r412-original126-127-check.mjs'
permissions:
  contents: read
jobs:
  selected-original126-127:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected-product producer and other-coffee hostile regressions
        run: node --test tests/coffee-issue33-r408-producer-farm-caption.test.mjs tests/coffee-issue33-r138-118.test.mjs
      - name: Verify exact checked-out commit
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$DIC_EXPECTED_SHA"
      - name: Guarded exact official HTTPS original 126 127 parser and unsaved UI
        env:
          DIC_R412_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '126,127'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r412
        run: GITHUB_SHA="$DIC_R412_EXACT_SHA" node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict own selected identities source HTML SHA and cross-coffee guards
        if: always()
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r412
        run: node scripts/audit/issue33-r412-original126-127-check.mjs
      - name: Preserve bounded current first-party evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r412-original126-127
          path: /tmp/dic33-r412/
          retention-days: 1
          if-no-files-found: warn

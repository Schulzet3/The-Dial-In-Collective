name: DIC weekly recovery verification

on:
  workflow_dispatch:
  schedule:
    - cron: '43 10 * * 0'

permissions:
  contents: read

concurrency:
  group: dic-weekly-isolated-restore
  cancel-in-progress: false

jobs:
  isolated-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: azviqqejypsefzilgonr
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore all user application tables to a disposable, network-isolated PostgreSQL
        run: bash scripts/backups/isolated-recovery-drill.sh

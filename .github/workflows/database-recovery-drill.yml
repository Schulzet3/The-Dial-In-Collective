name: DIC weekly recovery verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/database-recovery-drill.yml
      - scripts/backups/isolated-recovery-drill.sh
      - scripts/backups/capture-recovery-snapshot.sh
      - scripts/backups/assert-recovery-inventory.sh
  workflow_dispatch:
  schedule:
    - cron: '43 10 * * 0'

permissions:
  contents: read

concurrency:
  group: dic-weekly-isolated-restore
  cancel-in-progress: false

jobs:
  isolated-restore:
    # Pin OS so the Oct-Nov 2026 ubuntu-latest migration does not change backup behavior.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: azviqqejypsefzilgonr
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore real snapshot in a disposable, network-isolated PostgreSQL
        run: bash scripts/backups/isolated-recovery-drill.sh

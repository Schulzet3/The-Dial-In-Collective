name: DIC Issue33 R215 original325 327 selected official evidence
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r215-original325-327.yml
      - tests/coffee-issue33-r215-original325-327.test.mjs
      - scripts/audit/issue33-r215-original325-327-check.mjs
      - docs/workstreams/ops-issue33-r215-325-327-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-decaffeination-method.mjs
      - site/cloud/coffee-url-autofill.js
      - src/server/coffee-selected-offer-h2.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-url-guard.mjs
      - tests/coffee-issue33-r217-workflow-dependencies.test.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r215-original325-327.yml
      - tests/coffee-issue33-r215-original325-327.test.mjs
      - scripts/audit/issue33-r215-original325-327-check.mjs
      - docs/workstreams/ops-issue33-r215-325-327-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-decaffeination-method.mjs
      - site/cloud/coffee-url-autofill.js
      - src/server/coffee-selected-offer-h2.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-url-guard.mjs
      - tests/coffee-issue33-r217-workflow-dependencies.test.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Seven selected positive and hostile actual-parser tests
        run: node --test tests/coffee-issue33-r215-original325-327.test.mjs
      - name: Validate selected-source dependency event filters
        run: node --test tests/coffee-issue33-r217-workflow-dependencies.test.mjs
      - name: Bounded chosen public HTTPS and Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '325,326,327'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r215
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected raw SHA and current parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r215
          DIC_R215_EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r215-original325-327-check.mjs
      - name: Capture bounded source diagnostics for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r215-original325-327
          path: /tmp/dic33-r215/
          retention-days: 1
          if-no-files-found: warn

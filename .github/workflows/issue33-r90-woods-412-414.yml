name: DIC Issue33 R90 original603 Woods 412-414 exact selected
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r90-woods-412-414.yml
      - scripts/audit/issue33-r90-woods-412-414-check.mjs
      - tests/coffee-issue33-r90-woods-412-414.test.mjs
      - docs/workstreams/ops-issue33-r90-woods-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r90-woods-412-414.yml
      - scripts/audit/issue33-r90-woods-412-414-check.mjs
      - tests/coffee-issue33-r90-woods-412-414.test.mjs
permissions:
  contents: read
jobs:
  exact-current-woods:
    name: original603-412-414-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and hostile source contracts
        run: node --test tests/coffee-issue33-r90-woods-412-414.test.mjs
      - name: Guarded fresh official HTTPS, current parser and Add Coffee/Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '412,413,414'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r90-woods
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Selected exact H1, raw SHA, canonical and isolation afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r90-woods
          DIC_ISSUE33_R90_VERIFY: '1'
        run: node scripts/audit/issue33-r90-woods-412-414-check.mjs
      - name: Short-lived bounded official source and proof artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r90-woods-412-414
          path: /tmp/dic33-r90-woods/
          retention-days: 1
          if-no-files-found: warn

name: DIC protected main release-controller acceptance
# Unit and inert real-Git race acceptance run on every main ops change and PR.
# This never contacts Netlify or publishes source; no secrets required.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dic-release-controller-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-controller-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Syntax validation (no external calls)
        run: node --check scripts/release/one-use-claim.mjs && node --check scripts/release/chat-release-request.mjs && node --check scripts/release/controlled-release-runner.mjs
      - name: Verify one-use authorization, replay denial and real disposable-Git race
        run: node --test tests/one-use-claim.test.mjs tests/one-use-git-race.test.mjs tests/controlled-release-runner.test.mjs tests/exclusive-release-workflow.test.mjs tests/chat-release-request.test.mjs tests/chat-release-workflow-policy.test.mjs
      - name: Enforce sole manual fallback and precisely scoped chat request trigger
        run: |
          test -f .github/workflows/dic-single-use-release.yml
          ! grep -E '^  (push|pull_request|schedule):' .github/workflows/dic-single-use-release.yml
          test -f docs/RELEASE_CONTROLLER_MAIN_INSTALL_2026-10-20.md
          test -f .github/workflows/dic-chat-approved-release.yml
          grep -Fq "docs/RELEASE_REQUEST.json" .github/workflows/dic-chat-approved-release.yml
          ! grep -E '^  (workflow_dispatch|pull_request|schedule):' .github/workflows/dic-chat-approved-release.yml

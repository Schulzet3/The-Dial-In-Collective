name: DIC main release-controller acceptance
# Unit and inert real-Git race acceptance run on every main ops change and PR.
# Advisory acceptance on private GitHub Free; it does not enforce branch protection.
# This never contacts Netlify or publishes source; no secrets required.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dic-release-controller-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-controller-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Syntax validation (no external calls)
        run: |
          node --check scripts/backups/scheduled-backup-guard.mjs
          node --check scripts/release/one-use-claim.mjs
          node --check scripts/release/chat-release-request.mjs
          node --check scripts/release/controlled-release-runner.mjs
          node --check scripts/release/retrieve-certified-release-bundle.mjs
          node --check scripts/release/migration-risk.mjs
          node --check scripts/release/release-queue.mjs
          for script in scripts/backups/create-nightly-encrypted-dump.sh scripts/backups/isolated-recovery-drill.sh scripts/audit/isolated-backup-snapshot-regression.sh; do
            bash -n "$script"
          done
          for script in scripts/backups/capture-recovery-snapshot.sh scripts/backups/assert-recovery-inventory.sh tests/backups/snapshot-regression.sh; do
            sh -n "$script"
          done
      - name: Verify one-use authorization, replay denial and real disposable-Git race
        run: node --test tests/one-use-claim.test.mjs tests/one-use-git-race.test.mjs tests/controlled-release-runner.test.mjs tests/exclusive-release-workflow.test.mjs tests/chat-release-request.test.mjs tests/chat-release-workflow-policy.test.mjs tests/backup-security.test.mjs tests/backup-snapshot-policy.test.mjs tests/scheduled-backup-guard.test.mjs tests/release-migration-risk.test.mjs tests/release-queue.test.mjs tests/release-controller-queue-policy.test.mjs tests/weekly-source-snapshot.test.mjs tests/retrieve-certified-release-bundle.test.mjs tests/download-certified-artifacts.test.mjs tests/discover-certified-artifacts.test.mjs tests/verify-release-artifact-receipt.test.mjs
      - name: Verify concurrent-write snapshot consistency with synthetic isolated PostgreSQL
        run: bash scripts/audit/isolated-backup-snapshot-regression.sh
      - name: Enforce sole manual fallback and precisely scoped chat request trigger
        run: |
          test -f .github/workflows/dic-single-use-release.yml
          ! grep -E '^  (push|pull_request|schedule):' .github/workflows/dic-single-use-release.yml
          test -f docs/RELEASE_CONTROLLER_MAIN_INSTALL_2026-10-20.md
          test -f .github/workflows/dic-chat-approved-release.yml
          grep -Fq "docs/RELEASE_REQUEST.json" .github/workflows/dic-chat-approved-release.yml
          ! grep -E '^  (workflow_dispatch|pull_request|schedule):' .github/workflows/dic-chat-approved-release.yml

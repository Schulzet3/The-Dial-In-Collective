name: DIC Issue33 R411 original124 125 exact selected Foster official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r411-foster-original124-125.yml'
      - 'scripts/audit/issue33-r411-foster-original124-125-check.mjs'
      - 'docs/workstreams/ops-issue33-r411-foster-original124-125-20261122.md'
  push:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r411-foster-original124-125.yml'
      - 'scripts/audit/issue33-r411-foster-original124-125-check.mjs'
permissions:
  contents: read
jobs:
  selected-original124-125:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected-source cross-coffee and attribution adversarial regressions
        run: node --test tests/coffee-issue33-r138-118.test.mjs tests/coffee-issue33-r408-producer-farm-caption.test.mjs
      - name: Checked out exact commit
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$DIC_EXPECTED_SHA"
      - name: Guarded public HTTPS actual selected official #124 #125 parser and unsaved UI
        env:
          DIC_R411_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '124,125'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r411
        run: GITHUB_SHA="$DIC_R411_EXACT_SHA" node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict primary-source identity, raw HTML SHA, recipe and no archived fact transfer
        if: always()
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r411
        run: node scripts/audit/issue33-r411-foster-original124-125-check.mjs
      - name: Retain current first-party raw captures and evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r411-foster-original124-125
          path: /tmp/dic33-r411/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R427 original322 323 current selected official evidence
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r427-westrock322-323.yml'
      - 'scripts/audit/issue33-r427-westrock322-323-check.mjs'
      - 'tests/issue33-r427-westrock322-323.test.mjs'
  push:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r427-westrock322-323.yml'
      - 'scripts/audit/issue33-r427-westrock322-323-check.mjs'
      - 'tests/issue33-r427-westrock322-323.test.mjs'
permissions:
  contents: read
jobs:
  current-official-322-323:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Verify exact source and focused positive hostile contracts
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$DIC_EXPECTED_SHA"
          node --check scripts/audit/issue33-r427-westrock322-323-check.mjs
          node --test tests/issue33-r427-westrock322-323.test.mjs
      - name: Required guarded first-party current product and unsaved UI
        env:
          DIC_R427_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '322,323'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r427
        run: GITHUB_SHA="$DIC_R427_SHA" node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently rehash exact chosen seller source and parser fields
        if: always()
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_R427_RUN: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r427
        run: node scripts/audit/issue33-r427-westrock322-323-check.mjs
      - name: Retain private bounded raw HTML and afterproof for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r427-exact-selected-current
          path: /tmp/dic33-r427/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R248 original421-423 Alaska selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r248-original421-423.yml
      - tests/coffee-issue33-r248-original421-423.test.mjs
      - scripts/audit/issue33-r248-original421-423-check.mjs
      - docs/workstreams/ops-issue33-r248-421-423-alaska-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-semantic-specs.mjs
      - src/server/coffee-product-prose.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r248-original421-423.yml
      - tests/coffee-issue33-r248-original421-423.test.mjs
      - scripts/audit/issue33-r248-original421-423-check.mjs
      - docs/workstreams/ops-issue33-r248-421-423-alaska-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-semantic-specs.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and adversarial original selected-coffee regressions
        run: node --test tests/coffee-issue33-r248-original421-423.test.mjs
      - name: Current official selected parser Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '421,423'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r248
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently validate raw SHA and exact current evidence
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r248
          DIC_R248_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r248-original421-423-check.mjs
      - name: Preserve bounded official raw HTML one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r248-original421-423
          path: /tmp/dic33-r248/
          retention-days: 1
          if-no-files-found: warn

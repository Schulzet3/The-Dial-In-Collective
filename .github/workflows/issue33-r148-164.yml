name: DIC Issue33 R148 original164 selected Ironclad Worka Sakaro
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r148-164.yml
      - scripts/audit/issue33-r148-164-check.mjs
      - tests/coffee-issue33-r148-164.test.mjs
      - docs/workstreams/ops-issue33-r148-164-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r148-164.yml
      - scripts/audit/issue33-r148-164-check.mjs
      - tests/coffee-issue33-r148-164.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Direct selected product and adversarial fixtures
        run: node --test tests/coffee-issue33-r148-164.test.mjs
      - name: Guarded bounded exact current selected official HTTPS and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '164'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r148
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Selected raw HTML identity and actual parser strict afterproof
        if: always()
        env:
          DIC_ISSUE33_R148_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r148
        run: node scripts/audit/issue33-r148-164-check.mjs
      - name: Preserve source and failure artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r148-original164
          path: /tmp/dic33-r148/
          retention-days: 2
          if-no-files-found: warn

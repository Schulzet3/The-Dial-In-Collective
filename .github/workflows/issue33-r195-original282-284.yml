name: DIC Issue33 R195 original282-284 current selected
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r195-original282-284.yml
      - scripts/audit/issue33-r195-original282-284-check.mjs
      - tests/coffee-issue33-r195-original282-284.test.mjs
      - docs/workstreams/ops-issue33-r195-282-284-20261114.md
      - src/server/coffee-page-metadata.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r195-original282-284.yml
      - scripts/audit/issue33-r195-original282-284-check.mjs
      - tests/coffee-issue33-r195-original282-284.test.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Current selected positive and hostile parser regressions
        run: node --test tests/coffee-issue33-r195-original282-284.test.mjs
      - name: Guarded public selected original URLs and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '282,284'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r195
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify identity source role and actual parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r195
        run: node scripts/audit/issue33-r195-original282-284-check.mjs
      - name: Retain one-day bounded public source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r195-original282-284-public-source
          path: /tmp/dic33-r195/
          retention-days: 1
          if-no-files-found: warn

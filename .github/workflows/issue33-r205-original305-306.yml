name: DIC Issue33 R205 original305 306 selected current source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r205-original305-306.yml
      - scripts/audit/issue33-r205-original305-306-check.mjs
      - tests/coffee-issue33-r205-original305-306.test.mjs
      - docs/workstreams/ops-issue33-r205-305-306-20261114.md
      - src/server/coffee-page-metadata.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r205-original305-306.yml
      - scripts/audit/issue33-r205-original305-306-check.mjs
      - tests/coffee-issue33-r205-original305-306.test.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Five focused selected product positives and hostile negatives
        run: node --test tests/coffee-issue33-r205-original305-306.test.mjs
      - name: Guarded exact current official selected HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '305,306'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r205
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent selected source and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r205
          DIC_R205_EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r205-original305-306-check.mjs
      - name: Retain bounded official HTML and proof for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r205-original305-306
          path: /tmp/dic33-r205/
          retention-days: 1
          if-no-files-found: warn

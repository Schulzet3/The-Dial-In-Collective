# Final admin invitation visual acceptance includes synthetic 390px private operator portal.
name: DIC private visual review
on:
  push:
    branches: [work/visual-refresh-20261015, development/backend-foundation]
    paths:
      - 'site/**'
      - 'tests/browser/**'
      - 'tests/cloud-fixtures/**'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'build_cloud.mjs'
      - 'scripts/audit/site-integrity.mjs'
      - '.github/workflows/visual-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Lint all active JavaScript and review scripts
        run: npm run lint
      - run: npm run build:cloud
        env:
          SUPABASE_URL: https://azviqqejypsefzilgonr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_private_visual_review_nonfunctional
      - name: Verify every shipped file and transitive module import
        run: node scripts/audit/site-integrity.mjs --dist
      - name: Prepare isolated browser only
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          mkdir -p /tmp/dic-render-assets
          curl --fail --location --max-time 40 'https://raw.githubusercontent.com/google/fonts/main/ofl/fraunces/Fraunces%5BSOFT%2CWONK%2Copsz%2Cwght%5D.ttf' -o /tmp/dic-render-assets/Fraunces.ttf
          curl --fail --location --max-time 40 'https://raw.githubusercontent.com/JetBrains/JetBrainsMono/master/fonts/ttf/JetBrainsMono-Regular.ttf' -o /tmp/dic-render-assets/JetBrainsMono.ttf
      - run: python tests/browser/cloud_owner_qa.py
      - name: Verify real service-worker cached cold reopen in isolated Chromium
        run: python tests/browser/pwa_offline_qa.py
      - name: Synthetic owner-only invitation portal mobile acceptance
        run: python tests/browser/admin_invitation_qa.py
      - run: python tests/browser/visual_review.py
        env:
          DIC_FONT_DIR: /tmp/dic-render-assets
      - uses: actions/upload-artifact@v7
        with:
          name: dic-visual-review-screenshots
          path: qa_artifacts/visual-review/
          retention-days: 7

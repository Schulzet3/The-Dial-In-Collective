name: DIC Issue33 R156 exact selected Kona Peaberry 182
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r156-182.yml
      - scripts/audit/issue33-r156-182-check.mjs
      - tests/coffee-issue33-r156-182.test.mjs
      - docs/workstreams/ops-issue33-r156-182-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r156-182.yml
      - scripts/audit/issue33-r156-182-check.mjs
      - tests/coffee-issue33-r156-182.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected roast options and adversarial regression tests
        run: node --test tests/coffee-issue33-r156-182.test.mjs
      - name: Guarded actual original603 chosen official HTTPS and real parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '182'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r156
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict current selected purchase-roast source afterproof
        if: always()
        env:
          DIC_ISSUE33_R156_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r156
        run: node scripts/audit/issue33-r156-182-check.mjs
      - name: Preserve full official HTML and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r156-selected-182
          path: /tmp/dic33-r156/
          retention-days: 2
          if-no-files-found: warn

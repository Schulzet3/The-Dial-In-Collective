name: DIC Issue33 R292 selected original518
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r292-original518.test.mjs
      - scripts/audit/issue33-r292-original518-check.mjs
      - .github/workflows/issue33-r292-original518.yml
      - docs/workstreams/ops-issue33-r292-original518-20261118.md
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r292-original518.test.mjs
      - scripts/audit/issue33-r292-original518-check.mjs
      - .github/workflows/issue33-r292-original518.yml
      - docs/workstreams/ops-issue33-r292-original518-20261118.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected current and hostile parser tests
        run: node --test tests/coffee-issue33-r292-original518.test.mjs
      - name: Guarded fresh exact official public HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '518'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r292
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify raw hash selected identity parser editable UI and no cross-coffee transfer
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r292
          DIC_R292_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R292_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r292-original518-check.mjs
      - name: Save audit only raw sources for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r292-original518
          path: /tmp/dic33-r292/
          retention-days: 1
          if-no-files-found: warn

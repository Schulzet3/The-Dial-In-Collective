name: DIC Issue33 R163 original204 exact selected natural review
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r163-204.yml
      - scripts/audit/issue33-r163-204-check.mjs
      - tests/coffee-issue33-r163-204.test.mjs
      - docs/workstreams/ops-issue33-r163-204-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r163-204.yml
      - scripts/audit/issue33-r163-204-check.mjs
      - tests/coffee-issue33-r163-204.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused positive and adversarial source tests
        run: node --test tests/coffee-issue33-r163-204.test.mjs
      - name: Guarded exact current official HTTPS and real parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '204'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r163
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict current selected source and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_R163_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r163
        run: node scripts/audit/issue33-r163-204-check.mjs
      - name: Preserve HTML, source evidence and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r163-original204
          path: /tmp/dic33-r163/
          retention-days: 2
          if-no-files-found: warn

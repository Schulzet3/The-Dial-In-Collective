# One-time isolated official Supabase CLI migration name generation.
# Never links to, reads secrets from, or writes to a hosted database.
name: DIC deleted-member shot retention CLI preparation
on:
  push:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/dic-deleted-member-shot-retention-cli-prep.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate new chronological name using official Supabase CLI
        run: |
          set -euo pipefail
          npx --yes supabase@latest --version
          npx --yes supabase@latest migration --help >/dev/null
          npx --yes supabase@latest migration new dic_deleted_member_shot_retention
          printf 'CLI_MIGRATION_PATH='
          find supabase/migrations -maxdepth 1 -type f -name '*_dic_deleted_member_shot_retention.sql' -printf '%p\n'
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*_dic_deleted_member_shot_retention.sql' | wc -l)" -eq 1
          echo 'This CI job creates a local filename only; nothing is applied, committed automatically, or deployed.'

name: DIC Issue33 R157 original185 exact selected Humble decaf
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r157-185.yml
      - scripts/audit/issue33-r157-185-check.mjs
      - tests/coffee-issue33-r157-185.test.mjs
      - docs/workstreams/ops-issue33-r157-185-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r157-185.yml
      - scripts/audit/issue33-r157-185-check.mjs
      - tests/coffee-issue33-r157-185.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and adversarial selected-product contracts
        run: node --test tests/coffee-issue33-r157-185.test.mjs
      - name: Current guarded original603 official HTTPS plus actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '185'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r157
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected direct source and Add Coffee afterproof
        if: always()
        env:
          DIC_ISSUE33_R157_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r157
        run: node scripts/audit/issue33-r157-185-check.mjs
      - name: Preserve raw selected HTML, evidence and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r157-selected-185
          path: /tmp/dic33-r157/
          retention-days: 2
          if-no-files-found: warn

name: DIC verify final Issue96 source and prepare documentation
# Creates only an unreferenced documentation commit; never updates refs or providers.
on:
  push:
    branches: [work/issue96-security-audit-20261023]
    paths: [.github/workflows/issue96-final-receipt.yml]
permissions:
  contents: write
  actions: read
  checks: read
jobs:
  prepare-verified-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5b1bc56c8d2d111ab70f14f1bd1bf58de4f9146d
          persist-credentials: false
      - name: Validate final CI, preserve history and prepare documentation only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import copy,datetime,json,os,pathlib,time,urllib.request
          repo='Schulzet3/The-Dial-In-Collective'
          merged='5b1bc56c8d2d111ab70f14f1bd1bf58de4f9146d'
          tested='b3599c235b6b1bff148272c5d3556b678219da66'
          tree='9843b383d38aea0d413381eeab4eb3aaaac5e82d'
          def api(method,path,data=None):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          assert os.environ['GITHUB_REF']=='refs/heads/work/issue96-security-audit-20261023'
          assert api('GET','git/ref/heads/development/backend-foundation')['object']['sha']==merged
          assert api('GET','git/ref/heads/work/issue96-security-audit-20261023')['object']['sha']==os.environ['GITHUB_SHA']
          assert api('GET','git/ref/heads/release/production')['object']['sha']=='f97b8f30c25f6d4ef30c5d79d12daf4fb0670e2f'
          pr=api('GET','pulls/98');assert pr['merged'] and pr['merge_commit_sha']==merged and pr['head']['sha']==tested
          for source in [merged,tested,'cdbca21a560cc796a282c967cd5ee4906e3055af']:
              assert api('GET','git/commits/'+source)['tree']['sha']==tree
          runs=[39910106557,39910106319,39910106359,39910106633,39910106691,39910106708]
          for run in runs:
              r=api('GET','actions/runs/'+str(run));assert r['head_sha']==tested and r['status']=='completed' and r['conclusion']=='success'
          required=['approval','validate','cloud-tests','mobile-browser-qa','sql','review']
          verified={}
          for attempt in range(30):
              checks=api('GET','commits/'+merged+'/check-runs?per_page=100')['check_runs'];verified={}
              for name in required:
                  rows=[r for r in checks if r['name']==name and r['head_sha']==merged]
                  if rows:
                      r=rows[0]
                      assert not(r['status']=='completed' and r['conclusion'] not in ('success',)),name+' did not pass'
                      if r['status']=='completed':verified[name]={'check_id':r['id'],'url':r['html_url']}
              if len(verified)==len(required):break
              time.sleep(4)
          assert len(verified)==len(required),'Postmerge checks incomplete; do not mark READY'
          assert api('GET','git/ref/heads/development/backend-foundation')['object']['sha']==merged
          root=pathlib.Path('.');files={};now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          dump=lambda data:json.dumps(data,indent=2,ensure_ascii=False)+'\n'
          q=json.loads((root/'docs/RELEASE_QUEUE.json').read_text());old=copy.deepcopy(q)
          item=next(x for x in q['items'] if x['id']=='DIC-Q-96-security-repairs')
          item.update(state='READY',pr=98,related_prs=[97,98],merged_source_sha=merged,blockers=[],ci_runs=runs,tests=[
              '673/673 local Node tests; full final exact-source CI Node/lint/build PASS. Seven PR checks across six workflows PASS at '+tested+'; all six applicable merged-source checks independently PASS at '+merged+'.',
              'Disposable PostgreSQL17.11 migration baseline, SQL suites including complete security_surface_inventory, signed-HMAC PostgREST ownership/replay/authorization and concurrent snapshot tests PASS. No production identities or database mutations.',
              'Synthetic mobile/admin, visual, real Chromium service-worker offline and packaged-app browser checks PASS. Prior byte-identical UI screenshot sample independently inspected; no physical-device or production signed-member claim.',
              'Final source inventory470 files/72863 text lines/3 binaries; no redacted credential-pattern candidates. Current production dependency audit zero known vulnerabilities. Artifact12482885419 SHA256f1548fc2cc098d337c77fc3364fc40a8f596df3eae85abbedc3d7fb2d800a671 independently matched all13 follow-up hashes; initial39 repair hashes matched prior artifact12481468441.',
              'Malformed/nested/metatag/Unicode/repeated-attribute CPU regressions PASS in isolated child processes; previously >2.5s quoted-attribute cases now21-24ms locally. No production stress test.',
              'Unchanged-production public/anonymous HTTP32/32 PASS in39905265823. Supabase readback22shots/22notes/5accounts/2Community/48receipts/43migrations;46 application tables allRLS, no client DML or anonymous app RPC grants.'
          ],notes='READY source repairs, NOT DEPLOYED. A later owner-approved release must include Netlify/app and BOTH Edge functions with shared modules; no new SQL migration. Six confirmed findings addressed, including expanded HTML CPU variants. Every-file screening plus targeted semantic review is not exhaustive manual history review or full authenticated-production penetration certification.')
          assert q['history']==old['history'] and q['published_base']==old['published_base']
          assert next(x for x in q['items'] if x['issue']==93)==next(x for x in old['items'] if x['issue']==93)
          files['docs/RELEASE_QUEUE.json']=dump(q)
          summary='## Issue96 repairs READY, NOT DEPLOYED ('+now+')\n\nPR97 and follow-up PR98 are merged. Final source '+merged+' has tree '+tree+', identical to tested PR source '+tested+' and its tested merge ref. All seven final PR checks and all six applicable merged-source checks PASS. Six findings repaired: approved password composition, bounded request parsing, truthful catalog-cache provenance, long-note preservation, privacy wording and pathological HTML processing, including repeated quoted attributes. Local673 Node cases pass; final browser/mobile/visual/offline/built-app and isolated SQL/signedHTTP/snapshot suites pass. Current locked production dependencies have zero known advisories. Final tested inventory470 files/72863 text lines/3 binaries; all13 follow-up file hashes and earlier39 repair hashes independently matched CI artifacts.\n\nQueue preserves #93 READY and now includes #96 READY. Production remains READY6adabcecd4a2a68e94cdc09a/sourcef97b8f30. No website publication or hosted SQL/Edge/Auth/member/permission changes. A later release must publish Netlify/app and both Edge functions with shared helpers; no new SQL migration. Live public/anonymous probes32/32 passed on unchanged production; saved counts remain22 shots/22 notes/5 accounts/2 Community/48 receipts.\n\nCoverage limits remain explicit: automated screening is not manual interpretation of every archived line; live signed-member/admin sessions, hosted Auth configuration, genuine preview SSO, physical-device/VoiceOver and inaccessible provider-admin controls were not verified. No blanket security certification or historical note recovery is claimed. No new Project Settings rule is needed for these approved implementation fixes. [Final evidence](audits/2026-10-23-security-ready-receipt.json).\n'
          for path in ['docs/CURRENT_STATUS.md','docs/ACTIVE_WORK_2026-10-20_APPROVAL_TO_RELEASE_INTEGRITY.md']:
              files[path]=summary+'\n---\n\n## Earlier checkpoints (dated evidence, not current readiness)\n\n'+(root/path).read_text()
          journal='docs/workstreams/issue-96.md'
          files[journal]=(root/journal).read_text()+'\n\n'+summary+'\nThe earlier unreferenced READY receipt was never integrated after the additional CPU variant appeared. Final receipt checks current refs, equal trees and real CI; all original queue history/#93 and approval contracts are preserved. This docs-only tree excludes the temporary finalizer; the bootstrap is retained as a second parent. Connector must independently compare/read back before any nonforce ref update.\n'
          matrixpath='docs/APPROVAL_COVERAGE_MATRIX.json'
          matrix=json.loads((root/matrixpath).read_text());original=copy.deepcopy(matrix)
          matrix['security_inspection_issue96']={'issue':96,'prs':[97,98],'state':'READY_NOT_DEPLOYED','tested_source_sha':tested,'merged_source_sha':merged,'tree_sha':tree,'findings_repaired':6,'node_tests':673,'provider_public_checks':32,'receipt':'docs/audits/2026-10-23-security-ready-receipt.json','no_new_locked_decisions':True,'production_unchanged':True,'coverage_limits':'Every-file automated screening and targeted semantic review; no complete manual archive-history or production-account penetration certification.'}
          for key,value in original.items():assert matrix[key]==value
          files[matrixpath]=dump(matrix)
          report='docs/audits/2026-10-23-security-inspection.md'
          files[report]=summary+'\n---\n\n'+(root/report).read_text()+'\n\n## Final repeated-attribute correction\nExpanded isolated tests found a single tag with15000 repeated quoted class attributes exceeded2.5s; related metadata variants took1.4-1.7s. Twelve parsers now bound ambiguous tag/attribute-value scans, with an additional four-case child-process regression. Equivalent cases run21-24ms locally and the complete673-test suite plus final CI pass. Earlier650/672 and456-file counts are dated checkpoints; final tested source inventory is470files/72863lines. All known findings from this audit are repaired in queued source, not deployed. Remaining limits listed above are not relabelled PASS.\n'
          receipt={'version':1,'observed_at_utc':now,'issue':96,'prs':[97,98],'status':'CONFIRMED_SOURCE_REPAIRS_READY_NOT_DEPLOYED','tested_source_sha':tested,'merged_source_sha':merged,'tested_merge_ref_sha':'cdbca21a560cc796a282c967cd5ee4906e3055af','equal_tree_sha':tree,'pr_ci_runs':runs,'merged_checks':verified,'node_tests_local':673,'runtime_dependency_vulnerabilities':0,'inventory':{'files':470,'text_lines':72863,'binary_files':3,'artifact':12482885419,'sha256':'f1548fc2cc098d337c77fc3364fc40a8f596df3eae85abbedc3d7fb2d800a671','all13_followup_file_hashes_matched':True,'initial39_repaired_file_hashes_matched_prior_artifact':12481468441},'live_provider_http':{'run':39905265823,'pass':32,'scope':'Nonmutating public/anonymous HTTP on unchanged production'},'production':{'release_sha':'f97b8f30c25f6d4ef30c5d79d12daf4fb0670e2f','netlify_deploy':'6adabcecd4a2a68e94cdc09a','accounts':5,'shots':22,'notes':22,'community':2,'receipts':48,'migrations':43,'application_tables':46,'missing_rls':0,'data_readback_at_utc':'2026-10-23T06:00:38.286049Z','new_publication':False},'later_release_requirements':['Netlify/application source','dic-preview-coffee including shared helpers','dic-verify-coffee including shared helpers','No new SQL migration'],'unverified':['Manual semantic inspection of every archived repository line','Real production GoTrue/member/admin signed penetration sessions','Hosted Auth password configuration not exposed by tools','Genuine nonproduction SSO challenge behavior','Physical WebKit/VoiceOver/storage-eviction scenarios','Provider administrative/build-hook controls not exposed by tools','Full-history secret clearance or third-party infrastructure penetration','Previously truncated historical note text cannot be reconstructed'],'preserved':['All canonical Locked decisions','Existing #93 READY entry','Queue published_base and complete history','Original member records and offline/Community history','Private Free and single-use publication boundaries']}
          files['docs/audits/2026-10-23-security-ready-receipt.json']=dump(receipt)
          elements=[]
          for path,content in files.items():
              assert path.startswith('docs/')
              blob=api('POST','git/blobs',{'content':content,'encoding':'utf-8'})
              elements.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          resulttree=api('POST','git/trees',{'base_tree':tree,'tree':elements})
          commit=api('POST','git/commits',{'message':'docs: record final verified security repairs and READY queue [skip netlify]','tree':resulttree['sha'],'parents':[merged,os.environ['GITHUB_SHA']]})
          result={'sha':commit['sha'],'tree':resulttree['sha'],'base':merged,'bootstrap':os.environ['GITHUB_SHA'],'paths':list(files),'source_changes':False,'ref_updated':False}
          pathlib.Path('qa_artifacts').mkdir(exist_ok=True)
          pathlib.Path('qa_artifacts/issue96-final-receipt-commit.json').write_text(dump(result))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dic-issue96-final-receipt-reference
          path: qa_artifacts/issue96-final-receipt-commit.json
          retention-days: 7

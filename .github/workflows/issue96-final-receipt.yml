name: DIC final security documentation with exact-tree test reuse
# Pinned generator creates only an unreferenced docs commit, no ref/provider writes.
on:
  push:
    branches: [work/issue96-security-audit-20261023]
    paths: [.github/workflows/issue96-final-receipt.yml]
permissions:
  contents: write
  actions: read
  checks: read
jobs:
  prepare-verified-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact generator, source trees and applicable test evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import subprocess
          ref='a9c945eaf2cb1c22ece90d055a3d04b2be030a3d:.github/workflows/issue96-final-receipt.yml'
          git=lambda *a:subprocess.check_output(['git',*a],text=True)
          assert git('rev-parse',ref).strip()=='dca64196661d044e2e0058ac5eccfdbc66190a9c'
          text=git('show',ref)
          start=text.index('          import copy,datetime,json,os,pathlib,time,urllib.request\n')
          end=text.index('\n          PY\n',start)
          code='\n'.join(line[10:] for line in text[start:end].splitlines())+'\n'
          replacements={
           "pr=api('GET','pulls/98');assert pr['merged'] and pr['merge_commit_sha']==merged and pr['head']['sha']==tested":"merge_record=api('GET','git/commits/'+merged);assert tested in [p['sha'] for p in merge_record['parents']]",
           "required=['approval','validate','cloud-tests','mobile-browser-qa','sql','review']":"required=['approval','validate','cloud-tests','mobile-browser-qa']",
           'all six applicable merged-source checks independently PASS':'all four applicable merged-source checks independently PASS; SQL/visual/security reuse the identical passing PR tree',
           'All seven final PR checks and all six applicable merged-source checks PASS.':'All seven final PR checks and all four applicable merged-source checks PASS. SQL/visual/security evidence is reused from the identical passing PR tree; no skipped check is called passed.'
          }
          for old,new in replacements.items():
              assert code.count(old)==1,old
              code=code.replace(old,new)
          marker="matrixpath='docs/APPROVAL_COVERAGE_MATRIX.json'"
          assert code.count(marker)==1
          code=code.replace(marker,"files[journal]+='\\nReceipt recovery: the initial PR-metadata GET was denied before writes, so existing read-only commit provenance is used without expanding token permissions. Four applicable postmerge jobs passed; SQL and visual are PR-only for this changed path set. Their actual successful runs are reused ONLY after all tested/merged Git trees match. No absent/skipped job is called PASS and no source/CI guard is weakened.\\n'\n"+marker)
          subprocess.run(['git','checkout','--detach','5b1bc56c8d2d111ab70f14f1bd1bf58de4f9146d'],check=True)
          exec(compile(code,'verified-issue96-receipt-generator','exec'),{'__name__':'__main__'})
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dic-issue96-final-receipt-reference
          path: qa_artifacts/issue96-final-receipt-commit.json
          retention-days: 7

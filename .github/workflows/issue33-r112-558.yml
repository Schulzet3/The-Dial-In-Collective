name: DIC Issue33 R112 exact original selected 558
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r112-558.yml
      - scripts/audit/issue33-r112-558-check.mjs
      - tests/coffee-issue33-r112-558.test.mjs
      - docs/workstreams/ops-issue33-r112-558-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r112-558.yml
      - scripts/audit/issue33-r112-558-check.mjs
      - tests/coffee-issue33-r112-558.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected own-source positive/negative real-parser tests
        run: node --test tests/coffee-issue33-r112-558.test.mjs
      - name: Guarded actual official HTTPS selected/parser/Add Coffee
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '558'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r112
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify current exact H1, direct specs, SHA-bound parser fields
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r112
          DIC_ISSUE33_R112_VERIFY: '1'
        run: node scripts/audit/issue33-r112-558-check.mjs
      - name: Preserve public-source-only temporary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r112-558
          path: /tmp/dic33-r112/
          retention-days: 1
          if-no-files-found: warn

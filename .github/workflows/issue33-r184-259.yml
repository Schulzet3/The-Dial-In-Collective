name: DIC Issue33 R184 original259 Prelude selected source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r184-259.yml
      - scripts/audit/issue33-r184-259-check.mjs
      - tests/coffee-issue33-r184-259.test.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
      - docs/workstreams/ops-issue33-r184-259-20261113.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r184-259.yml
      - scripts/audit/issue33-r184-259-check.mjs
      - tests/coffee-issue33-r184-259.test.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected-source positive and hostile context regressions
        run: node --test tests/coffee-issue33-r184-259.test.mjs
      - name: Current guarded public HTTPS exact original259 and real parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '259'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r184
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact selected source afterproof and reproducible diagnosis
        if: always()
        env:
          DIC_ISSUE33_R184_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r184
        run: node scripts/audit/issue33-r184-259-check.mjs
      - name: Retain raw official HTML and afterproof for independent review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r184-original259
          path: /tmp/dic33-r184/
          retention-days: 2
          if-no-files-found: warn

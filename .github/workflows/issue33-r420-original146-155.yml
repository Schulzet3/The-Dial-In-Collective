name: DIC Issue33 R420 original146 155 exact selected official
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r420-original146-155.yml'
      - 'scripts/audit/issue33-r420-original146-155-check.mjs'
      - 'docs/workstreams/ops-issue33-r420-original146-155-20261122.md'
  push:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r420-original146-155.yml'
      - 'scripts/audit/issue33-r420-original146-155-check.mjs'
permissions:
  contents: read
jobs:
  official-selected-original146-155:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Bind exact checkout and checker syntax
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$DIC_EXPECTED_SHA"
          node --check scripts/audit/issue33-r420-original146-155-check.mjs
      - name: Selected official guarded HTTPS parser and unsaved Add Coffee UI
        env:
          DIC_R420_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '146,155'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r420
        run: GITHUB_SHA="$DIC_R420_EXACT_SHA" node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict raw current HTML and optional SKU contamination afterproof
        if: always()
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r420
        run: node scripts/audit/issue33-r420-original146-155-check.mjs
      - name: Retain bounded official source captures for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r420-original146-155-current
          path: /tmp/dic33-r420/
          retention-days: 1
          if-no-files-found: warn

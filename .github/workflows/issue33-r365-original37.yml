name: DIC Issue33 R365 original37 Black Honey selected product
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r365-original37.yml
      - scripts/audit/issue33-r365-original37-check.mjs
      - tests/coffee-issue33-r365-original37.test.mjs
      - docs/workstreams/ops-issue33-r365-original37-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r365-original37.yml
      - scripts/audit/issue33-r365-original37-check.mjs
      - tests/coffee-issue33-r365-original37.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Current selected product positive and hostile contract
        run: node --test tests/coffee-issue33-r365-original37.test.mjs
      - name: Bounded one exact original37 official source
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '37'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r365
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Raw HTML SHA, chosen identity, actual parser and no-save UI
        if: always()
        env:
          DIC_R365_VERIFY: '1'
          DIC_R365_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R365_EVENT_SHA: ${{ github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r365
        run: node scripts/audit/issue33-r365-original37-check.mjs
      - name: Retain bounded exact source evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r365-original37
          path: /tmp/dic33-r365/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R140 current exact icon country-region
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r140-136-region.yml
      - scripts/audit/issue33-r140-136-region-check.mjs
      - tests/coffee-issue33-r140-icon-region.test.mjs
      - src/server/coffee-selected-icon-geography.mjs
      - src/server/coffee-product-layouts.mjs
      - docs/workstreams/ops-issue33-r140-136-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r140-136-region.yml
      - scripts/audit/issue33-r140-136-region-check.mjs
      - tests/coffee-issue33-r140-icon-region.test.mjs
      - src/server/coffee-selected-icon-geography.mjs
      - src/server/coffee-product-layouts.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Generic icon-country-region positive and negative tests
        run: node --test tests/coffee-issue33-r140-icon-region.test.mjs
      - name: Guarded current original chosen official Gnosis and parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '136'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r140
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict exact-source current region and unchanged fields afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r140
          DIC_ISSUE33_R140_VERIFY: '1'
        run: node scripts/audit/issue33-r140-136-region-check.mjs
      - name: Save official source and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r140-original136-country-region
          path: /tmp/dic33-r140/
          retention-days: 2
          if-no-files-found: warn

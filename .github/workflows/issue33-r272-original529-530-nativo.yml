name: DIC Issue33 R272 original529 530 current selected Nativo
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r272-original529-530-nativo.yml
      - tests/coffee-issue33-r272-original529-530-nativo.test.mjs
      - scripts/audit/issue33-r272-original529-530-nativo-check.mjs
      - docs/workstreams/ops-issue33-r272-original529-530-nativo-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r272-original529-530-nativo.yml
      - tests/coffee-issue33-r272-original529-530-nativo.test.mjs
      - scripts/audit/issue33-r272-original529-530-nativo-check.mjs
      - docs/workstreams/ops-issue33-r272-original529-530-nativo-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused identity and fail-closed adversarial tests
        run: node --test tests/coffee-issue33-r272-original529-530-nativo.test.mjs
      - name: Guarded fresh exact official current selected URLs
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '529,530'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r272
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Check hashed selected HTML, parser, Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r272
          DIC_R272_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R272_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r272-original529-530-nativo-check.mjs
      - name: Preserve one-day credential-free exact source proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r272-original529-530-nativo
          path: /tmp/dic33-r272/
          retention-days: 1
          if-no-files-found: warn

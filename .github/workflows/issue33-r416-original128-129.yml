name: DIC Issue33 R416 Friedrichs original128 129 selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r416-original128-129.yml'
      - 'scripts/audit/issue33-r416-original128-129-check.mjs'
      - 'docs/workstreams/ops-issue33-r416-original128-129-20261122.md'
  push:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r416-original128-129.yml'
      - 'scripts/audit/issue33-r416-original128-129-check.mjs'
permissions:
  contents: read
jobs:
  selected-original128-129:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected product hostile source and role regression
        run: node --test tests/coffee-issue33-r408-producer-farm-caption.test.mjs tests/coffee-issue33-r138-118.test.mjs
      - name: Verify exact checked-out commit
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$DIC_EXPECTED_SHA"
      - name: Guarded exact official HTTPS originals128 129 current parser and unsaved UI
        env:
          DIC_R416_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '128,129'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r416
        run: GITHUB_SHA="$DIC_R416_EXACT_SHA" node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict first-party identity HTML SHA provenance and missing-field negatives
        if: always()
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r416
        run: node scripts/audit/issue33-r416-original128-129-check.mjs
      - name: Preserve exact first-party public source evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r416-friedrichs-original128-129
          path: /tmp/dic33-r416/
          retention-days: 1
          if-no-files-found: warn

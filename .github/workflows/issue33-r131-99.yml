name: DIC Issue33 R131 original99 official selected
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r131-99.yml
      - scripts/audit/issue33-r131-99-check.mjs
      - tests/coffee-issue33-r131-99.test.mjs
      - docs/workstreams/ops-issue33-r131-99-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r131-99.yml
      - scripts/audit/issue33-r131-99-check.mjs
      - tests/coffee-issue33-r131-99.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Six direct and adversarial source-scope regressions
        run: node --test tests/coffee-issue33-r131-99.test.mjs
      - name: Bounded real exact official HTTPS and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '99'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r131
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict source and actual parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r131
          DIC_ISSUE33_R131_VERIFY: '1'
        run: node scripts/audit/issue33-r131-99-check.mjs
      - name: One-day raw HTML, evidence JSON, SHA afterproof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r131-99-current-evidence
          path: /tmp/dic33-r131/
          retention-days: 1
          if-no-files-found: warn

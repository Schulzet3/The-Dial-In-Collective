name: DIC Issue33 R89 original603 White Rhino 409-411 exact selected
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r89-whiterhino-409-411.yml
      - scripts/audit/issue33-r89-whiterhino-409-411-check.mjs
      - tests/coffee-issue33-r89-whiterhino-409-411.test.mjs
      - docs/workstreams/ops-issue33-r89-whiterhino-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r89-whiterhino-409-411.yml
      - scripts/audit/issue33-r89-whiterhino-409-411-check.mjs
      - tests/coffee-issue33-r89-whiterhino-409-411.test.mjs
permissions:
  contents: read
jobs:
  exact-current-whiterhino:
    name: original603-409-411-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: White Rhino same-selected-source positive and hostile regressions
        run: node --test tests/coffee-issue33-r89-whiterhino-409-411.test.mjs
      - name: Guarded fresh current original official URLs and actual Add Coffee parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '409,410,411'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r89-whiterhino
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent current identity/spec/raw SHA/source-scope afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r89-whiterhino
          DIC_ISSUE33_R89_VERIFY: '1'
        run: node scripts/audit/issue33-r89-whiterhino-409-411-check.mjs
      - name: Short-lived original HTML and SHA receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r89-whiterhino-409-411
          path: /tmp/dic33-r89-whiterhino/
          retention-days: 1
          if-no-files-found: warn

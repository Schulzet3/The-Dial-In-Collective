name: DIC Issue33 R87 original603 Wake 403-405 exact selected
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r87-wake-403-405.yml
      - scripts/audit/issue33-r87-wake-403-405-check.mjs
      - tests/coffee-issue33-r87-wake-403-405.test.mjs
      - docs/workstreams/ops-issue33-r87-wake-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r87-wake-403-405.yml
      - scripts/audit/issue33-r87-wake-403-405-check.mjs
      - tests/coffee-issue33-r87-wake-403-405.test.mjs
permissions:
  contents: read
jobs:
  exact-current-wake:
    name: original603-403-405-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused own-source and negative adversarial contracts
        run: node --test tests/coffee-issue33-r87-wake-403-405.test.mjs
      - name: Guarded fresh exact official URLs with actual parser and Add Coffee review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '403,404,405'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r87-wake
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent exact-source H1, story, SHA, canonical and source bounds
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r87-wake
          DIC_ISSUE33_R87_VERIFY: '1'
        run: node scripts/audit/issue33-r87-wake-403-405-check.mjs
      - name: Temporary hashed official raw evidence and afterproof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r87-wake-403-405
          path: /tmp/dic33-r87-wake/
          retention-days: 1
          if-no-files-found: warn

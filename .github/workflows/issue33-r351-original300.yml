name: DIC Issue33 R351 original300 selected Sextant Black Lion
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r351-original300.yml
      - scripts/audit/issue33-r351-original300-check.mjs
      - tests/coffee-issue33-r351-original300.test.mjs
      - docs/workstreams/ops-issue33-r351-original300-black-lion-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r351-original300.yml
      - scripts/audit/issue33-r351-original300-check.mjs
      - tests/coffee-issue33-r351-original300.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused literal source and hostile selection regressions
        run: node --test tests/coffee-issue33-r351-original300.test.mjs
      - name: One registered #300 selected official HTTPS source
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '300'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r351
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict exact real raw source H1 and current parser plus no-save UI
        if: always()
        env:
          DIC_R351_VERIFY: '1'
          DIC_R351_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R351_EVENT_SHA: ${{ github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r351
        run: node scripts/audit/issue33-r351-original300-check.mjs
      - name: Retain only bounded public source and afterproof one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r351-original300
          path: /tmp/dic33-r351/
          retention-days: 1
          if-no-files-found: warn

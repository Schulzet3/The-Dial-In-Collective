name: DIC encrypted database backup

# Run operational backups from the default branch only. Development keeps the
# same reviewed definition without creating a second backup on each code edit.
# The private offsite courier ignores push smoke tests; verify their private
# offsite copy independently before using one as release recovery evidence.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/nightly-backup.yml
      - scripts/backups/create-nightly-encrypted-dump.sh
  workflow_dispatch:
  # 08:00 UTC = fixed 01:00 MST (02:00 MDT in daylight-saving months).
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

concurrency:
  group: dic-private-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    # Pin OS so the Oct-Nov 2026 ubuntu-latest migration does not change backup behavior.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: azviqqejypsefzilgonr
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout verified live cloud app source for independent offsite recovery
        uses: actions/checkout@v7
        with:
          # Update only after independent evidence confirms a newer live deploy.
          ref: eee687dd4d7fc19493139bc106e63c16849ac91d
          path: backup-app-source
          persist-credentials: false
      - name: Install age encryption
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Encrypted PostgreSQL snapshot
        run: bash scripts/backups/create-nightly-encrypted-dump.sh
      - name: Upload ciphertext only
        uses: actions/upload-artifact@v7
        with:
          name: dic-encrypted-nightly-${{ github.run_id }}
          path: ${{ runner.temp }}/dic-nightly-${{ github.run_id }}/encrypted/backup.age
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

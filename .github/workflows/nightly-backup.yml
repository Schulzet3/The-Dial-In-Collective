name: DIC encrypted database backup

# Nightly encrypted export to private GitHub artifacts. Apps Script forwards ciphertext to Drive.
# Approved pilot preflight backup: comment-only push triggers one fresh encrypted
# recovery archive before migrating production; standard nightly behavior unchanged.
# The Apps Script courier ignores push runs; manually verify a private offsite copy.
on:
  # Smoke-test changes to backup infrastructure; Drive courier ignores push tests.
  push:
    branches: [main]
    paths:
      - .github/workflows/nightly-backup.yml
      - scripts/backups/create-nightly-encrypted-dump.sh
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: read

concurrency:
  group: dic-private-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    # Explicit LTS runner: prevent unreviewed ubuntu-latest migration to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: azviqqejypsefzilgonr
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout verified published release for independent recovery
        uses: actions/checkout@v7
        with:
          # Verified current Netlify production READY deploy 6ad7be20bf672d5c8936f19a at 2026-10-20 19:17:09 UTC; PWA refresh, approved Autofill, expanded deterministic product extraction; exact published source.
          ref: e7e16e5e13b35a6f4b6aa81db5b09b93b1aefc60
          path: backup-app-source
          persist-credentials: false
      - name: Install age encryption
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Encrypted PostgreSQL snapshot
        run: bash scripts/backups/create-nightly-encrypted-dump.sh
      - name: Upload ciphertext only
        uses: actions/upload-artifact@v7
        with:
          name: dic-encrypted-nightly-${{ github.run_id }}
          path: ${{ runner.temp }}/dic-nightly-${{ github.run_id }}/encrypted/backup.age
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

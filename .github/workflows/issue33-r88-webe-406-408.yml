name: DIC Issue33 R88 original603 WeBe 406 and 408 exact selected
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r88-webe-406-408.yml
      - scripts/audit/issue33-r88-webe-406-408-check.mjs
      - tests/coffee-issue33-r88-webe-406-408.test.mjs
      - docs/workstreams/ops-issue33-r88-webe-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r88-webe-406-408.yml
      - scripts/audit/issue33-r88-webe-406-408-check.mjs
      - tests/coffee-issue33-r88-webe-406-408.test.mjs
permissions:
  contents: read
jobs:
  exact-current-webe:
    name: original603-406-408-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and hostile original-selected-product regressions
        run: node --test tests/coffee-issue33-r88-webe-406-408.test.mjs
      - name: Bounded fresh official source, current parser, Add Coffee and Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '406,408'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r88-webe
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected identity and original source SHA afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r88-webe
          DIC_ISSUE33_R88_VERIFY: '1'
        run: node scripts/audit/issue33-r88-webe-406-408-check.mjs
      - name: One-day public-source HTML, SHA and afterproof artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r88-webe-406-408
          path: /tmp/dic33-r88-webe/
          retention-days: 1
          if-no-files-found: warn

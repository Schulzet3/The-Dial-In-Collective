name: DIC Issue33 R228 original361-363 selected source and identity negative
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r228-original361-363.yml
      - tests/coffee-issue33-r228-original361-363.test.mjs
      - scripts/audit/issue33-r228-original361-363-check.mjs
      - docs/workstreams/ops-issue33-r228-361-363-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-focused-source-acceptance.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r228-original361-363.yml
      - tests/coffee-issue33-r228-original361-363.test.mjs
      - scripts/audit/issue33-r228-original361-363-check.mjs
      - docs/workstreams/ops-issue33-r228-361-363-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-focused-source-acceptance.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected positive and hostile parser tests
        run: node --test tests/coffee-issue33-r228-original361-363.test.mjs
      - name: Guarded original361 and 363 positive, 362 changed-identity negative
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '361,362,363'
          DIC_ISSUE33_FOCUSED_IDENTITY_NEGATIVE_NUMBERS: '362'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r228
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent selected raw byte SHA and source-review afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r228
          DIC_R228_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r228-original361-363-check.mjs
      - name: Preserve one-day source-bound evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r228-original361-363
          path: /tmp/dic33-r228/
          retention-days: 1
          if-no-files-found: warn

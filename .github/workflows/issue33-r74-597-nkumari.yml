name: DIC Issue33 R74 original603 597 selected Nkumari source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r74-597-nkumari.yml
      - scripts/audit/issue33-r74-597-selected-contract.mjs
      - scripts/audit/issue33-r74-597-afterproof.mjs
      - tests/coffee-issue33-r74-597-selected-contract.test.mjs
      - docs/workstreams/ops-issue33-r74-597-nkumari-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r74-597-nkumari.yml
      - scripts/audit/issue33-r74-597-selected-contract.mjs
      - scripts/audit/issue33-r74-597-afterproof.mjs
      - tests/coffee-issue33-r74-597-selected-contract.test.mjs
permissions:
  contents: read
jobs:
  selected-nkumari:
    name: original603-597-selected-official-nkumari
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected current source positive and hostile isolation checks
        run: node --test tests/coffee-issue33-r74-597-selected-contract.test.mjs
      - name: Guarded exact original URL and actual parser Add Coffee/Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '597'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r74-597
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict current exact selected content, provenance and SHA afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r74-597
        run: node scripts/audit/issue33-r74-597-afterproof.mjs
      - name: Short retention public source and verdict only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r74-nkumari-597
          path: /tmp/dic33-r74-597/
          if-no-files-found: warn
          retention-days: 1

permissions:
  contents: read
jobs:
  original117-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Nine focused current parser and negative source tests
        run: node --test tests/coffee-issue33-r326-original117.test.mjs
      - name: One guarded public HTTPS exact official selected product
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '117'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r326
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Fail closed H1 HTML hash current parser UI and process stage attribution
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r326
          DIC_R326_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R326_EVENT_SHA: ${{ github.sha }}
          DIC_R326_VERIFY: '1'
        run: node scripts/audit/issue33-r326-original117-check.mjs
      - name: One-day current official source proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r326-original117
          path: /tmp/dic33-r326/
          retention-days: 1
          if-no-files-found: warn

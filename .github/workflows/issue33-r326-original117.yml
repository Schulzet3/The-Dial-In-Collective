name: DIC Issue33 R326 original603 #117 current Enjoy selected Washed fermentation boundary
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r326-original117.yml
      - scripts/audit/issue33-r326-original117-check.mjs
      - tests/coffee-issue33-r326-original117.test.mjs
      - docs/workstreams/ops-issue33-r326-original117-20261119.md
      - src/server/coffee-page-metadata.mjs

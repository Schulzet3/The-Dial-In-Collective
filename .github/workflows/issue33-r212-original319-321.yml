name: DIC Issue33 R212 original319 321 official selected evidence
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r212-original319-321.yml
      - tests/coffee-issue33-r212-original319-321.test.mjs
      - scripts/audit/issue33-r212-original319-321-check.mjs
      - docs/workstreams/ops-issue33-r212-319-321-20261115.md
      - src/server/coffee-page-metadata.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r212-original319-321.yml
      - tests/coffee-issue33-r212-original319-321.test.mjs
      - scripts/audit/issue33-r212-original319-321-check.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and hostile actual parser tests
        run: node --test tests/coffee-issue33-r212-original319-321.test.mjs
      - name: Bounded exact selected official HTTPS + Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '319,320,321'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r212
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict fresh selected product and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r212
          DIC_R212_EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r212-original319-321-check.mjs
      - name: Preserve bounded selected public HTML and diagnostic facts for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r212-original319-321
          path: /tmp/dic33-r212/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R227 original358-360 selected current official sources
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r227-original358-360.yml
      - tests/coffee-issue33-r227-original358-360.test.mjs
      - scripts/audit/issue33-r227-original358-360-check.mjs
      - docs/workstreams/ops-issue33-r227-358-360-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r227-original358-360.yml
      - tests/coffee-issue33-r227-original358-360.test.mjs
      - scripts/audit/issue33-r227-original358-360-check.mjs
      - docs/workstreams/ops-issue33-r227-358-360-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected positive and hostile parser regressions
        run: node --test tests/coffee-issue33-r227-original358-360.test.mjs
      - name: Guarded exact official original603 selected product HTML and Add Coffee
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '358,359,360'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r227
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Current selected raw SHA and parser/Source Review afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r227
          DIC_R227_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r227-original358-360-check.mjs
      - name: Store source-bound primary evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r227-original358-360
          path: /tmp/dic33-r227/
          retention-days: 1
          if-no-files-found: warn

name: DIC one-shot startup nonpublishing source proof V4
on:
  push:
    branches:
      - 'work/startup-ready-precert-v4-20261122'
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: dic-startup-provisional-ready-source
  cancel-in-progress: false
jobs:
  source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Run main-only pre-certifier against exact provisional development source (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/startup-ready-precert-v4-20261122'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/production:refs/remotes/origin/release/production' '+refs/heads/development/backend-foundation:refs/remotes/origin/development/backend-foundation'
          git worktree add --detach "$RUNNER_TEMP/dic-ready-main-tools" refs/remotes/origin/main
          node "$RUNNER_TEMP/dic-ready-main-tools/scripts/release/precertify-ready-source.mjs" "$GITHUB_SHA" --receipt

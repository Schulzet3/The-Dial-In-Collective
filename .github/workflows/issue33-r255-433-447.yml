name: DIC Issue33 R255 original433-447 exact selected official
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r255-433-447.yml
      - scripts/audit/issue33-r255-433-447-check.mjs
      - tests/coffee-issue33-r255-433-447.test.mjs
      - docs/workstreams/ops-issue33-r255-433-447-current-source-20261116.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r255-433-447.yml
      - scripts/audit/issue33-r255-433-447-check.mjs
      - tests/coffee-issue33-r255-433-447.test.mjs
      - docs/workstreams/ops-issue33-r255-433-447-current-source-20261116.md
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused real parser positive and adversarial regressions
        run: node --test tests/coffee-issue33-r255-433-447.test.mjs
      - name: Guarded exact selected current official parser Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '433,447'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r255
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent source SHA256 and canonical afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r255
          DIC_R255_VERIFY: '1'
          DIC_R255_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R255_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r255-433-447-check.mjs
      - name: Short-lived guarded source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r255-selected-433-447
          path: /tmp/dic33-r255/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R318 original603 Dark Canyon selected flavor/roast proof
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r318-original91-92.test.mjs
      - scripts/audit/issue33-r318-original91-92-check.mjs
      - .github/workflows/issue33-r318-original91-92.yml
      - docs/workstreams/ops-issue33-r318-original91-92-20261119.md
      - scripts/audit/issue33-r318-selected-shopify-tag.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r318-original91-92.test.mjs
      - scripts/audit/issue33-r318-original91-92-check.mjs
      - .github/workflows/issue33-r318-original91-92.yml
      - docs/workstreams/ops-issue33-r318-original91-92-20261119.md
      - scripts/audit/issue33-r318-selected-shopify-tag.mjs
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Six real-parser positive and adversarial tests
        run: node --test tests/coffee-issue33-r318-original91-92.test.mjs
      - name: Two exact original selected guarded public HTTPS URLs
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '91,92'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r318
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict source identity hash preview and review proof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r318
          DIC_R318_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R318_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r318-original91-92-check.mjs
      - name: One-day public selected-source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r318-original91-92
          path: /tmp/dic33-r318/
          retention-days: 1
          if-no-files-found: warn

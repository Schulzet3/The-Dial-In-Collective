name: DIC Issue33 R247 original418-419 Ahrre selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r247-original418-419.yml
      - tests/coffee-issue33-r247-original418-419.test.mjs
      - scripts/audit/issue33-r247-original418-419-check.mjs
      - scripts/audit/issue33-shopify-selected-product-h3.mjs
      - docs/workstreams/ops-issue33-r247-418-419-ahrre-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-decaffeination-method.mjs
      - src/server/coffee-roast-evidence.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r247-original418-419.yml
      - tests/coffee-issue33-r247-original418-419.test.mjs
      - scripts/audit/issue33-r247-original418-419-check.mjs
      - docs/workstreams/ops-issue33-r247-418-419-ahrre-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-decaffeination-method.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and adversarial selected-coffee regressions
        run: node --test tests/coffee-issue33-r247-original418-419.test.mjs
      - name: Current official selected parser Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '418,419'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r247
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently verify exact current raw source and parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r247
          DIC_R247_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r247-original418-419-check.mjs
      - name: Preserve bounded official raw HTML one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r247-original418-419
          path: /tmp/dic33-r247/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R149 original165 selected Ironclad San Lazaro
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r149-165.yml
      - scripts/audit/issue33-r149-165-check.mjs
      - tests/coffee-issue33-r149-165.test.mjs
      - docs/workstreams/ops-issue33-r149-165-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r149-165.yml
      - scripts/audit/issue33-r149-165-check.mjs
      - tests/coffee-issue33-r149-165.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Exact current chosen product and adversarial regressions
        run: node --test tests/coffee-issue33-r149-165.test.mjs
      - name: Bounded guarded official HTTPS and current application parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '165'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r149
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Raw official HTML, identity and parsed fields strict afterproof
        if: always()
        env:
          DIC_ISSUE33_R149_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r149
        run: node scripts/audit/issue33-r149-165-check.mjs
      - name: Preserve source and failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r149-original165
          path: /tmp/dic33-r149/
          retention-days: 2
          if-no-files-found: warn

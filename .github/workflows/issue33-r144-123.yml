name: DIC Issue33 R144 original123 current selected Favor Token
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r144-123.yml
      - scripts/audit/issue33-r144-123-check.mjs
      - tests/coffee-issue33-r144-123.test.mjs
      - docs/workstreams/ops-issue33-r144-123-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r144-123.yml
      - scripts/audit/issue33-r144-123-check.mjs
      - tests/coffee-issue33-r144-123.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected own facts and adversarial tests
        run: node --test tests/coffee-issue33-r144-123.test.mjs
      - name: Guarded current official original URL and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '123'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r144
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict raw HTML and source-bound afterproof
        if: always()
        env:
          DIC_ISSUE33_R144_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r144
        run: node scripts/audit/issue33-r144-123-check.mjs
      - name: Preserve actual official bytes and failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r144-original123-selected
          path: /tmp/dic33-r144/
          retention-days: 2
          if-no-files-found: warn

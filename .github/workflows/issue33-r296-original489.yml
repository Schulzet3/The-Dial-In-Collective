name: DIC Issue33 R296 selected original489
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r296-original489.test.mjs
      - scripts/audit/issue33-r296-original489-check.mjs
      - .github/workflows/issue33-r296-original489.yml
      - docs/workstreams/ops-issue33-r296-original489-20261118.md
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r296-original489.test.mjs
      - scripts/audit/issue33-r296-original489-check.mjs
      - .github/workflows/issue33-r296-original489.yml
      - docs/workstreams/ops-issue33-r296-original489-20261118.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused actual parser and adversarial selected-product tests
        run: node --test tests/coffee-issue33-r296-original489.test.mjs
      - name: Guarded fresh exact selected official public HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '489'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r296
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently source bind current identity and selected fields
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r296
          DIC_R296_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R296_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r296-original489-check.mjs
      - name: Archive public raw selected source for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r296-original489
          path: /tmp/dic33-r296/
          retention-days: 1
          if-no-files-found: warn

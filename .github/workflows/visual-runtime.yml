name: DIC private rendering assets
on:
  push:
    branches: [work/visual-refresh-20261015]
    paths: [.github/workflows/visual-runtime.yml]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare exact browser runtime and public font for private screenshots
        run: |
          mkdir -p /tmp/dic-assets
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js /tmp/dic-assets/supabase.js
          curl --fail --location --max-time 40 'https://raw.githubusercontent.com/google/fonts/main/ofl/fraunces/Fraunces%5BSOFT%2CWONK%2Copsz%2Cwght%5D.ttf' -o /tmp/dic-assets/Fraunces.ttf
          curl --fail --location --max-time 40 'https://raw.githubusercontent.com/JetBrains/JetBrainsMono/master/fonts/ttf/JetBrainsMono-Regular.ttf' -o /tmp/dic-assets/JetBrainsMono.ttf
      - uses: actions/upload-artifact@v7
        with:
          name: dic-private-rendering-assets
          path: /tmp/dic-assets
          retention-days: 1

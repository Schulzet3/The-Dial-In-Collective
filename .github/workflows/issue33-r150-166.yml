name: DIC Issue33 R150 original166 selected Iwana Maragogipe
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r150-166.yml
      - scripts/audit/issue33-r150-166-check.mjs
      - tests/coffee-issue33-r150-166.test.mjs
      - docs/workstreams/ops-issue33-r150-166-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r150-166.yml
      - scripts/audit/issue33-r150-166-check.mjs
      - tests/coffee-issue33-r150-166.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Exact selected evidence and adversarial tests
        run: node --test tests/coffee-issue33-r150-166.test.mjs
      - name: Bounded guarded selected official HTTPS and real parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '166'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r150
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected source and actual parser afterproof
        if: always()
        env:
          DIC_ISSUE33_R150_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r150
        run: node scripts/audit/issue33-r150-166-check.mjs
      - name: Preserve bounded source and failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r150-original166
          path: /tmp/dic33-r150/
          retention-days: 2
          if-no-files-found: warn

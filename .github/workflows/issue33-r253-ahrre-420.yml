name: DIC Issue33 R253 Ahrre original420 selected official
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r253-ahrre-420.yml
      - scripts/audit/issue33-r253-ahrre-420-check.mjs
      - tests/coffee-issue33-r253-ahrre-420.test.mjs
      - docs/workstreams/ops-issue33-r253-420-ahrre-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r253-ahrre-420.yml
      - scripts/audit/issue33-r253-ahrre-420-check.mjs
      - tests/coffee-issue33-r253-ahrre-420.test.mjs
      - docs/workstreams/ops-issue33-r253-420-ahrre-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected product and sibling identity adversarial tests
        run: node --test tests/coffee-issue33-r253-ahrre-420.test.mjs
      - name: Guarded exact original selected HTTPS source, parser, Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '420'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r253
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently verify selected product, raw SHA256 and withheld fields
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r253
          DIC_R253_VERIFY: '1'
          DIC_R253_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R253_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r253-ahrre-420-check.mjs
      - name: Retain bounded original raw source privately for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r253-original420-selected
          path: /tmp/dic33-r253/
          retention-days: 1
          if-no-files-found: warn

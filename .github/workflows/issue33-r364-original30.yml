name: DIC Issue33 R364 original30 El Poeta selected source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r364-original30.yml
      - scripts/audit/issue33-r364-original30-check.mjs
      - tests/coffee-issue33-r364-original30.test.mjs
      - docs/workstreams/ops-issue33-r364-original30-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r364-original30.yml
      - scripts/audit/issue33-r364-original30-check.mjs
      - tests/coffee-issue33-r364-original30.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Focused selected-source and adversarial controls
        run: node --test tests/coffee-issue33-r364-original30.test.mjs
      - name: Single original30 official bounded HTTPS and parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '30'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r364
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Current exact official HTML SHA, selected H1, fields and UI afterproof
        if: always()
        env:
          DIC_R364_VERIFY: '1'
          DIC_R364_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R364_EVENT_SHA: ${{ github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r364
        run: node scripts/audit/issue33-r364-original30-check.mjs
      - name: Retain evidence one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r364-original30
          path: /tmp/dic33-r364/
          retention-days: 1
          if-no-files-found: warn

name: DIC single-use owner-approved production release
# Manual only. This workflow does not run on push, pull_request or schedule.
# Free/private compensating controls: advisory five-check CI, exact owner
# grant, serialized controller and one-use non-force Git push. GitHub Free
# cannot enforce required checks or branch protection.
# Manual serialized controller verifies exact owner release grant, live CI,
# one-use non-force claim and independent Netlify production-branch setting.
# NEVER pretend GitHub checks are enforced or publish on development commits.
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Explicit unique owner approval (DIC-YYYYMMDD-...); must exist in approved grant file"
        required: true
        type: string
      tested_source_sha:
        description: "Exact 40-character tested development commit SHA"
        required: true
        type: string
      release_evidence_json:
        description: "Fresh schema-v2 manual evidence JSON: exact grant/source/current refs, encrypted snapshot/offsite receipt and credit check"
        required: true
        type: string
permissions:
  contents: write
  checks: read
concurrency:
  group: dic-exclusive-one-use-production-publish
  cancel-in-progress: false
jobs:
  atomic-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Verify exact grant, live CI, private Free mode, Netlify branch and ONE nonforce push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_TESTED_SOURCE_SHA: ${{ inputs.tested_source_sha }}
          INPUT_RELEASE_EVIDENCE_JSON: ${{ inputs.release_evidence_json }}
          DIC_PRIVATE_BRANCH_PROTECTION_VERIFIED: ${{ vars.DIC_PRIVATE_BRANCH_PROTECTION_VERIFIED }}
          # This explicitly denotes advisory CI+grant+CAS, NOT protected refs.
          DIC_PRIVATE_FREE_COMPENSATING_MODE: 'YES'
          DIC_NETLIFY_PRODUCTION_BRANCH_VERIFIED: ${{ vars.DIC_NETLIFY_PRODUCTION_BRANCH_VERIFIED }}
          DIC_RELEASE_CONTROLLER_VERIFIED: ${{ vars.DIC_RELEASE_CONTROLLER_VERIFIED }}
        run: node scripts/release/controlled-release-runner.mjs

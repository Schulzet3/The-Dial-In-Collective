name: DIC Issue33 R130 selected originals 97 98
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r130-97-98.yml
      - scripts/audit/issue33-r130-97-98-check.mjs
      - tests/coffee-issue33-r130-97-98.test.mjs
      - docs/workstreams/ops-issue33-r130-97-98-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r130-97-98.yml
      - scripts/audit/issue33-r130-97-98-check.mjs
      - tests/coffee-issue33-r130-97-98.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Eight selected and adversarial identity/source tests
        run: node --test tests/coffee-issue33-r130-97-98.test.mjs
      - name: Guarded bounded current exact official HTTPS and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '97,98'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r130
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict official source identity, source SHA, corpus and field evidence
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r130
          DIC_ISSUE33_R130_VERIFY: '1'
        run: node scripts/audit/issue33-r130-97-98-check.mjs
      - name: Retain bounded official raw HTML, JSON evidence and afterproof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r130-97-98-current-evidence
          path: /tmp/dic33-r130/
          retention-days: 1
          if-no-files-found: warn

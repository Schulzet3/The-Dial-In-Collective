name: DIC Issue33 R251 Alta original427-428 official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r251-alta.yml
      - scripts/audit/issue33-r251-alta-check.mjs
      - tests/coffee-issue33-r251-alta.test.mjs
      - docs/workstreams/ops-issue33-r251-427-428-alta-20261116.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r251-alta.yml
      - scripts/audit/issue33-r251-alta-check.mjs
      - tests/coffee-issue33-r251-alta.test.mjs
      - docs/workstreams/ops-issue33-r251-427-428-alta-20261116.md
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and adversarial regressions
        run: node --test tests/coffee-issue33-r251-alta.test.mjs
      - name: Guarded exact public official parser Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '427,428'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r251
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent current selected raw SHA256 and afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r251
          DIC_R251_VERIFY: '1'
          DIC_R251_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R251_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r251-alta-check.mjs
      - name: Bounded public source artifact one-day retention
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r251-alta-selected427-428
          path: /tmp/dic33-r251/
          retention-days: 1
          if-no-files-found: warn

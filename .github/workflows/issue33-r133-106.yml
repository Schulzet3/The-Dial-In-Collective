name: DIC Issue33 R133 selected original106 official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r133-106.yml
      - scripts/audit/issue33-r133-106-check.mjs
      - tests/coffee-issue33-r133-106.test.mjs
      - docs/workstreams/ops-issue33-r133-106-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r133-106.yml
      - scripts/audit/issue33-r133-106-check.mjs
      - tests/coffee-issue33-r133-106.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Eight exact-current positive and negative selected-source tests
        run: node --test tests/coffee-issue33-r133-106.test.mjs
      - name: Guarded bounded current official HTTPS and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '106'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r133
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact source SHA, selected identity, safety and original603 integrity
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r133
          DIC_ISSUE33_R133_VERIFY: '1'
        run: node scripts/audit/issue33-r133-106-check.mjs
      - name: Retain fresh raw official HTML and source-bound afterproof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r133-106-current-evidence
          path: /tmp/dic33-r133/
          retention-days: 2
          if-no-files-found: warn

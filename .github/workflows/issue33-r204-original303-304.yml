name: DIC Issue33 R204 original303 304 source parser
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r204-original303-304.yml
      - scripts/audit/issue33-r204-original303-304-check.mjs
      - tests/coffee-issue33-r204-original303-304.test.mjs
      - docs/workstreams/ops-issue33-r204-303-304-20261114.md
      - src/server/coffee-page-metadata.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r204-original303-304.yml
      - scripts/audit/issue33-r204-original303-304-check.mjs
      - tests/coffee-issue33-r204-original303-304.test.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Five focused positive hostile regressions
        run: node --test tests/coffee-issue33-r204-original303-304.test.mjs
      - name: Guarded exact selected primary HTTPS sources
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '303,304'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r204
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent strict chosen-source parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r204
          DIC_R204_EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r204-original303-304-check.mjs
      - name: Retain bounded selected source evidence for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r204-original303-304
          path: /tmp/dic33-r204/
          retention-days: 1
          if-no-files-found: warn

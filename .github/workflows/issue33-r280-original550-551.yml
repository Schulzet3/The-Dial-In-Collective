name: DIC Issue33 R280 selected original550 551
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r280-original550-551.yml
      - tests/coffee-issue33-r280-original550-551.test.mjs
      - scripts/audit/issue33-r280-original550-551-check.mjs
      - docs/workstreams/ops-issue33-r280-vermont-original550-551-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r280-original550-551.yml
      - tests/coffee-issue33-r280-original550-551.test.mjs
      - scripts/audit/issue33-r280-original550-551-check.mjs
      - docs/workstreams/ops-issue33-r280-vermont-original550-551-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused positive and adverse tests
        run: node --test tests/coffee-issue33-r280-original550-551.test.mjs
      - name: Bounded SSRF-guarded exact selected official HTTPS and actual parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '550,551'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r280
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently hash current HTML and check Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r280
          DIC_R280_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R280_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r280-original550-551-check.mjs
      - name: Preserve nonsecret bounded source proof one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r280-original550-551
          path: /tmp/dic33-r280/
          retention-days: 1
          if-no-files-found: warn

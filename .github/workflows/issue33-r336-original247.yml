name: DIC Issue33 R336 original247 chosen current Onyx source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r336-original247.yml
      - scripts/audit/issue33-r336-original247-check.mjs
      - tests/coffee-issue33-r336-original247.test.mjs
      - docs/workstreams/ops-issue33-r336-original247-20261119.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r336-original247.yml
      - scripts/audit/issue33-r336-original247-check.mjs
      - tests/coffee-issue33-r336-original247.test.mjs
      - docs/workstreams/ops-issue33-r336-original247-20261119.md
permissions:
  contents: read
jobs:
  original247-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Eight focused selected positive and adversarial regressions
        run: node --test tests/coffee-issue33-r336-original247.test.mjs
      - name: Exactly one bounded DNS TLS guarded official current product
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '247'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r336
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict exact chosen H1 HTML hash current parser Add Coffee and source review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r336
          DIC_R336_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R336_EVENT_SHA: ${{ github.sha }}
          DIC_R336_VERIFY: '1'
        run: node scripts/audit/issue33-r336-original247-check.mjs
      - name: One-day public source-only diagnostic, unavailable source is failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r336-original247
          path: /tmp/dic33-r336/
          retention-days: 1
          if-no-files-found: warn

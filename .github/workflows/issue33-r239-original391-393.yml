name: DIC Issue33 R239 original391-393 current Umble selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r239-original391-393.yml
      - tests/coffee-issue33-r239-original391-393.test.mjs
      - scripts/audit/issue33-r239-original391-393-check.mjs
      - docs/workstreams/ops-issue33-r239-391-393-umble-runtime-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-focused-source-acceptance.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-decaffeination-method.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r239-original391-393.yml
      - tests/coffee-issue33-r239-original391-393.test.mjs
      - scripts/audit/issue33-r239-original391-393-check.mjs
      - docs/workstreams/ops-issue33-r239-391-393-umble-runtime-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-decaffeination-method.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Independent selected and hostile synthetic contracts
        run: node --test tests/coffee-issue33-r239-original391-393.test.mjs
      - name: Guarded exact current official HTTPS parser Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '391,392,393'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r239
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently compare official source hashes and selected semantic roles
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r239
          DIC_R239_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r239-original391-393-check.mjs
      - name: Save short-lived independent selected original evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r239-original391-393
          path: /tmp/dic33-r239/
          retention-days: 1
          if-no-files-found: warn

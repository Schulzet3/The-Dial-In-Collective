name: DIC Issue33 R210 original315 316 current selected evidence
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r210-original315-316.yml
      - scripts/audit/issue33-r210-original315-316-check.mjs
      - tests/coffee-issue33-r210-original315-316.test.mjs
      - docs/workstreams/ops-issue33-r210-315-316-20261114.md
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-selected-named-farm-country-region.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r210-original315-316.yml
      - scripts/audit/issue33-r210-original315-316-check.mjs
      - tests/coffee-issue33-r210-original315-316.test.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-selected-named-farm-country-region.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Direct selected coffee positive and adversarial parser tests
        run: node --test tests/coffee-issue33-r210-original315-316.test.mjs
      - name: Fresh bounded guarded public selected original HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '315,316'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r210
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact source-bound afterproof and actual parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r210
          DIC_R210_EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r210-original315-316-check.mjs
      - name: Retain exact selected original HTML and source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r210-original315-316
          path: /tmp/dic33-r210/
          retention-days: 1
          if-no-files-found: warn

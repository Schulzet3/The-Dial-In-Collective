name: DIC Issue33 R276 Rally selected originals 541 542
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r276-rally-original541-542.yml
      - tests/coffee-issue33-r276-rally-original541-542.test.mjs
      - scripts/audit/issue33-r276-rally-original541-542-check.mjs
      - docs/workstreams/ops-issue33-r276-rally-original541-542-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r276-rally-original541-542.yml
      - tests/coffee-issue33-r276-rally-original541-542.test.mjs
      - scripts/audit/issue33-r276-rally-original541-542-check.mjs
      - docs/workstreams/ops-issue33-r276-rally-original541-542-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected source and adversarial identity regressions
        run: node --test tests/coffee-issue33-r276-rally-original541-542.test.mjs
      - name: Bounded guarded exact HTTPS plus actual parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '541,542'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r276
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify raw SHA256 and Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r276
          DIC_R276_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R276_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r276-rally-original541-542-check.mjs
      - name: Preserve credential-free exact source evidence one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r276-rally-original541-542
          path: /tmp/dic33-r276/
          retention-days: 1
          if-no-files-found: warn

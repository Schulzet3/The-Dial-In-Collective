name: DIC Issue33 R159 original188 selected Dehab Diamond audit
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r159-188.yml
      - scripts/audit/issue33-r159-188-check.mjs
      - tests/coffee-issue33-r159-188.test.mjs
      - docs/workstreams/ops-issue33-r159-188-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r159-188.yml
      - scripts/audit/issue33-r159-188-check.mjs
      - tests/coffee-issue33-r159-188.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected original188 positive and hostile contracts
        run: node --test tests/coffee-issue33-r159-188.test.mjs
      - name: Bounded guarded public HTTPS and actual current parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '188'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r159
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict current selected source and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_R159_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r159
        run: node scripts/audit/issue33-r159-188-check.mjs
      - name: Preserve source HTML, evidence and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r159-selected-188
          path: /tmp/dic33-r159/
          retention-days: 2
          if-no-files-found: warn

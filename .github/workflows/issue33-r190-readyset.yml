name: DIC Issue33 R190 selected Ready Set original274
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r190-readyset.yml
      - scripts/audit/issue33-r190-274-check.mjs
      - tests/coffee-issue33-r190-274.test.mjs
      - docs/workstreams/ops-issue33-r190-274-20261113.md
      - src/server/coffee-page-metadata.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r190-readyset.yml
      - scripts/audit/issue33-r190-274-check.mjs
      - tests/coffee-issue33-r190-274.test.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Ready Set selected real-parser positive and negative tests
        run: node --test tests/coffee-issue33-r190-274.test.mjs
      - name: Guarded exact selected public official HTTPS and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '274'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r190
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent raw source and current parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r190
        run: node scripts/audit/issue33-r190-274-check.mjs
      - name: Preserve bounded public-source evidence briefly
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r190-current274
          path: /tmp/dic33-r190/
          retention-days: 1
          if-no-files-found: warn

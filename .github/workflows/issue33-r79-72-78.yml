name: DIC Issue33 R79 source 72-78 & 69 triage
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r79-72-78.yml
      - scripts/audit/issue33-r79-72-78-check.mjs
      - tests/coffee-issue33-r79-72-78-contract.test.mjs
      - docs/workstreams/ops-issue33-r79-72-78-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r79-72-78.yml
      - scripts/audit/issue33-r79-72-78-check.mjs
      - tests/coffee-issue33-r79-72-78-contract.test.mjs
permissions:
  contents: read
jobs:
  source-72-78:
    name: original603-72-78-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and adversarial selected-product contracts
        run: node --test tests/coffee-issue33-r79-72-78-contract.test.mjs
      - name: Bounded guarded official HTTPS / actual parser / Add Coffee and review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '72,78'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r79-72-78
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Fail-closed independent literal selected afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r79-72-78
          DIC_ISSUE33_R79_VERIFY: '1'
        run: node scripts/audit/issue33-r79-72-78-check.mjs
      - name: One-day public source artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r79-72-78
          path: /tmp/dic33-r79-72-78/
          retention-days: 1
          if-no-files-found: warn
  unavailable-69:
    name: original603-69-unverified-official-source-diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Bounded fresh exact #69 official probe (failure remains not certified)
        continue-on-error: true
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '69'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r79-69
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: One-day source failure/identity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r79-69-uncertified
          path: /tmp/dic33-r79-69/
          retention-days: 1
          if-no-files-found: warn

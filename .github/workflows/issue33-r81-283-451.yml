name: DIC Issue33 R81 selected original603 283 and 451
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r81-283-451.yml
      - scripts/audit/issue33-r81-283-451-check.mjs
      - tests/coffee-issue33-r81-283-451-contract.test.mjs
      - docs/workstreams/ops-issue33-r81-283-451-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r81-283-451.yml
      - scripts/audit/issue33-r81-283-451-check.mjs
      - tests/coffee-issue33-r81-283-451-contract.test.mjs
permissions:
  contents: read
jobs:
  selected-283-451:
    name: original603-283-451-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Independent positive and adversarial contracts
        run: node --test tests/coffee-issue33-r81-283-451-contract.test.mjs
      - name: Fresh guarded official HTTPS and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '283,451'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r81-283-451
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Fail-closed selected current source afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r81-283-451
          DIC_ISSUE33_R81_VERIFY: '1'
        run: node scripts/audit/issue33-r81-283-451-check.mjs
      - name: One-day source-bound evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r81-283-451
          path: /tmp/dic33-r81-283-451/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R350 bounded Buesaco runner transport diagnosis
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r350-241-transport.yml
      - scripts/audit/issue33-r350-241-transport.mjs
      - tests/coffee-issue33-r350-241-transport.test.mjs
      - docs/workstreams/ops-issue33-r350-241-runner-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r350-241-transport.yml
      - scripts/audit/issue33-r350-241-transport.mjs
      - tests/coffee-issue33-r350-241-transport.test.mjs
permissions:
  contents: read
jobs:
  current-runner-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Bounded positive and hostile evidence-classification regressions
        run: node --test tests/coffee-issue33-r350-241-transport.test.mjs
      - name: One bounded official first-party transport comparison
        env:
          DIC_ISSUE33_R350_RUN: '1'
          DIC_ISSUE33_R350_DIR: /tmp/dic33-r350
        run: node scripts/audit/issue33-r350-241-transport.mjs
      - name: Retain source-bound diagnostic, whether blocked or successful
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r350-buesaco-transport
          path: /tmp/dic33-r350/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R176 original252 Orleans Windsor Court selected blend
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r176-252.yml
      - scripts/audit/issue33-r176-252-check.mjs
      - tests/coffee-issue33-r176-252.test.mjs
      - src/server/coffee-page-metadata.mjs
      - docs/workstreams/ops-issue33-r176-252-20261113.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r176-252.yml
      - scripts/audit/issue33-r176-252-check.mjs
      - tests/coffee-issue33-r176-252.test.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and adversarial selected coffee parser regressions
        run: node --test tests/coffee-issue33-r176-252.test.mjs
      - name: Guarded actual current official selected HTTPS and parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '252'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r176
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict current selected source and roast-component afterproof
        if: always()
        env:
          DIC_ISSUE33_R176_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r176
        run: node scripts/audit/issue33-r176-252-check.mjs
      - name: Preserve bounded public HTML and parser afterproof artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r176-original252
          path: /tmp/dic33-r176/
          retention-days: 2
          if-no-files-found: warn

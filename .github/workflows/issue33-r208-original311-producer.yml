name: DIC Issue33 R208 original311 selected current producer
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r208-original311-producer.yml
      - scripts/audit/issue33-r208-original311-producer-check.mjs
      - tests/coffee-issue33-r208-original311-producer.test.mjs
      - docs/workstreams/ops-issue33-r208-311-producer-20261114.md
      - src/server/coffee-selected-context-roles.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r208-original311-producer.yml
      - scripts/audit/issue33-r208-original311-producer-check.mjs
      - tests/coffee-issue33-r208-original311-producer.test.mjs
      - src/server/coffee-selected-context-roles.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Five producer role positive and hostile tests
        run: node --test tests/coffee-issue33-r208-original311-producer.test.mjs
      - name: Guarded exact original official #311 HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '311'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r208
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected current source and producer afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r208
          DIC_R208_EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r208-original311-producer-check.mjs
      - name: Preserve original selected HTML evidence 1 day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r208-original311
          path: /tmp/dic33-r208/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R282 selected original535 536
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r282-original535-536.yml
      - tests/coffee-issue33-r282-original535-536.test.mjs
      - scripts/audit/issue33-r282-original535-536-check.mjs
      - docs/workstreams/ops-issue33-r282-paper-plane-original535-536-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r282-original535-536.yml
      - tests/coffee-issue33-r282-original535-536.test.mjs
      - scripts/audit/issue33-r282-original535-536-check.mjs
      - docs/workstreams/ops-issue33-r282-paper-plane-original535-536-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected and hostile parser tests
        run: node --test tests/coffee-issue33-r282-original535-536.test.mjs
      - name: Guarded official selected product HTTPS, actual parser and UI
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '535,536'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r282
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent selected HTML hash and direct-source afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r282
          DIC_R282_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R282_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r282-original535-536-check.mjs
      - name: Preserve nonsecret raw source proof one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r282-original535-536
          path: /tmp/dic33-r282/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R321 original603 #93 selected Medium and flavors
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r321-original93.test.mjs
      - scripts/audit/issue33-r321-original93-check.mjs
      - .github/workflows/issue33-r321-original93.yml
      - docs/workstreams/ops-issue33-r321-original93-20261119.md
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r321-original93.test.mjs
      - scripts/audit/issue33-r321-original93-check.mjs
      - .github/workflows/issue33-r321-original93.yml
      - docs/workstreams/ops-issue33-r321-original93-20261119.md
permissions:
  contents: read
jobs:
  original93-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Six focused real-parser positive and adversarial checks
        run: node --test tests/coffee-issue33-r321-original93.test.mjs
      - name: One exact selected original guarded public HTTPS product
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '93'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r321
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict raw selected identity, facts, preview and source review afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r321
          DIC_R321_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R321_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r321-original93-check.mjs
      - name: One-day public selected-source diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r321-original93
          path: /tmp/dic33-r321/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R297 selected original585
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r297-original585.test.mjs
      - scripts/audit/issue33-r297-original585-check.mjs
      - .github/workflows/issue33-r297-original585.yml
      - docs/workstreams/ops-issue33-r297-original585-20261118.md
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r297-original585.test.mjs
      - scripts/audit/issue33-r297-original585-check.mjs
      - .github/workflows/issue33-r297-original585.yml
      - docs/workstreams/ops-issue33-r297-original585-20261118.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused current parser and negative controls
        run: node --test tests/coffee-issue33-r297-original585.test.mjs
      - name: Guarded fresh public official URL
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '585'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r297
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact raw source, identity, and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r297
          DIC_R297_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R297_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r297-original585-check.mjs
      - name: Retain public evidence one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r297-original585
          path: /tmp/dic33-r297/
          retention-days: 1
          if-no-files-found: warn

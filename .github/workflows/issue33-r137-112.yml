name: DIC Issue33 R137 selected original112 official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r137-112.yml
      - scripts/audit/issue33-r137-112-check.mjs
      - tests/coffee-issue33-r137-112.test.mjs
      - docs/workstreams/ops-issue33-r137-112-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r137-112.yml
      - scripts/audit/issue33-r137-112-check.mjs
      - tests/coffee-issue33-r137-112.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Twelve selected direct and adversarial fixtures
        run: node --test tests/coffee-issue33-r137-112.test.mjs
      - name: Guarded bounded current official selected source and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '112'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r137
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict exact SHA and current selected source afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r137
          DIC_ISSUE33_R137_VERIFY: '1'
        run: node scripts/audit/issue33-r137-112-check.mjs
      - name: Preserve official current raw HTML and parser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r137-112-current-evidence
          path: /tmp/dic33-r137/
          retention-days: 2
          if-no-files-found: warn

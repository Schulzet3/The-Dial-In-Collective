name: DIC Issue33 R80 selected original603 118 and 127
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r80-118-127.yml
      - scripts/audit/issue33-r80-118-127-check.mjs
      - tests/coffee-issue33-r80-118-127-contract.test.mjs
      - docs/workstreams/ops-issue33-r80-118-127-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r80-118-127.yml
      - scripts/audit/issue33-r80-118-127-check.mjs
      - tests/coffee-issue33-r80-118-127-contract.test.mjs
permissions:
  contents: read
jobs:
  selected-118-127:
    name: original603-118-127-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Explicit selected-source positive and hostile contracts
        run: node --test tests/coffee-issue33-r80-118-127-contract.test.mjs
      - name: Fresh bounded official HTTPS and actual Add Coffee parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '118,127'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r80-118-127
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Fail-closed current selected source and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r80-118-127
          DIC_ISSUE33_R80_VERIFY: '1'
        run: node scripts/audit/issue33-r80-118-127-check.mjs
      - name: Temporary source-bound artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r80-118-127
          path: /tmp/dic33-r80-118-127/
          retention-days: 1
          if-no-files-found: warn

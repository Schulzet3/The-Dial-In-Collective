name: DIC Issue33 R154 exact selected Kings Peak 175
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r154-175.yml
      - scripts/audit/issue33-r154-175-check.mjs
      - tests/coffee-issue33-r154-175.test.mjs
      - docs/workstreams/ops-issue33-r154-175-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r154-175.yml
      - scripts/audit/issue33-r154-175-check.mjs
      - tests/coffee-issue33-r154-175.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected product negatives
        run: node --test tests/coffee-issue33-r154-175.test.mjs
      - name: Guarded real chosen official HTTPS plus current parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '175'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r154
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict exact source, Add Coffee and Source Review afterproof
        if: always()
        env:
          DIC_ISSUE33_R154_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r154
        run: node scripts/audit/issue33-r154-175-check.mjs
      - name: Preserve public official source and failure proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r154-selected-175
          path: /tmp/dic33-r154/
          retention-days: 2
          if-no-files-found: warn

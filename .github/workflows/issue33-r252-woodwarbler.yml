name: DIC Issue33 R252 Wood Warbler original415-417 official
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r252-woodwarbler.yml
      - scripts/audit/issue33-r252-woodwarbler-check.mjs
      - tests/coffee-issue33-r252-woodwarbler.test.mjs
      - docs/workstreams/ops-issue33-r252-415-417-woodwarbler-20261116.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r252-woodwarbler.yml
      - scripts/audit/issue33-r252-woodwarbler-check.mjs
      - tests/coffee-issue33-r252-woodwarbler.test.mjs
      - docs/workstreams/ops-issue33-r252-415-417-woodwarbler-20261116.md
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and adversarial contracts
        run: node --test tests/coffee-issue33-r252-woodwarbler.test.mjs
      - name: Guarded current official parser Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '415,416,417'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r252
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent selected source SHA256 and afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r252
          DIC_R252_VERIFY: '1'
          DIC_R252_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R252_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r252-woodwarbler-check.mjs
      - name: One-day public evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r252-woodwarbler-415-417
          path: /tmp/dic33-r252/
          retention-days: 1
          if-no-files-found: warn

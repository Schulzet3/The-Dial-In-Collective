name: DIC Issue267 pinned historical file and line inventory
# Audit-only. Checkout the historical immutable source. Never build/publish.
on:
  push:
    branches:
      - audit/issue267-semantic-ledger-20261029
    paths:
      - .github/workflows/issue267-frozen-inventory.yml
permissions:
  contents: write
jobs:
  inventory:
    if: github.repository == 'Schulzet3/The-Dial-In-Collective'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: abc4d3aa7225f0f2f2b75e0ed2108725b02e40a9
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Screen every original tracked UTF-8 line using the existing verified scanner
        run: node scripts/audit/issue161-full-source-review.mjs
      - name: Verify frozen tree and construct per-file metadata-only manifest
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {strict as assert} from 'node:assert';
          const source='abc4d3aa7225f0f2f2b75e0ed2108725b02e40a9';
          const expectedTree='c54ade64eca30946df8858297578a172f5cf6fa8';
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const tree=execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          assert.equal(head,source,'Historical source commit drift');
          assert.equal(tree,expectedTree,'Historical tree drift');
          const report=JSON.parse(readFileSync('qa_artifacts/issue161/full-tracked-source-line-audit.json','utf8'));
          assert.deepEqual([report.totals.tracked_files,report.totals.total_bytes,report.totals.text_files,report.totals.text_lines,report.totals.binary_files,report.totals.invalid_json_files,report.totals.critical_candidates],[757,32436318,754,579961,3,0,0],'Historical denominator drift');
          const blobs=new Map();
          for(const record of execFileSync('git',['ls-files','--stage','-z'],{encoding:'utf8'}).split('\0').filter(Boolean)){
            const tab=record.indexOf('\t');
            assert.ok(tab>0,'Unparsable indexed path');
            const entry=record.slice(0,tab).split(' ');
            assert.equal(entry[0],'100644','Original source includes nonregular file');
            blobs.set(record.slice(tab+1),entry[1]);
          }
          const files=report.files.map(f=>{
            const blob_sha=blobs.get(f.path);
            assert.match(blob_sha||'',/^[a-f0-9]{40}$/);
            return {path:f.path,source_blob_sha:blob_sha,sha256:f.sha256,bytes:f.bytes,kind:f.kind,line_count:f.lines,source_line_first:f.lines?1:null,source_line_last:f.lines||null,semantic_status:'NOT_REVIEWED_BY_THIS_MACHINE_INVENTORY'};
          });
          assert.equal(files.length,757);
          assert.equal(new Set(files.map(f=>f.path)).size,757);
          const output={schema_version:1,issue:267,source_commit:source,source_tree:tree,totals:report.totals,method:'Verified original-source Git checkout + existing deterministic full UTF-8 line scanner; MACHINE INVENTORY ONLY, never line-level semantic certification',files};
          const json=JSON.stringify(output,null,2)+'\n';
          writeFileSync('/tmp/issue267-frozen-source-inventory.json',json);
          const request={branch:'audit/issue267-semantic-ledger-20261029',message:'docs(issue267): pin 757 original blob per-file line counts [skip netlify]',content:Buffer.from(json).toString('base64')};
          writeFileSync('/tmp/issue267-publish-request.json',JSON.stringify(request));
          console.log('Verified exact frozen original source: '+JSON.stringify(report.totals));
          NODE
      - name: Persist original file SHA and line counts to the audit branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/docs/audits/issue267-frozen-source-inventory.json" --input /tmp/issue267-publish-request.json >/tmp/issue267-write.json
          node -e "const r=require('/tmp/issue267-write.json'); console.log('Audit-branch manifest commit '+r.commit.sha)"

name: DIC Issue33 R207 original310 312 selected current ICONIK
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r207-original310-312.yml
      - scripts/audit/issue33-r207-original310-312-check.mjs
      - tests/coffee-issue33-r207-original310-312.test.mjs
      - docs/workstreams/ops-issue33-r207-310-312-20261114.md
      - src/server/coffee-page-metadata.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r207-original310-312.yml
      - scripts/audit/issue33-r207-original310-312-check.mjs
      - tests/coffee-issue33-r207-original310-312.test.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Seven selected positive and hostile negative parser assertions
        run: node --test tests/coffee-issue33-r207-original310-312.test.mjs
      - name: Bounded original selected official HTTPS #310/#311/#312
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '310,311,312'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r207
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact independent selected source and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r207
          DIC_R207_EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r207-original310-312-check.mjs
      - name: Retain original selected HTML and source evidence (1 day)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r207-original310-312
          path: /tmp/dic33-r207/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R284 selected original546 548
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r284-original546-548.yml
      - tests/coffee-issue33-r284-original546-548.test.mjs
      - scripts/audit/issue33-r284-original546-548-check.mjs
      - docs/workstreams/ops-issue33-r284-original546-548-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r284-original546-548.yml
      - tests/coffee-issue33-r284-original546-548.test.mjs
      - scripts/audit/issue33-r284-original546-548-check.mjs
      - docs/workstreams/ops-issue33-r284-original546-548-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected and adverse identity tests
        run: node --test tests/coffee-issue33-r284-original546-548.test.mjs
      - name: Guarded official public HTTPS and current parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '546,547,548'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r284
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent source hashes, identity and Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r284
          DIC_R284_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R284_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r284-original546-548-check.mjs
      - name: Preserve nonsecret bounded source proof one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r284-original546-548
          path: /tmp/dic33-r284/
          retention-days: 1
          if-no-files-found: warn

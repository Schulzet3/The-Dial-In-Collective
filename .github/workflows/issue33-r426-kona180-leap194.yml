name: DIC Issue33 R426 original180 194 bounded current selected evidence
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r426-kona180-leap194.yml'
      - 'scripts/audit/issue33-r426-kona180-leap194-check.mjs'
      - 'tests/issue33-r426-kona180-leap194.test.mjs'
  push:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r426-kona180-leap194.yml'
      - 'scripts/audit/issue33-r426-kona180-leap194-check.mjs'
      - 'tests/issue33-r426-kona180-leap194.test.mjs'
permissions:
  contents: read
jobs:
  current-official-180-194:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Pin the actual checked-out source and hostile local checks
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$DIC_EXPECTED_SHA"
          node --check scripts/audit/issue33-r426-kona180-leap194-check.mjs
          node --test tests/issue33-r426-kona180-leap194.test.mjs
      - name: Required guarded official product HTTPS parser unsaved UI and Source Review
        env:
          DIC_R426_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '180,194'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r426
        run: GITHUB_SHA="$DIC_R426_SHA" node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Rehash live raw seller HTML and enforce direct current selected fields
        if: always()
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_R426_RUN: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r426
        run: node scripts/audit/issue33-r426-kona180-leap194-check.mjs
      - name: Retain bounded private raw source evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r426-exact-selected-current
          path: /tmp/dic33-r426/
          retention-days: 1
          if-no-files-found: warn

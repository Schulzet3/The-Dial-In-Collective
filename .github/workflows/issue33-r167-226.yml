name: DIC Issue33 R167 original226 Mighty Beast selected official
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r167-226.yml
      - scripts/audit/issue33-r167-226-check.mjs
      - tests/coffee-issue33-r167-226.test.mjs
      - docs/workstreams/ops-issue33-r167-226-20261113.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r167-226.yml
      - scripts/audit/issue33-r167-226-check.mjs
      - tests/coffee-issue33-r167-226.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected source and hostile parser tests
        run: node --test tests/coffee-issue33-r167-226.test.mjs
      - name: Guarded current selected official HTTPS and real parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '226'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r167
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict afterproof of selected source and parsed output
        if: always()
        env:
          DIC_ISSUE33_R167_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r167
        run: node scripts/audit/issue33-r167-226-check.mjs
      - name: Preserve raw official source and any failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r167-original226
          path: /tmp/dic33-r167/
          retention-days: 2
          if-no-files-found: warn

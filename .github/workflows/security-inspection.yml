name: DIC source security inventory and dependency advisory
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - 'site/**'
      - 'src/**'
      - 'netlify/**'
      - 'supabase/functions/**'
      - 'package*.json'
      - 'scripts/audit/security-inventory.mjs'
      - '.github/workflows/security-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Inventory every tracked file and screen text without printing secrets
        run: node scripts/audit/security-inventory.mjs
      - name: Check the exact production dependency lock against current advisories
        run: npm audit --omit=dev --json > qa_artifacts/security/dependency-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dic-source-security-${{ github.run_id }}
          path: qa_artifacts/security/
          retention-days: 7
          if-no-files-found: error

name: DIC Issue33 R362 original22 COMSA selected source review
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r362-original22.yml
      - scripts/audit/issue33-r362-original22-check.mjs
      - tests/coffee-issue33-r362-original22.test.mjs
      - docs/workstreams/ops-issue33-r362-original22-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r362-original22.yml
      - scripts/audit/issue33-r362-original22-check.mjs
      - tests/coffee-issue33-r362-original22.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Original22 selected direct evidence and hostile regressions
        run: node --test tests/coffee-issue33-r362-original22.test.mjs
      - name: One original22 guarded public HTTPS selected product
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '22'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r362
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact raw HTML SHA source/parser no-save UI evidence and missing-field guard
        if: always()
        env:
          DIC_R362_VERIFY: '1'
          DIC_R362_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R362_EVENT_SHA: ${{ github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r362
        run: node scripts/audit/issue33-r362-original22-check.mjs
      - name: Retain failure and positive evidence one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r362-original22
          path: /tmp/dic33-r362/
          retention-days: 1
          if-no-files-found: warn

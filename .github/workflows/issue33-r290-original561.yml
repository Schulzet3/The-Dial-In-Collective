name: DIC Issue33 R290 selected original561
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r290-original561.yml
      - tests/coffee-issue33-r290-original561.test.mjs
      - scripts/audit/issue33-r290-original561-check.mjs
      - docs/workstreams/ops-issue33-r290-original561-20261118.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r290-original561.yml
      - tests/coffee-issue33-r290-original561.test.mjs
      - scripts/audit/issue33-r290-original561-check.mjs
      - docs/workstreams/ops-issue33-r290-original561-20261118.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused exact current selected and hostile parser tests
        run: node --test tests/coffee-issue33-r290-original561.test.mjs
      - name: Fetch selected official public HTTPS using existing SSRF and DNS guarded client
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '561'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r290
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict raw source current identity selected fields Add Coffee Source Review afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r290
          DIC_R290_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R290_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r290-original561-check.mjs
      - name: Retain raw actual original source evidence one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r290-original561
          path: /tmp/dic33-r290/
          retention-days: 1
          if-no-files-found: warn

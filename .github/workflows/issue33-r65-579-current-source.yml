name: DIC Issue33 R65 original603 579 exact selected source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-r65:
    name: original603-579-square-selected-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Original current product and hostile provenance controls
        run: node --test tests/coffee-issue33-r65-579-source-contract.test.mjs
      - name: Guarded read-only exact selected original603 HTTPS and preview
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: ${{ runner.temp }}/dic33-r65-579
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '579'
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected raw HTML and current parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: ${{ runner.temp }}/dic33-r65-579
        run: node scripts/audit/issue33-r65-579-afterproof.mjs
      - name: Retain one-day selected HTML JSON and verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r65-579-${{ github.run_id }}
          path: ${{ runner.temp }}/dic33-r65-579/
          if-no-files-found: error
          retention-days: 1

name: DIC Issue33 R161 original203 selected Colombian decaf review
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r161-203.yml
      - scripts/audit/issue33-r161-203-check.mjs
      - tests/coffee-issue33-r161-203.test.mjs
      - docs/workstreams/ops-issue33-r161-203-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r161-203.yml
      - scripts/audit/issue33-r161-203-check.mjs
      - tests/coffee-issue33-r161-203.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected #203 positive and adversarial assertions
        run: node --test tests/coffee-issue33-r161-203.test.mjs
      - name: Guarded current official HTTPS plus actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '203'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r161
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict current source/identity/parser afterproof
        if: always()
        env:
          DIC_ISSUE33_R161_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r161
        run: node scripts/audit/issue33-r161-203-check.mjs
      - name: Preserve current raw official evidence and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r161-original203
          path: /tmp/dic33-r161/
          retention-days: 2
          if-no-files-found: warn

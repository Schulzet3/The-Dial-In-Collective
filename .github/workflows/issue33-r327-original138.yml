name: DIC Issue33 R327 Gnosis original138 current official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r327-original138.yml
      - scripts/audit/issue33-r327-original138-check.mjs
      - tests/coffee-issue33-r327-original138.test.mjs
      - docs/workstreams/ops-issue33-r327-original138-20261119.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r327-original138.yml
      - scripts/audit/issue33-r327-original138-check.mjs
      - tests/coffee-issue33-r327-original138.test.mjs
      - docs/workstreams/ops-issue33-r327-original138-20261119.md
permissions:
  contents: read
jobs:
  original138-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused positive and adversarial current parser tests
        run: node --test tests/coffee-issue33-r327-original138.test.mjs
      - name: One guarded HTTPS exact first-party selected coffee
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '138'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r327
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict H1 source hash current parser Add Coffee and own notes
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r327
          DIC_R327_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R327_EVENT: ${{ github.sha }}
          DIC_R327_VERIFY: '1'
        run: node scripts/audit/issue33-r327-original138-check.mjs
      - name: One-day first-party raw source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r327-original138
          path: /tmp/dic33-r327/
          retention-days: 1
          if-no-files-found: warn

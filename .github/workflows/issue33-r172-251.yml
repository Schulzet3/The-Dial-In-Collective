name: DIC Issue33 R172 original251 Orleans Decaf conditional roast
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r172-251.yml
      - scripts/audit/issue33-r172-251-check.mjs
      - tests/coffee-issue33-r172-251.test.mjs
      - src/server/coffee-page-metadata.mjs
      - docs/RELEASE_QUEUE.json
      - docs/workstreams/ops-issue33-r172-251-20261113.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r172-251.yml
      - scripts/audit/issue33-r172-251-check.mjs
      - tests/coffee-issue33-r172-251.test.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected positive and adversarial parser tests
        run: node --test tests/coffee-issue33-r172-251.test.mjs
      - name: Guarded HTTPS actual selected official source and parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '251'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r172
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected identity, source, conditional roast afterproof
        if: always()
        env:
          DIC_ISSUE33_R172_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r172
        run: node scripts/audit/issue33-r172-251-check.mjs
      - name: Preserve official HTML/parser/afterproof artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r172-original251
          path: /tmp/dic33-r172/
          retention-days: 2
          if-no-files-found: warn

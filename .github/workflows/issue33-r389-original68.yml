name: DIC Issue33 R389 original68 Black Honey Berries exact selected source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r389-original68.yml
      - scripts/audit/issue33-r389-original68-check.mjs
      - tests/coffee-issue33-r389-original68.test.mjs
      - docs/workstreams/ops-issue33-r389-original68-20261121.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r389-original68.yml
      - scripts/audit/issue33-r389-original68-check.mjs
      - tests/coffee-issue33-r389-original68.test.mjs
      - docs/workstreams/ops-issue33-r389-original68-20261121.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected identity, process role and hostile non-selected regressions
        run: node --test tests/coffee-issue33-r389-original68.test.mjs
      - name: Only exact original603 number 68 guarded real first-party public HTTPS
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '68'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r389
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Fail closed on missing selected raw H1, actual parser or no-save UI
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r389
          DIC_R389_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R389_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r389-original68-check.mjs
      - name: Retain one-day public-only raw HTML and afterproof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r389-original68
          path: /tmp/dic33-r389/
          retention-days: 1
          if-no-files-found: warn

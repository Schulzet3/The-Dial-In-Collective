name: DIC Issue33 R136 selected original115 official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r136-115.yml
      - scripts/audit/issue33-r136-115-check.mjs
      - tests/coffee-issue33-r136-115.test.mjs
      - docs/workstreams/ops-issue33-r136-115-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r136-115.yml
      - scripts/audit/issue33-r136-115-check.mjs
      - tests/coffee-issue33-r136-115.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Twelve selected direct and adversarial fixtures
        run: node --test tests/coffee-issue33-r136-115.test.mjs
      - name: Bounded guarded current official selected source and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '115'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r136
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact SHA source facts and actual UI afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r136
          DIC_ISSUE33_R136_VERIFY: '1'
        run: node scripts/audit/issue33-r136-115-check.mjs
      - name: Preserve raw official HTML and bounded current parser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r136-115-current-evidence
          path: /tmp/dic33-r136/
          retention-days: 2
          if-no-files-found: warn

name: DIC Issue33 R102 original603 selected 533 and 539
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r102-533-539.yml
      - scripts/audit/issue33-r102-533-539-check.mjs
      - tests/coffee-issue33-r102-533-539.test.mjs
      - docs/workstreams/ops-issue33-r102-533-539-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r102-533-539.yml
      - scripts/audit/issue33-r102-533-539-check.mjs
      - tests/coffee-issue33-r102-533-539.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    name: original603-533-539-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected and hostile direct source regressions
        run: node --test tests/coffee-issue33-r102-533-539.test.mjs
      - name: Guarded exact official HTTPS and actual parser Add Coffee Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '533,539'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r102
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict original source bounded selected product afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r102
          DIC_ISSUE33_R102_VERIFY: '1'
        run: node scripts/audit/issue33-r102-533-539-check.mjs
      - name: Retain bounded actual selected source artifacts for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r102-533-539-selected
          path: /tmp/dic33-r102/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R267 original519 exact Wilder Garcia source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r267-original519-wilder.yml
      - tests/coffee-issue33-r267-519-wilder-source.test.mjs
      - scripts/audit/issue33-r267-519-wilder-check.mjs
      - docs/workstreams/ops-issue33-r267-519-wilder-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r267-original519-wilder.yml
      - tests/coffee-issue33-r267-519-wilder-source.test.mjs
      - scripts/audit/issue33-r267-519-wilder-check.mjs
      - docs/workstreams/ops-issue33-r267-519-wilder-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Current selected original519 and adversarial seller identity tests
        run: node --test tests/coffee-issue33-r267-519-wilder-source.test.mjs
      - name: Guarded exact selected seller HTTPS current parser Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '519'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r267
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify raw source/identity/current parser and immutable original register
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r267
          DIC_R267_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R267_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r267-519-wilder-check.mjs
      - name: One-day public raw proof for independent rehash
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r267-original519-wilder
          path: /tmp/dic33-r267/
          retention-days: 1
          if-no-files-found: warn

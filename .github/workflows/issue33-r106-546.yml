name: DIC Issue33 R106 original603 selected 546 Venezuela
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r106-546.yml
      - scripts/audit/issue33-r106-546-check.mjs
      - tests/coffee-issue33-r106-546.test.mjs
      - docs/workstreams/ops-issue33-r106-546-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r106-546.yml
      - scripts/audit/issue33-r106-546-check.mjs
      - tests/coffee-issue33-r106-546.test.mjs
permissions:
  contents: read
jobs:
  current-selected:
    name: original603-546-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and hostile exact-product contracts
        run: node --test tests/coffee-issue33-r106-546.test.mjs
      - name: Bounded public HTTPS selected original coffee, actual parser and Add Coffee review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '546'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r106
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict original source-bound current identity and direct evidence afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r106
          DIC_ISSUE33_R106_VERIFY: '1'
        run: node scripts/audit/issue33-r106-546-check.mjs
      - name: Save bounded source evidence without member data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r106-546
          path: /tmp/dic33-r106/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R223 original347-348 exact current official sources
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r223-original347-348.yml
      - tests/coffee-issue33-r223-original347-348.test.mjs
      - scripts/audit/issue33-r223-original347-348-check.mjs
      - docs/workstreams/ops-issue33-r223-347-348-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-selected-description-sensory.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-selected-offer-h2.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r223-original347-348.yml
      - tests/coffee-issue33-r223-original347-348.test.mjs
      - scripts/audit/issue33-r223-original347-348-check.mjs
      - docs/workstreams/ops-issue33-r223-347-348-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-selected-description-sensory.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-selected-offer-h2.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and hostile selected source contracts
        run: node --test tests/coffee-issue33-r223-original347-348.test.mjs
      - name: Guarded primary official HTTPS and actual parser/Add Coffee
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '347,348'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r223
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent selected-product current raw SHA256 afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r223
          DIC_R223_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r223-original347-348-check.mjs
      - name: Retain current public product evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r223-original347-348
          path: /tmp/dic33-r223/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R78 original603 26 Bleu selected source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r78-26-bleu.yml
      - scripts/audit/issue33-r78-26-check.mjs
      - tests/coffee-issue33-r78-26-selected-contract.test.mjs
      - docs/workstreams/ops-issue33-r78-26-bleu-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r78-26-bleu.yml
      - scripts/audit/issue33-r78-26-check.mjs
      - tests/coffee-issue33-r78-26-selected-contract.test.mjs
permissions:
  contents: read
jobs:
  selected-bleu-26:
    name: original603-26-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Exact selected positive and adversarial source tests
        run: node --test tests/coffee-issue33-r78-26-selected-contract.test.mjs
      - name: Bounded official HTTPS and real parser, Add Coffee, Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '26'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r78-26
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Fail-closed exact raw selected and current parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r78-26
          DIC_ISSUE33_R78_VERIFY: '1'
        run: node scripts/audit/issue33-r78-26-check.mjs
      - name: Keep public source artifact for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r78-bleu-26
          path: /tmp/dic33-r78-26/
          if-no-files-found: warn
          retention-days: 1

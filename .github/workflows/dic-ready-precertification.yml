name: DIC proactive READY candidate pre-certification
# Owner #3347 explicit supersession: pre-test immutable READY source without publishing.
# Does NOT create a production grant, main request, Netlify build or provider write.
# Actions never push source refs; the scoped GitHub connector independently
# reproduces and SHA-checks source Git objects to create final candidate CI ref.
on:
  push:
    branches: [main]
    # A new main controller source repair must produce a fresh read-only source
    # receipt, even when development's READY queue did not change in that hour.
    paths:
      - '.github/workflows/dic-ready-precertification.yml'
      - 'scripts/release/precertify-ready-source.mjs'
      - 'scripts/release/stage-ready-only-candidate.mjs'
      - 'scripts/release/ready-only-candidate.mjs'
      - 'scripts/release/verified-prospective-qa.mjs'
      - 'scripts/release/ready-evidence-gate.mjs'
      - 'scripts/release/verify-certified-ready-evidence.mjs'
      - 'docs/workstreams/issue-3889-prospective-input.json'
      - 'docs/workstreams/issue-3889-prospective-publisher-audit.json'
  workflow_run:
    workflows: ['DIC approval, implementation and continuity contract']
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: dic-ready-precertification
  cancel-in-progress: false
jobs:
  precertify-source:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'development/backend-foundation')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fast skip stale or queue-unchanged approvals before checkout
        id: event_gate
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          decide() { echo "proceed=$1" >> "$GITHUB_OUTPUT"; }
          # Any API/CLI/parse error falls back to the original full Git check.
          live="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/development/backend-foundation" --jq '.object.sha' 2>/dev/null)" || { decide true; exit 0; }
          if [ "$live" != "$EVENT_HEAD" ]; then
            echo 'NOT_APPLICABLE: newer development SHA owns pre-certification'
            decide false
            exit 0
          fi
          # GitHub returns at most 300 changed files in this response: never
          # skip when the list is truncated, missing, empty, or API unavailable.
          kind="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${EVENT_HEAD}" --jq 'if (.files | type) != "array" or (.files | length) == 0 or (.files | length) >= 300 then "unknown" elif any(.files[]; .filename == "docs/RELEASE_QUEUE.json") then "queue" else "unrelated" end' 2>/dev/null)" || { decide true; exit 0; }
          if [ "$kind" = 'unrelated' ]; then
            echo 'NOT_APPLICABLE: exact source has no queue change'
            decide false
            exit 0
          fi
          # A queue-changing approval can still have zero eligible READY work.
          # Only skip when the exact event-SHA Git blob and schema prove that.
          # An unknown value or failed request runs the old full Git check.
          if [ "$kind" = 'queue' ]; then
            response="$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/RELEASE_QUEUE.json?ref=${EVENT_HEAD}" 2>/dev/null)" || { decide true; exit 0; }
            blob="$(printf '%s' "$response" | jq -er '.sha | select(type=="string")' 2>/dev/null)" || { decide true; exit 0; }
            encoding="$(printf '%s' "$response" | jq -er '.encoding | select(type=="string")' 2>/dev/null)" || { decide true; exit 0; }
            if [[ ! "$blob" =~ ^[0-9a-f]{40}$ ]]; then
              decide true
              exit 0
            fi
            # GitHub Contents omits base64 bytes for 1–100 MiB files.
            # The real >2 MiB release queue therefore requires Git Blobs API.
            # Require the same exact immutable Git SHA before accepting bytes.
            if [ "$encoding" = 'none' ]; then
              response="$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" 2>/dev/null)" || { decide true; exit 0; }
              blob_back="$(printf '%s' "$response" | jq -er '.sha | select(type=="string")' 2>/dev/null)" || { decide true; exit 0; }
              if [ "$blob_back" != "$blob" ]; then
                decide true
                exit 0
              fi
              encoding="$(printf '%s' "$response" | jq -er '.encoding | select(type=="string")' 2>/dev/null)" || { decide true; exit 0; }
            fi
            if [ "$encoding" != 'base64' ]; then
              decide true
              exit 0
            fi
            queue_file="$(mktemp)"
            trap 'rm -f "$queue_file"' EXIT
            if ! printf '%s' "$response" | jq -er '.content | select(type=="string")' | base64 --decode > "$queue_file" 2>/dev/null; then
              decide true
              exit 0
            fi
            actual="$(git hash-object "$queue_file" 2>/dev/null)" || { decide true; exit 0; }
            if [ "$actual" != "$blob" ]; then
              decide true
              exit 0
            fi
            count="$(jq -er '
              if (.schema_version == 1)
                and (.authority == "OPS-AUTONOMOUS-BUILD-TEST-QUEUE-20261022")
                and ((.items | type) == "array")
                and (all(.items[]; (.state == "READY" or .state == "DEPLOYED" or .state == "TESTING" or .state == "IN_PROGRESS" or .state == "BLOCKED")))
              then ([.items[] | select(.state == "READY")] | length)
              else -1 end
            ' "$queue_file" 2>/dev/null)" || { decide true; exit 0; }
            if [ "$count" = '0' ]; then
              echo 'NOT_APPLICABLE: verified exact queue has zero READY entries'
              decide false
              exit 0
            fi
          fi
          decide true
      - uses: actions/checkout@v7
        if: steps.event_gate.outputs.proceed != 'false'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7.1.0
        if: steps.event_gate.outputs.proceed != 'false'
        with:
          node-version: '22'
      - name: Verify live development and source bound approved queue transition
        if: steps.event_gate.outputs.proceed != 'false'
        id: source
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          EVENT_HEAD: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin development/backend-foundation
          head_sha="$(git rev-parse refs/remotes/origin/development/backend-foundation)"
          if [ "$EVENT" = "workflow_run" ]; then
            if [ "$head_sha" != "$EVENT_HEAD" ]; then
              echo 'Source moved; newer run owns pre-certification'
              exit 0
            fi
            if ! git diff --name-only "$head_sha^" "$head_sha" -- docs/RELEASE_QUEUE.json | grep -Fxq 'docs/RELEASE_QUEUE.json'; then
              echo 'No READY queue update; no candidate CI needed'
              exit 0
            fi
          fi
          echo "development_sha=$head_sha" >> "$GITHUB_OUTPUT"
      - name: Reverify existing exact certified candidate with the actual publisher evidence gates (read only)
        if: steps.source.outputs.development_sha != '' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_BEFORE: ${{ github.event.before }}
          SOURCE_SHA: ${{ steps.source.outputs.development_sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" -- scripts/release/verified-prospective-qa.mjs scripts/release/ready-evidence-gate.mjs scripts/release/verify-certified-ready-evidence.mjs)"
          if [ -n "$changed" ]; then
            node scripts/release/verify-certified-ready-evidence.mjs "$SOURCE_SHA"
          else
            echo 'Exact frozen publisher evidence audit not requested by this source change'
          fi
      - name: Prove exact candidate Git tree and print source-bound read-only receipt
        if: steps.source.outputs.development_sha != ''
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
          SOURCE_SHA: ${{ steps.source.outputs.development_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p qa_artifacts/ready-source
          plan_path='docs/workstreams/issue-3889-prospective-input.json'
          prospective_arg=''
          audit_path='docs/workstreams/issue-3889-prospective-publisher-audit.json'
          if [ "$EVENT" = 'push' ] && [ "$(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" -- "$audit_path")" = "$audit_path" ]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            audit_stdout="$(node scripts/release/verify-certified-ready-evidence.mjs "$SOURCE_SHA" "$audit_path")"
            printf '%s\n' "$audit_stdout" | sed -n 's/^\[DIC nonpublishing publisher parity\] //p' > qa_artifacts/ready-source/receipt.json
            node -e "const r=JSON.parse(require('node:fs').readFileSync('qa_artifacts/ready-source/receipt.json','utf8')); if(r.status!=='READ_ONLY_PROSPECTIVE_PUBLISHER_EVIDENCE_SUCCESS'||r.count<1||!Array.isArray(r.verified_ids)||r.verified_ids.length!==r.count)process.exit(2)"
            exit 0
          fi
          # A new exact pinned input is consumed only on its main push, never
          # on schedules, unrelated pushes or workflow_run. No ref or queue write.
          if [ "$EVENT" = 'push' ]; then
            changed="$(git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" -- "$plan_path")"
            if [ "$changed" = "$plan_path" ]; then
              test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
              prospective_arg="$(node scripts/release/prospective-receipt-input.mjs "$plan_path" "$SOURCE_SHA")"
            fi
          fi
          if [ -n "$prospective_arg" ]; then
            receipt_stdout="$(node scripts/release/precertify-ready-source.mjs "$SOURCE_SHA" --receipt "$prospective_arg")"
          else
            receipt_stdout="$(node scripts/release/precertify-ready-source.mjs "$SOURCE_SHA" --receipt)"
            if printf '%s\n' "$receipt_stdout" | grep -Fq '"status":"NO_READY_ITEMS"'; then
              # #3889 preview: candidate ONLY, not a live queue transition.
              receipt_stdout="$(node scripts/release/precertify-ready-source.mjs "$SOURCE_SHA" --receipt --prospective=DIC-Q-509-stale-project-shot-comment-20261122)"
            fi
          fi
          printf '%s\n' "$receipt_stdout" |
            sed -n 's/^\[DIC READY pre-certification\] //p' > qa_artifacts/ready-source/receipt.json
          node -e "const r=JSON.parse(require('node:fs').readFileSync('qa_artifacts/ready-source/receipt.json','utf8')); if(!['NO_READY_ITEMS','LOCAL_TREE_RECEIPT_NO_REMOTE_CANDIDATE'].includes(r.status)) process.exit(2); if(r.status==='LOCAL_TREE_RECEIPT_NO_REMOTE_CANDIDATE' && (!/^[0-9a-f]{40}$/.test(r.development_source_sha) || !/^[0-9a-f]{40}$/.test(r.expected_tree_sha) || r.manifest?.candidate_branch!==r.candidate_branch)) process.exit(2)"
      - uses: actions/upload-artifact@v7
        if: steps.source.outputs.development_sha != ''
        with:
          name: dic-ready-source-receipt-${{ github.run_id }}
          path: qa_artifacts/ready-source/receipt.json
          if-no-files-found: error
          retention-days: 7

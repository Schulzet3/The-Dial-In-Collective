name: DIC Issue33 R330 original153 Nayarit current official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r330-original153.yml
      - scripts/audit/issue33-r330-original153-check.mjs
      - tests/coffee-issue33-r330-original153.test.mjs
      - docs/workstreams/ops-issue33-r330-original153-20261119.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r330-original153.yml
      - scripts/audit/issue33-r330-original153-check.mjs
      - tests/coffee-issue33-r330-original153.test.mjs
      - docs/workstreams/ops-issue33-r330-original153-20261119.md
permissions:
  contents: read
jobs:
  original153-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused selected product positive and hostile cases
        run: node --test tests/coffee-issue33-r330-original153.test.mjs
      - name: Bounded exact selected original official public HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '153'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r330
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict source H1 real raw HTML SHA parser Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r330
          DIC_R330_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R330_EVENT_SHA: ${{ github.sha }}
          DIC_R330_VERIFY: '1'
        run: node scripts/audit/issue33-r330-original153-check.mjs
      - name: Ephemeral bounded official selected evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r330-original153
          path: /tmp/dic33-r330/
          retention-days: 1
          if-no-files-found: warn

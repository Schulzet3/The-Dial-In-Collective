name: DIC Issue33 R134 selected original107 official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r134-107.yml
      - scripts/audit/issue33-r134-107-check.mjs
      - tests/coffee-issue33-r134-107.test.mjs
      - docs/workstreams/ops-issue33-r134-107-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r134-107.yml
      - scripts/audit/issue33-r134-107-check.mjs
      - tests/coffee-issue33-r134-107.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Ten selected current-source and hostile fixture regressions
        run: node --test tests/coffee-issue33-r134-107.test.mjs
      - name: Guarded bounded official selected HTTPS and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '107'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r134
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact source SHA, selected identity, direct facts and corpus integrity
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r134
          DIC_ISSUE33_R134_VERIFY: '1'
        run: node scripts/audit/issue33-r134-107-check.mjs
      - name: Retain official HTML, actual parser and strict afterproof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r134-107-current-evidence
          path: /tmp/dic33-r134/
          retention-days: 2
          if-no-files-found: warn

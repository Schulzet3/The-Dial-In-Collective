name: DIC Issue33 R260 exact original499 500 IXXA source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r260-original499-500.yml
      - scripts/audit/issue33-r260-499-500-check.mjs
      - tests/coffee-issue33-r260-499-500.test.mjs
      - docs/workstreams/ops-issue33-r260-499-500-ixxa-current-source-20261116.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r260-original499-500.yml
      - scripts/audit/issue33-r260-499-500-check.mjs
      - tests/coffee-issue33-r260-499-500.test.mjs
      - docs/workstreams/ops-issue33-r260-499-500-ixxa-current-source-20261116.md
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected-source positive and hostile parser regressions
        run: node --test tests/coffee-issue33-r260-499-500.test.mjs
      - name: Fresh guarded exact 499 500 official HTTPS parser Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '499,500'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r260
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent source identity and SHA afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r260
          DIC_R260_VERIFY: '1'
          DIC_R260_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R260_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r260-499-500-check.mjs
      - name: Expiring raw selected official bytes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r260-selected499-500
          path: /tmp/dic33-r260/
          retention-days: 1
          if-no-files-found: warn

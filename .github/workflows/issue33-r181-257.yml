name: DIC Issue33 R181 original257 Pinewood selected Costa Rica
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r181-257.yml
      - scripts/audit/issue33-r181-257-check.mjs
      - tests/coffee-issue33-r181-257.test.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-selected-description-sensory.mjs
      - src/server/coffee-product-scope.mjs
      - docs/workstreams/ops-issue33-r181-257-20261113.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r181-257.yml
      - scripts/audit/issue33-r181-257-check.mjs
      - tests/coffee-issue33-r181-257.test.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-selected-description-sensory.mjs
      - src/server/coffee-product-scope.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Exact current source and hostile selected identity regressions
        run: node --test tests/coffee-issue33-r181-257.test.mjs
      - name: Guarded raw official HTTPS and actual selected parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '257'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r181
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Afterproof bounded selected product and full evidence preservation
        if: always()
        env:
          DIC_ISSUE33_R181_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r181
        run: node scripts/audit/issue33-r181-257-check.mjs
      - name: Retain raw source HTML and evidence for manual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r181-original257
          path: /tmp/dic33-r181/
          retention-days: 2
          if-no-files-found: warn

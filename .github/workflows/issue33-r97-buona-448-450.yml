name: DIC Issue33 R97 original603 Buona 448-450 current selected
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r97-buona-448-450.yml
      - scripts/audit/issue33-r97-buona-448-450-check.mjs
      - tests/coffee-issue33-r97-buona-448-450.test.mjs
      - docs/workstreams/ops-issue33-r97-buona-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r97-buona-448-450.yml
      - scripts/audit/issue33-r97-buona-448-450-check.mjs
      - tests/coffee-issue33-r97-buona-448-450.test.mjs
permissions:
  contents: read
jobs:
  buona-current:
    name: original603-448-450-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected Buona current facts and hostile-source regressions
        run: node --test tests/coffee-issue33-r97-buona-448-450.test.mjs
      - name: Bounded guarded fresh official HTTPS and actual parser Add Coffee Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '448,449,450'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r97-buona
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict original CSV actual bytes H1 and selected product facts
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r97-buona
          DIC_ISSUE33_R97_VERIFY: '1'
        run: node scripts/audit/issue33-r97-buona-448-450-check.mjs
      - name: Raw selected source and guarded results one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r97-buona-448-450
          path: /tmp/dic33-r97-buona/
          retention-days: 1
          if-no-files-found: warn

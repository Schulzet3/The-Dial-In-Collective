name: DIC Issue33 R270 original526 selected Mystic Monk Cloister
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r270-original526-cloister.yml
      - tests/coffee-issue33-r270-original526-cloister.test.mjs
      - scripts/audit/issue33-r270-original526-cloister-check.mjs
      - docs/workstreams/ops-issue33-r270-original526-cloister-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r270-original526-cloister.yml
      - tests/coffee-issue33-r270-original526-cloister.test.mjs
      - scripts/audit/issue33-r270-original526-cloister-check.mjs
      - docs/workstreams/ops-issue33-r270-original526-cloister-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused identity, source and hostile tests
        run: node --test tests/coffee-issue33-r270-original526-cloister.test.mjs
      - name: Fresh selected official HTTPS with guarded parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '526'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r270
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently verify selected product raw bytes and actual parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r270
          DIC_R270_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R270_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r270-original526-cloister-check.mjs
      - name: Store one-day selected official source proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r270-original526-cloister
          path: /tmp/dic33-r270/
          retention-days: 1
          if-no-files-found: warn

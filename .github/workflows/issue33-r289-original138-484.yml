name: DIC Issue33 R289 selected original138 484
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r289-original138-484.yml
      - tests/coffee-issue33-r289-original138-484.test.mjs
      - scripts/audit/issue33-r289-original138-484-check.mjs
      - docs/workstreams/ops-issue33-r289-gnosis-fazenda-original138-484-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r289-original138-484.yml
      - tests/coffee-issue33-r289-original138-484.test.mjs
      - scripts/audit/issue33-r289-original138-484-check.mjs
      - docs/workstreams/ops-issue33-r289-gnosis-fazenda-original138-484-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused exact product and hostile assertions
        run: node --test tests/coffee-issue33-r289-original138-484.test.mjs
      - name: Fetch current exact official selected HTML with existing HTTPS guard
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '138,484'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r289
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify actual current parser, raw SHA, exact selected source and UI
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r289
          DIC_R289_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R289_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r289-original138-484-check.mjs
      - name: Retain independent selected official evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r289-original138-484
          path: /tmp/dic33-r289/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R61 independent selected 573 ZIP artifact proof
on:
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r61-independent-573-zip-proof.yml
permissions:
  contents: read
  actions: read
jobs:
  independent-source-byte-rehash:
    name: original603-573-independent-zip-sha256
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Independent artifact ZIP HTML and exact current selected source rehash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/dic33-r61-573.zip"
          curl --fail --silent --show-error --location --retry 2 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13672201930/zip" -o "$archive"
          test "$(stat -c '%s' "$archive")" = '256252'
          test "$(sha256sum "$archive" | cut -d ' ' -f1)" = '1db6b4ac03c34c09f3a4912db4a190c30bc603d6752cd84c6fb8a9d8770920b2'
          unzip -tqq "$archive"
          test "$(unzip -p "$archive" case-573.html | wc -c | tr -d ' ')" = '1523746'
          test "$(unzip -p "$archive" case-573.html | sha256sum | cut -d ' ' -f1)" = 'f7640802aa26d3a763c9d9501c50dfaa417a8b82666957755f678159cc3e10a2'
          evidence_sha="$(unzip -p "$archive" focused-current-evidence.json | sha256sum | cut -d ' ' -f1)"
          test "$evidence_sha" = 'de3dd3979f8d4843514dde6622f418945904e2d15ba940b2753cd27c7a365e60'
          unzip -p "$archive" focused-current-evidence.json | jq -e \
            '.source_sha=="f590b9693fcb3be22cd240bef124901347cf5f2a" and
             .manual_certified==0 and .production_operations==0 and .real_auth==false and
             .original_corpus_modified==false and .case_numbers==[573] and (.records|length)==1 and
             .records[0].number==573 and .records[0].status=="FETCHED" and
             .records[0].parser_ok==true and .records[0].selected_heading_identity_verified==true and
             .records[0].selected_h1==["Ethiopia Wate Gogogu"] and
             .records[0].current_fields.name=="Ethiopia Wate Gogogu" and
             .records[0].current_fields.origin=="Guji, Ethiopia" and
             .records[0].current_fields.process=="Washed" and
             .records[0].current_fields.producer=="Negusse Debla" and
             (.records[0].conflicts|length)==0 and
             .records[0].add_coffee_ui_rendered==true and
             .records[0].source_review_rendered==true and
             .records[0].html_sha256=="f7640802aa26d3a763c9d9501c50dfaa417a8b82666957755f678159cc3e10a2"' >/dev/null
          unzip -p "$archive" r61-573-selected-guji-afterproof.json | jq -e \
            --arg evidence "$evidence_sha" \
            '.source_sha=="f590b9693fcb3be22cd240bef124901347cf5f2a" and
             .evidence_sha256==$evidence and .passed==true and .failures==[] and
             .manual_certified==0 and .production_operations==0 and
             .observed.direct_current_evidence.directCurrentSelectedGuji==true and
             .observed.direct_current_evidence.priorLotMention==true and
             .observed.raw_html_verified==true and
             .observed.current_fields.origin=="Guji, Ethiopia" and
             .observed.source_review==true and .observed.add_coffee==true' >/dev/null
          echo 'VERIFIED selected #573 artifact 13672201930 raw ZIP 256252 bytes SHA256 1db6b4ac03c34c09f3a4912db4a190c30bc603d6752cd84c6fb8a9d8770920b2'
          echo 'VERIFIED selected #573 raw HTML 1523746 bytes SHA256 f7640802aa26d3a763c9d9501c50dfaa417a8b82666957755f678159cc3e10a2'
          echo 'VERIFIED exact merged current source f590b9693fcb3be22cd240bef124901347cf5f2a, canonical Guji and UI review'

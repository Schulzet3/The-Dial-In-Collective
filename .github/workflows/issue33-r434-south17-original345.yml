name: DIC Issue33 R434 original345 South17 exact selected current official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r434-south17-original345.yml'
      - 'scripts/audit/issue33-r434-south17-selected-check.mjs'
      - 'tests/issue33-r434-south17-selected.test.mjs'
      - 'scripts/audit/issue33-original603-focused-source-review.mjs'
      - 'src/server/coffee-page-metadata.mjs'
      - 'src/server/coffee-product-scope.mjs'
      - 'site/cloud/coffee-url-autofill.js'
  push:
    branches: [development/backend-foundation]
    paths:
      - '.github/workflows/issue33-r434-south17-original345.yml'
      - 'scripts/audit/issue33-r434-south17-selected-check.mjs'
      - 'tests/issue33-r434-south17-selected.test.mjs'
      - 'scripts/audit/issue33-original603-focused-source-review.mjs'
      - 'src/server/coffee-page-metadata.mjs'
      - 'src/server/coffee-product-scope.mjs'
      - 'site/cloud/coffee-url-autofill.js'
permissions:
  contents: read
jobs:
  south17-current-345:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Exact source and scoped 345 positive/adversarial tests
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$DIC_EXPECTED_SHA"
          node --check scripts/audit/issue33-r434-south17-selected-check.mjs
          node --test tests/issue33-r434-south17-selected.test.mjs
      - name: Hard guarded official HTTPS/H1/current parser/unsaved Add Coffee #345
        env:
          DIC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '345'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r434
        run: GITHUB_SHA="$DIC_SOURCE_SHA" node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Raw HTML sha256 independent current parser/selected-source afterproof
        if: always()
        env:
          DIC_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_ISSUE33_R434_RUN: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r434
        run: node scripts/audit/issue33-r434-south17-selected-check.mjs
      - name: One day exact source bound evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r434-original345-official
          path: /tmp/dic33-r434/
          retention-days: 1
          if-no-files-found: warn

name: DIC cloud UX regression checks

on:
  push:
    branches:
      - development/backend-foundation
      - 'release-candidates/**'
      - work/setup-feed-history-recovery-20261014
    paths:
      - '.github/workflows/cloud-beta-ci.yml'
      - 'docs/RELEASE_CANDIDATE.json'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'scripts/pwa/**'
      - 'build_cloud.mjs'
      - 'netlify.toml'
      - 'scripts/netlify/**'
      - 'docs/NETLIFY_CREDIT_LEDGER.json'
      - 'site/**'
      - 'src/server/**'
      - 'netlify/functions/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/audit/**'
      - 'tests/**'
      - '.github/workflows/cloud-regression.yml'
  pull_request:
    branches:
      - development/backend-foundation
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**/*.md'
      - 'docs/RELEASE_QUEUE.json'
      - 'docs/DECISION_LEDGER.json'
      - 'docs/APPROVAL_COVERAGE_MATRIX.json'
      - 'docs/audits/issue267-review-restart-v2-20261101.json'
      - 'docs/audits/issue267-v2-strict-coverage-ledger-20261103.json'
      - 'docs/audits/issue267-v2-strict-batches/S2-*.json'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: dic-cloud-regression-${{ github.ref }}
  cancel-in-progress: true


jobs:
  cloud-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify cloud/offline changes
        id: scope
        env:
          DIC_CI_EVENT: ${{ github.event_name }}
          DIC_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIC_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_CI_REF: ${{ github.ref }}
        run: node scripts/audit/ci-scope.mjs
      - name: Fast source/queue/commit preflight BEFORE expensive CI
        env:
          DIC_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          DIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/audit/fast-pr-check.mjs
          node scripts/release/release-queue.mjs --enforce-intake
          node scripts/audit/verify-commit-checkpoint.mjs
      - name: Explicit targeted cloud NOT_APPLICABLE
        if: steps.scope.outputs.cloud_mode == 'none'
        run: |
          echo 'NOT_APPLICABLE: targeted cloud unit tests not needed; high-risk full Node corpus is partitioned between validate and cloud-tests.'
      - uses: actions/setup-node@v7.1.0
        if: steps.scope.outputs.cloud_mode == 'targeted' || steps.scope.outputs.node_mode == 'full'
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install cloud test dependencies once
        if: steps.scope.outputs.cloud_mode == 'targeted' || steps.scope.outputs.node_mode == 'full'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run affected cloud/offline/Admin/coffee UI tests
        if: steps.scope.outputs.cloud_mode == 'targeted'
        run: node --test tests/cloud*.test.mjs tests/admin-*.test.mjs tests/offline-*.test.mjs tests/pwa-shell.test.mjs tests/coffee-duplicate-first-client.test.mjs tests/coffee-source-status-ui.test.mjs tests/recipe-family-selection.test.mjs tests/shot-temperature-preservation.test.mjs
      - name: Run second half of high-risk full Node corpus (same source, disjoint files)
        if: steps.scope.outputs.node_mode == 'full'
        run: node scripts/audit/run-full-suite.mjs --shard=1/2
      - name: Lint HIGH-risk source on cloud-tests runner (one lint total)
        if: steps.scope.outputs.node_mode == 'full' && steps.scope.outputs.lint == 'true'
        run: npm run lint
  mobile-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify browser, visual and single-build impact
        id: scope
        env:
          DIC_CI_EVENT: ${{ github.event_name }}
          DIC_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIC_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_CI_REF: ${{ github.ref }}
        run: node scripts/audit/ci-scope.mjs
      - name: Fast source/queue/commit preflight BEFORE expensive CI
        env:
          DIC_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          DIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_EVENT_NAME: ${{ github.event_name }}
        run: |
          node scripts/audit/fast-pr-check.mjs
          node scripts/release/release-queue.mjs --enforce-intake
          node scripts/audit/verify-commit-checkpoint.mjs
      - name: Explicit browser NOT_APPLICABLE
        if: steps.scope.outputs.browser_mode == 'none'
        run: |
          echo 'NOT_APPLICABLE: no UI, Auth or browser risk.'
      - uses: actions/setup-node@v7.1.0
        if: steps.scope.outputs.build_browser == 'true'
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies for browser-owned build
        if: steps.scope.outputs.build_browser == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build shipped application ONCE for UI, visual or Auth
        if: steps.scope.outputs.build_browser == 'true'
        env:
          SUPABASE_URL: https://azviqqejypsefzilgonr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_browser_nonfunctional
        run: npm run build:cloud
      - name: Verify shipped file graph and transitive imports
        if: steps.scope.outputs.build_browser == 'true'
        run: node scripts/audit/site-integrity.mjs --dist
      - uses: actions/setup-python@v6
        if: steps.scope.outputs.browser_mode != 'none'
        with:
          python-version: '3.12'
      - name: Install one isolated Chromium browser for all relevant acceptance
        if: steps.scope.outputs.browser_mode != 'none'
        run: |
          python -m pip install playwright==1.55.0
          if ! python -m playwright install --with-deps --only-shell chromium; then
            # Retry only the runner's Ubuntu package mirror; never bypass
            # Playwright's dependency installation or browser acceptance.
            mirror_file=/etc/apt/sources.list.d/ubuntu.sources
            if ! grep -q 'azure.archive.ubuntu.com' "$mirror_file"; then
              echo 'Browser dependency install failed; Azure mirror recovery unavailable.' >&2
              exit 1
            fi
            sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' "$mirror_file"
            sudo apt-get update -o Acquire::Retries=2
            python -m playwright install --with-deps --only-shell chromium
          fi
      - name: Run all browser acceptances with parallel visual assertions
        if: steps.scope.outputs.browser_mode != 'none'
        env:
          DIC_BROWSER_MODE: ${{ steps.scope.outputs.browser_mode }}
          # PNG-only screenshots cost seconds but are not automatically compared.
          # workflow_dispatch retains on-demand screenshot artifacts; all actual
          # DOM, geometry, Auth, offline and workflow checks still run on every
          # applicable PR/push with each subprocess exit checked.
          DIC_CAPTURE_VISUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/audit/run-browser-qa.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dic-risk-browser-${{ github.run_id }}
          path: qa_artifacts/
          retention-days: 7
          if-no-files-found: ignore

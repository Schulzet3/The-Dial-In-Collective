name: DIC cloud UX regression checks

on:
  push:
    branches:
      - development/backend-foundation
      - work/setup-feed-history-recovery-20261014
    paths:
      - 'site/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'build_cloud.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloud-regression.yml'
  pull_request:
    branches:
      - development/backend-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Full Node suite and build are asserted by DIC cloud app build and tests
      # on the SAME SHA. This job independently checks cloud module syntax;
      # the required release controller still rejects any failed full-suite check.
      - name: Syntax check
        run: node --check site/cloud/main.js && node --check site/cloud/shot_card.js && node --check site/admin/main.js && node --check site/cloud/coffee-match-ui.js

  mobile-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cache pinned Chromium browser downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: dic-chromium-${{ runner.os }}-playwright-1.55.0-v1
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise 390px phone UX with synthetic accounts
        run: python tests/browser/cloud_owner_qa.py
      - name: Exercise owner-only admin invitations and member access in 390px Chromium
        run: python tests/browser/admin_invitation_qa.py
      - name: Retain synthetic phone screenshots for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic-cloud-phone-qa-${{ github.run_id }}
          path: qa_artifacts/cloud/
          if-no-files-found: warn
          retention-days: 7

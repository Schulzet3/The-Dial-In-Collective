name: DIC cloud UX regression checks

on:
  push:
    branches:
      - development/backend-foundation
      - 'release-candidates/**'
      - work/setup-feed-history-recovery-20261014
    paths:
      - 'site/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'scripts/pwa/**'
      - 'build_cloud.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloud-regression.yml'
      - 'docs/RELEASE_CANDIDATE.json'
  pull_request:
    branches:
      - development/backend-foundation
  workflow_dispatch:

permissions:
  contents: read


jobs:
  cloud-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify cloud/offline changes
        id: scope
        env:
          DIC_CI_EVENT: ${{ github.event_name }}
          DIC_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIC_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_CI_REF: ${{ github.ref }}
        run: node scripts/audit/ci-scope.mjs
      - name: Explicit targeted cloud NOT_APPLICABLE
        if: steps.scope.outputs.cloud_mode == 'none'
        run: echo 'NOT_APPLICABLE: cloud-specific tests not needed; high-risk full Node is in validate.'
      - uses: actions/setup-node@v7.1.0
        if: steps.scope.outputs.cloud_mode == 'targeted'
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install cloud test dependencies once
        if: steps.scope.outputs.cloud_mode == 'targeted'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run affected cloud/offline/Admin/coffee UI tests
        if: steps.scope.outputs.cloud_mode == 'targeted'
        run: node --test tests/cloud*.test.mjs tests/admin-*.test.mjs tests/offline-*.test.mjs tests/pwa-shell.test.mjs tests/coffee-duplicate-first-client.test.mjs tests/coffee-source-status-ui.test.mjs tests/recipe-family-selection.test.mjs tests/shot-temperature-preservation.test.mjs
  mobile-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify browser, visual and single-build impact
        id: scope
        env:
          DIC_CI_EVENT: ${{ github.event_name }}
          DIC_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIC_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_CI_REF: ${{ github.ref }}
        run: node scripts/audit/ci-scope.mjs
      - name: Explicit browser NOT_APPLICABLE
        if: steps.scope.outputs.browser_mode == 'none'
        run: echo 'NOT_APPLICABLE: no UI, Auth or browser risk.'
      - uses: actions/setup-node@v7.1.0
        if: steps.scope.outputs.build_browser == 'true'
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies for browser-owned build
        if: steps.scope.outputs.build_browser == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build shipped application ONCE for UI, visual or Auth
        if: steps.scope.outputs.build_browser == 'true'
        env:
          SUPABASE_URL: https://azviqqejypsefzilgonr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_browser_nonfunctional
        run: npm run build:cloud
      - name: Verify shipped file graph and transitive imports
        if: steps.scope.outputs.build_browser == 'true'
        run: node scripts/audit/site-integrity.mjs --dist
      - uses: actions/setup-python@v6
        if: steps.scope.outputs.browser_mode != 'none'
        with:
          python-version: '3.12'
      - name: Install one isolated Chromium browser for all relevant acceptance
        if: steps.scope.outputs.browser_mode != 'none'
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test actual compiled app assets in browser
        if: steps.scope.outputs.browser_mode != 'none'
        run: python tests/browser/built_app_qa.py
      - name: Focused visual/contrast and responsive regression
        if: steps.scope.outputs.browser_mode != 'none'
        run: python tests/browser/visual_review.py
      - name: Run 390px Log Shot -> Rate -> Recommendation and New Setup
        if: steps.scope.outputs.browser_mode == 'ui' || steps.scope.outputs.browser_mode == 'high'
        run: python tests/browser/cloud_owner_qa.py
      - name: Test owner-only invitation browser permissions
        if: steps.scope.outputs.browser_mode == 'high'
        run: python tests/browser/admin_invitation_qa.py
      - name: Test real service-worker cached offline reopening
        if: steps.scope.outputs.browser_mode == 'ui' || steps.scope.outputs.browser_mode == 'high'
        run: python tests/browser/pwa_offline_qa.py
      - name: High-risk accessibility and admin records browser acceptance
        if: steps.scope.outputs.browser_mode == 'high'
        run: |
          python tests/browser/issue26_accessibility_qa.py
          python tests/browser/admin_records_qa.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dic-risk-browser-${{ github.run_id }}
          path: qa_artifacts/
          retention-days: 7
          if-no-files-found: ignore

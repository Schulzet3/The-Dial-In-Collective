name: DIC Issue33 R98 original603 Gallop 464 and Encanto 466
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r98-gallop-encanto.yml
      - scripts/audit/issue33-r98-gallop-encanto-check.mjs
      - tests/coffee-issue33-r98-gallop-encanto.test.mjs
      - docs/workstreams/ops-issue33-r98-464-466-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r98-gallop-encanto.yml
      - scripts/audit/issue33-r98-gallop-encanto-check.mjs
      - tests/coffee-issue33-r98-gallop-encanto.test.mjs
permissions:
  contents: read
jobs:
  chosen-current:
    name: original603-464-466-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused own-selected and hostile-context regressions
        run: node --test tests/coffee-issue33-r98-gallop-encanto.test.mjs
      - name: Guarded current official HTTPS, parser and explicit Add Coffee Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '464,466'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r98
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict current identities direct facts original CSV hash and captured HTML
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r98
          DIC_ISSUE33_R98_VERIFY: '1'
        run: node scripts/audit/issue33-r98-gallop-encanto-check.mjs
      - name: Raw source/proof evidence one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r98-gallop-encanto
          path: /tmp/dic33-r98/
          retention-days: 1
          if-no-files-found: warn

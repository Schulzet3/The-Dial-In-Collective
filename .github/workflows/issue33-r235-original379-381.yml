name: DIC Issue33 R235 original379-381 current Thrive selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r235-original379-381.yml
      - tests/coffee-issue33-r235-original379-381.test.mjs
      - scripts/audit/issue33-r235-original379-381-check.mjs
      - docs/workstreams/ops-issue33-r235-379-381-thrive-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-focused-source-acceptance.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r235-original379-381.yml
      - tests/coffee-issue33-r235-original379-381.test.mjs
      - scripts/audit/issue33-r235-original379-381-check.mjs
      - docs/workstreams/ops-issue33-r235-379-381-thrive-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-focused-source-acceptance.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected source positive and hostile contracts
        run: node --test tests/coffee-issue33-r235-original379-381.test.mjs
      - name: Bounded original current official HTTPS and Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '379,380,381'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r235
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify raw bytes and selected current semantic fields
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r235
          DIC_R235_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r235-original379-381-check.mjs
      - name: Save one-day bounded source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r235-original379-381
          path: /tmp/dic33-r235/
          retention-days: 1
          if-no-files-found: warn

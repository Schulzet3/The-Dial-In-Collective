name: DIC Issue33 R109 original selected 554 555
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r109-554-555.yml
      - scripts/audit/issue33-r109-554-555-check.mjs
      - tests/coffee-issue33-r109-554-555.test.mjs
      - docs/workstreams/ops-issue33-r109-554-555-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r109-554-555.yml
      - scripts/audit/issue33-r109-554-555-check.mjs
      - tests/coffee-issue33-r109-554-555.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused exact selected synthetic positive and negative parser
        run: node --test tests/coffee-issue33-r109-554-555.test.mjs
      - name: Guarded real official HTTPS chosen products and actual Add Coffee / Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '554,555'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r109
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Assert exact source identity, published facts and parser fields
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r109
          DIC_ISSUE33_R109_VERIFY: '1'
        run: node scripts/audit/issue33-r109-554-555-check.mjs
      - name: Preserve bounded public-only source artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r109-554-555
          path: /tmp/dic33-r109/
          retention-days: 1
          if-no-files-found: warn

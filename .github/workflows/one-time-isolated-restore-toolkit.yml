name: DIC one-time isolated restore toolkit

# Public tools only. No database connections, application data, keys or secrets.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-isolated-restore-toolkit.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Package offline PostgreSQL 17 and age tools without production data
        run: |
          set -euo pipefail
          docker pull postgres:17.11-bookworm
          docker run -d --name dic-pg17-toolkit --entrypoint sleep postgres:17.11-bookworm infinity
          docker exec --user root dic-pg17-toolkit bash -euc 'apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq age; /usr/lib/postgresql/17/bin/postgres --version; age --version'
          docker export dic-pg17-toolkit | gzip -1 > "${RUNNER_TEMP}/dic-pg17-offline-rootfs.tar.gz"
          test -s "${RUNNER_TEMP}/dic-pg17-offline-rootfs.tar.gz"
          sha256sum "${RUNNER_TEMP}/dic-pg17-offline-rootfs.tar.gz"
          echo "Public PostgreSQL/age binaries only. No database, auth data, or keys accessed."
      - uses: actions/upload-artifact@v7
        with:
          name: dic-offline-restore-toolkit
          path: ${{ runner.temp }}/dic-pg17-offline-rootfs.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

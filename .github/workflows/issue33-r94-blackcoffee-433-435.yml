name: DIC Issue33 R94 original603 Black Coffee 433-435 current selected
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r94-blackcoffee-433-435.yml
      - scripts/audit/issue33-r94-blackcoffee-433-435-check.mjs
      - tests/coffee-issue33-r94-blackcoffee-433-435.test.mjs
      - docs/workstreams/ops-issue33-r94-blackcoffee-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r94-blackcoffee-433-435.yml
      - scripts/audit/issue33-r94-blackcoffee-433-435-check.mjs
      - tests/coffee-issue33-r94-blackcoffee-433-435.test.mjs
permissions:
  contents: read
jobs:
  blackcoffee-current:
    name: original603-433-435-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected source and adversarial focused regressions
        run: node --test tests/coffee-issue33-r94-blackcoffee-433-435.test.mjs
      - name: Fresh guarded public HTTPS and actual parser, Add Coffee, Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '433,434,435'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r94-blackcoffee
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict current selected source and no invented facts
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r94-blackcoffee
          DIC_ISSUE33_R94_VERIFY: '1'
        run: node scripts/audit/issue33-r94-blackcoffee-433-435-check.mjs
      - name: Short-lived bounded raw source and afterproof artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r94-blackcoffee-433-435
          path: /tmp/dic33-r94-blackcoffee/
          retention-days: 1
          if-no-files-found: warn

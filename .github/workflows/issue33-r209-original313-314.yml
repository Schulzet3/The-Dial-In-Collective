name: DIC Issue33 R209 original313 314 selected current ink
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r209-original313-314.yml
      - scripts/audit/issue33-r209-original313-314-check.mjs
      - tests/coffee-issue33-r209-original313-314.test.mjs
      - docs/workstreams/ops-issue33-r209-313-314-20261114.md
      - src/server/coffee-page-metadata.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r209-original313-314.yml
      - scripts/audit/issue33-r209-original313-314-check.mjs
      - tests/coffee-issue33-r209-original313-314.test.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected roast altitude and trade-secret positive and hostile assertions
        run: node --test tests/coffee-issue33-r209-original313-314.test.mjs
      - name: Bounded original selected official HTTPS #313/#314
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '313,314'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r209
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact raw-H1 source and negative parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r209
          DIC_R209_EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r209-original313-314-check.mjs
      - name: Retain original selected HTML and source evidence (1 day)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r209-original313-314
          path: /tmp/dic33-r209/
          retention-days: 1
          if-no-files-found: warn

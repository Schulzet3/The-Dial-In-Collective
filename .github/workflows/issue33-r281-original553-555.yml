name: DIC Issue33 R281 selected original553 555
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r281-original553-555.yml
      - tests/coffee-issue33-r281-original553-555.test.mjs
      - scripts/audit/issue33-r281-original553-555-check.mjs
      - docs/workstreams/ops-issue33-r281-roc2-original553-555-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r281-original553-555.yml
      - tests/coffee-issue33-r281-original553-555.test.mjs
      - scripts/audit/issue33-r281-original553-555-check.mjs
      - docs/workstreams/ops-issue33-r281-roc2-original553-555-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused positive and adverse tests
        run: node --test tests/coffee-issue33-r281-original553-555.test.mjs
      - name: Bounded SSRF-guarded exact selected official HTTPS and actual parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '553,555'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r281
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently hash current HTML and check Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r281
          DIC_R281_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R281_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r281-original553-555-check.mjs
      - name: Preserve nonsecret bounded source proof one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r281-original553-555
          path: /tmp/dic33-r281/
          retention-days: 1
          if-no-files-found: warn

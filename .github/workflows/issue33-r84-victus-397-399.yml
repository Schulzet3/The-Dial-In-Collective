name: DIC Issue33 R84 original603 397-399 Victus selected source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r84-victus-397-399.yml
      - scripts/audit/issue33-r84-victus-397-399-check.mjs
      - tests/coffee-issue33-r84-victus-contract.test.mjs
      - docs/workstreams/ops-issue33-r84-victus-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r84-victus-397-399.yml
      - scripts/audit/issue33-r84-victus-397-399-check.mjs
      - tests/coffee-issue33-r84-victus-contract.test.mjs
permissions:
  contents: read
jobs:
  selected-victus-three:
    name: original603-397-399-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Source-specific positive and adversarial contracts
        run: node --test tests/coffee-issue33-r84-victus-contract.test.mjs
      - name: Fresh bounded guarded exact selected HTTPS, parser and Add Coffee
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '397,398,399'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r84-victus
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict exact selected-current afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r84-victus
          DIC_ISSUE33_R84_VERIFY: '1'
        run: node scripts/audit/issue33-r84-victus-397-399-check.mjs
      - name: Short-lived source and raw hash evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r84-victus-397-399
          path: /tmp/dic33-r84-victus/
          retention-days: 1
          if-no-files-found: warn

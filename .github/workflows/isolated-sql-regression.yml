name: DIC isolated SQL release regression
on:
  push:
    branches: [work/visual-refresh-20261015, development/backend-foundation]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'tests/sql/**'
      - 'tests/qa/signed-http-acceptance.mjs'
      - 'tests/qa/issue27-invitation-acceptance.mjs'
      - 'scripts/audit/isolated-sql-regression.sh'
      - 'scripts/audit/isolated-signed-http-regression.sh'
      - 'scripts/audit/isolated-backup-snapshot-regression.sh'
      - 'scripts/backups/**'
      - 'tests/backups/**'
      - 'scripts/audit/verify-migration-baseline.mjs'
      - 'docs/SUPABASE_PRODUCTION_MIGRATION_BASELINE_2026-10-18.json'
      - '.github/workflows/isolated-sql-regression.yml'
  pull_request:
    branches: [development/backend-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify documentation-only change (unknown means full CI)
        id: scope
        env:
          DIC_CI_EVENT: ${{ github.event_name }}
          DIC_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIC_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/ci-scope.mjs
      - name: Explain optimized no-op CI
        if: steps.scope.outputs.docs_only == 'true'
        run: echo 'Documentation-only change; expensive suite not applicable; exact-source release guard remains in place.'
      - name: Verify all production-applied migration filenames and exact SQL byte hashes
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/audit/verify-migration-baseline.mjs
      - name: Apply and exercise schema in network-isolated PostgreSQL 17.11
        if: steps.scope.outputs.docs_only != 'true'
        run: bash scripts/audit/isolated-sql-regression.sh
      - name: Verify actual signed bearer JWT authorization, held-shot ownership and correction against disposable PostgREST
        if: steps.scope.outputs.docs_only != 'true'
        run: bash scripts/audit/isolated-signed-http-regression.sh
      - name: Verify recovery snapshot consistency under concurrent writes and fail-closed errors
        if: steps.scope.outputs.docs_only != 'true'
        run: bash scripts/audit/isolated-backup-snapshot-regression.sh

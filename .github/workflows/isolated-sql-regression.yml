name: DIC isolated SQL release regression
on:
  push:
    branches: [work/visual-refresh-20261015, development/backend-foundation, 'release-candidates/**']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'tests/sql/**'
      - 'tests/qa/signed-http-acceptance.mjs'
      - 'tests/qa/issue27-invitation-acceptance.mjs'
      - 'scripts/audit/isolated-sql-regression.sh'
      - 'scripts/audit/isolated-signed-http-regression.sh'
      - 'scripts/audit/isolated-backup-snapshot-regression.sh'
      - 'scripts/backups/**'
      - 'tests/backups/**'
      - 'scripts/audit/verify-migration-baseline.mjs'
      - 'docs/SUPABASE_PRODUCTION_MIGRATION_BASELINE_2026-10-18.json'
      - '.github/workflows/isolated-sql-regression.yml'
      - 'docs/RELEASE_CANDIDATE.json'
  pull_request:
    branches: [development/backend-foundation]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify SQL/Auth/unknown high-risk source
        id: scope
        env:
          DIC_CI_EVENT: ${{ github.event_name }}
          DIC_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIC_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_CI_REF: ${{ github.ref }}
        run: node scripts/audit/ci-scope.mjs
      - name: Explicit SQL NOT_APPLICABLE, not a database PASS
        if: steps.scope.outputs.sql == 'false'
        run: |
          echo 'NOT_APPLICABLE: no SQL/Auth/database scope.'
      - name: Verify applied SQL filename and byte hashes
        if: steps.scope.outputs.sql == 'true'
        run: node scripts/audit/verify-migration-baseline.mjs
      - name: Apply isolated PostgreSQL schema and permissions
        if: steps.scope.outputs.sql == 'true'
        run: bash scripts/audit/isolated-sql-regression.sh
      - name: Verify signed JWT and per-user HTTP ownership
        if: steps.scope.outputs.sql == 'true'
        run: bash scripts/audit/isolated-signed-http-regression.sh
      - name: Verify backup snapshot concurrency and errors
        if: steps.scope.outputs.sql == 'true'
        run: bash scripts/audit/isolated-backup-snapshot-regression.sh

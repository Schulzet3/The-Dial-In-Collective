name: DIC Issue33 R160 original200 selected Hacienda La Amistad audit
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r160-200.yml
      - scripts/audit/issue33-r160-200-check.mjs
      - tests/coffee-issue33-r160-200.test.mjs
      - docs/workstreams/ops-issue33-r160-200-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r160-200.yml
      - scripts/audit/issue33-r160-200-check.mjs
      - tests/coffee-issue33-r160-200.test.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Chosen #200 source-shaped positive and hostile tests
        run: node --test tests/coffee-issue33-r160-200.test.mjs
      - name: Bounded guarded exact official HTTPS and actual current parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '200'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r160
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict source and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_R160_VERIFY: '1'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r160
        run: node scripts/audit/issue33-r160-200-check.mjs
      - name: Preserve actual source HTML and afterproof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r160-selected-200
          path: /tmp/dic33-r160/
          retention-days: 2
          if-no-files-found: warn

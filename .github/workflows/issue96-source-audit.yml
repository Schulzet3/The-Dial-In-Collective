name: DIC authorized provider security checks
on:
  push:
    branches: [work/issue96-security-audit-20261023]
    paths: [.github/workflows/issue96-source-audit.yml, scripts/audit/provider-security-probes.py]
permissions:
  contents: read
jobs:
  nonmutating-provider-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/audit/provider-security-probes.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dic-provider-security-${{ github.run_id }}
          path: qa_artifacts/security/
          if-no-files-found: warn
          retention-days: 7

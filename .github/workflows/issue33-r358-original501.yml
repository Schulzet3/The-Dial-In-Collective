name: DIC Issue33 R358 original501 selected IXXA no-inferred-roast
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r358-original501.yml
      - scripts/audit/issue33-r358-original501-check.mjs
      - tests/coffee-issue33-r358-original501.test.mjs
      - docs/workstreams/ops-issue33-r358-original501-20261120.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r358-original501.yml
      - scripts/audit/issue33-r358-original501-check.mjs
      - tests/coffee-issue33-r358-original501.test.mjs
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Original501 selected identity and hostile provenance regressions
        run: node --test tests/coffee-issue33-r358-original501.test.mjs
      - name: One current official original501 guarded HTTPS request
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '501'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r358
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected source HTML SHA parser and no-save afterproof
        if: always()
        env:
          DIC_R358_VERIFY: '1'
          DIC_R358_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R358_EVENT_SHA: ${{ github.sha }}
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r358
        run: node scripts/audit/issue33-r358-original501-check.mjs
      - name: Retain public selected HTML and afterproof one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r358-original501
          path: /tmp/dic33-r358/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R286 selected original92
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r286-original092.yml
      - tests/coffee-issue33-r286-original092.test.mjs
      - scripts/audit/issue33-r286-original092-check.mjs
      - docs/workstreams/ops-issue33-r286-original092-20261117.md
      - src/server/coffee-selected-flavored-taxonomy.mjs
      - src/server/coffee-page-metadata.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r286-original092.yml
      - tests/coffee-issue33-r286-original092.test.mjs
      - scripts/audit/issue33-r286-original092-check.mjs
      - docs/workstreams/ops-issue33-r286-original092-20261117.md
      - src/server/coffee-selected-flavored-taxonomy.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused literal flavored and adversarial tests
        run: node --test tests/coffee-issue33-r286-original092.test.mjs
      - name: Guarded exact original public HTTPS and parser
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '92'
          DIC_ISSUE33_FOCUSED_PUBLIC_CURRENT_ALTERNATE_URL: 'https://darkcanyon-coffee.com/collections/flavored-coffees/products/highlander-grogg'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r286
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Byte-hash, current selected H1 and explicit preview afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r286
          DIC_R286_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R286_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r286-original092-check.mjs
      - name: Retain nonsecret public source proof for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r286-original092
          path: /tmp/dic33-r286/
          retention-days: 1
          if-no-files-found: warn

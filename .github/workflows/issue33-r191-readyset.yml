name: DIC Issue33 R191 selected Ready Set original275-276
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r191-readyset.yml
      - scripts/audit/issue33-r191-275-276-check.mjs
      - tests/coffee-issue33-r191-275-276.test.mjs
      - docs/workstreams/ops-issue33-r191-275-276-20261114.md
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-narrative-evidence.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r191-readyset.yml
      - scripts/audit/issue33-r191-275-276-check.mjs
      - tests/coffee-issue33-r191-275-276.test.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-narrative-evidence.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Exact selected positive and adversarial real parser regressions
        run: node --test tests/coffee-issue33-r191-275-276.test.mjs
      - name: Guarded original selected official HTTPS and parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '275,276'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r191
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent exact selected raw HTML and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r191
        run: node scripts/audit/issue33-r191-275-276-check.mjs
      - name: Temporarily preserve official source-bound evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r191-current275-276
          path: /tmp/dic33-r191/
          retention-days: 1
          if-no-files-found: warn

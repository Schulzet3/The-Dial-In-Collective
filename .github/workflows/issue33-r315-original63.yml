name: DIC Issue33 R315 original603 Organic Sumatra exact source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r315-original63.test.mjs
      - scripts/audit/issue33-r315-original63-check.mjs
      - .github/workflows/issue33-r315-original63.yml
      - docs/workstreams/ops-issue33-r315-original63-20261118.md
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r315-original63.test.mjs
      - scripts/audit/issue33-r315-original63-check.mjs
      - .github/workflows/issue33-r315-original63.yml
      - docs/workstreams/ops-issue33-r315-original63-20261118.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Five focused positive and adversarial parser tests
        run: node --test tests/coffee-issue33-r315-original63.test.mjs
      - name: One original selected product guarded public HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '63'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r315
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Original current exact selected H1 raw SHA parser Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r315
          DIC_R315_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R315_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r315-original63-check.mjs
      - name: One day public only exact seller evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r315-original63
          path: /tmp/dic33-r315/
          retention-days: 1
          if-no-files-found: warn

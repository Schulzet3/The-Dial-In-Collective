name: DIC Issue33 R339 original250 current Orleans selected source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r339-original250.yml
      - scripts/audit/issue33-r339-original250-check.mjs
      - tests/coffee-issue33-r339-original250.test.mjs
      - docs/workstreams/ops-issue33-r339-original250-20261119.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r339-original250.yml
      - scripts/audit/issue33-r339-original250-check.mjs
      - tests/coffee-issue33-r339-original250.test.mjs
      - docs/workstreams/ops-issue33-r339-original250-20261119.md
permissions:
  contents: read
jobs:
  original250-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused literal positive and adversarial selected-product tests
        run: node --test tests/coffee-issue33-r339-original250.test.mjs
      - name: Exactly one guarded official original603 selected URL
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '250'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r339
          DIC_ISSUE33_FOCUSED_CURRENT_ALTERNATE_URL: https://orleanscoffee.com/product/colombia-supremo-bucaramanga-coffee/
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict selected H1 HTML hash actual parser and Add Coffee afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r339
          DIC_R339_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R339_EVENT_SHA: ${{ github.sha }}
          DIC_R339_VERIFY: '1'
        run: node scripts/audit/issue33-r339-original250-check.mjs
      - name: Bounded public-only one-day source diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r339-original250
          path: /tmp/dic33-r339/
          retention-days: 1
          if-no-files-found: warn

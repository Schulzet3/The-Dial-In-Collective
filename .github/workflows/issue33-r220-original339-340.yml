name: DIC Issue33 R220 original339 340 current chosen public source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r220-original339-340.yml
      - tests/coffee-issue33-r220-original339-340.test.mjs
      - scripts/audit/issue33-r220-original339-340-check.mjs
      - docs/workstreams/ops-issue33-r220-339-340-20261115.md
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-selected-description-sensory.mjs
      - src/server/coffee-direct-product-prose.mjs
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-selected-offer-h2.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
      - tests/coffee-issue33-r217-workflow-dependencies.test.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r220-original339-340.yml
      - tests/coffee-issue33-r220-original339-340.test.mjs
      - scripts/audit/issue33-r220-original339-340-check.mjs
      - docs/workstreams/ops-issue33-r220-339-340-20261115.md
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-selected-description-sensory.mjs
      - src/server/coffee-direct-product-prose.mjs
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-selected-offer-h2.mjs
      - src/server/coffee-html-structure.mjs
      - src/server/coffee-url-guard.mjs
      - site/cloud/coffee-url-autofill.js
      - tests/coffee-issue33-r217-workflow-dependencies.test.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Chosen current-product parser positive and hostile contracts
        run: node --test tests/coffee-issue33-r220-original339-340.test.mjs
      - name: Validate existing selected-source event trigger dependencies
        run: node --test tests/coffee-issue33-r217-workflow-dependencies.test.mjs
      - name: Fetch guarded exact official product URLs and exercise Add Coffee
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '339,340'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r220
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently check exact-source hashes chosen identity and fields
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r220
          DIC_R220_EXACT_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r220-original339-340-check.mjs
      - name: Keep bounded current HTML and afterproof one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r220-original339-340
          path: /tmp/dic33-r220/
          retention-days: 1
          if-no-files-found: warn

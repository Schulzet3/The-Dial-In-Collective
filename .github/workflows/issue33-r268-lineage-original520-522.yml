name: DIC Issue33 R268 original520-522 exact Lineage selected sources
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r268-lineage-original520-522.yml
      - tests/coffee-issue33-r268-lineage-original520-522.test.mjs
      - scripts/audit/issue33-r268-lineage-original520-522-check.mjs
      - docs/workstreams/ops-issue33-r268-lineage-original520-522-20261117.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r268-lineage-original520-522.yml
      - tests/coffee-issue33-r268-lineage-original520-522.test.mjs
      - scripts/audit/issue33-r268-lineage-original520-522-check.mjs
      - docs/workstreams/ops-issue33-r268-lineage-original520-522-20261117.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Source identity and adversarial scoped tests
        run: node --test tests/coffee-issue33-r268-lineage-original520-522.test.mjs
      - name: Guarded bounded exact original selected seller HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '520,521,522'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r268
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Validate actual seller bytes, parser, Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r268
          DIC_R268_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R268_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r268-lineage-original520-522-check.mjs
      - name: One-day exact raw source artifacts for independent verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r268-original520-522-lineage
          path: /tmp/dic33-r268/
          retention-days: 1
          if-no-files-found: warn

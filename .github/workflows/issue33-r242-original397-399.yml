name: DIC Issue33 R242 original397-399 current Victus selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r242-original397-399.yml
      - tests/coffee-issue33-r242-original397-399.test.mjs
      - scripts/audit/issue33-r242-original397-399-check.mjs
      - docs/workstreams/ops-issue33-r242-397-399-victus-runtime-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r242-original397-399.yml
      - tests/coffee-issue33-r242-original397-399.test.mjs
      - scripts/audit/issue33-r242-original397-399-check.mjs
      - docs/workstreams/ops-issue33-r242-397-399-victus-runtime-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Independent selected source and hostile synthetic tests
        run: node --test tests/coffee-issue33-r242-original397-399.test.mjs
      - name: Guarded exact official HTTPS parser Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '397,398,399'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r242
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independent selected-product source hash and semantics
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r242
          DIC_R242_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r242-original397-399-check.mjs
      - name: Preserve bounded raw public evidence for one day
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r242-original397-399
          path: /tmp/dic33-r242/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R132 selected original108 official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r132-108.yml
      - scripts/audit/issue33-r132-108-check.mjs
      - tests/coffee-issue33-r132-108.test.mjs
      - docs/workstreams/ops-issue33-r132-108-20261112.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r132-108.yml
      - scripts/audit/issue33-r132-108-check.mjs
      - tests/coffee-issue33-r132-108.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Eight selected and adverse source-boundary tests
        run: node --test tests/coffee-issue33-r132-108.test.mjs
      - name: Guarded bounded exact current official HTTPS and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '108'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r132
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Source SHA, exact selected identity, semantic safety and original603 integrity
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r132
          DIC_ISSUE33_R132_VERIFY: '1'
        run: node scripts/audit/issue33-r132-108-check.mjs
      - name: Retain bounded source bytes and afterproof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r132-108-current-evidence
          path: /tmp/dic33-r132/
          retention-days: 1
          if-no-files-found: warn

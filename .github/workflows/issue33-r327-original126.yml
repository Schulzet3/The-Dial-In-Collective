name: DIC Issue33 R327 original603 #126 current Foster decaf method boundary
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r327-original126.yml
      - scripts/audit/issue33-r327-original126-check.mjs
      - tests/coffee-issue33-r327-original126.test.mjs
      - docs/workstreams/ops-issue33-r327-original126-20261119.md
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-decaffeination-method.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-processing-evidence.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r327-original126.yml
      - scripts/audit/issue33-r327-original126-check.mjs
      - tests/coffee-issue33-r327-original126.test.mjs
      - docs/workstreams/ops-issue33-r327-original126-20261119.md
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-decaffeination-method.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-processing-evidence.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  original126-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Nine focused original126 parser and negative source tests
        run: node --test tests/coffee-issue33-r327-original126.test.mjs
      - name: One guarded selected first-party public HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '126'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r327
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Fail closed source H1 raw SHA real parser UI separate green and decaf methods
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r327
          DIC_R327_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R327_EVENT_SHA: ${{ github.sha }}
          DIC_R327_VERIFY: '1'
        run: node scripts/audit/issue33-r327-original126-check.mjs
      - name: One-day original126 official product proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r327-original126
          path: /tmp/dic33-r327/
          retention-days: 1
          if-no-files-found: warn

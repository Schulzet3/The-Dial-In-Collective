name: DIC Issue33 R127 original selected 100
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r127-100.yml
      - scripts/audit/issue33-r127-100-check.mjs
      - tests/coffee-issue33-r127-100.test.mjs
      - docs/workstreams/ops-issue33-r127-100-20261111.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r127-100.yml
      - scripts/audit/issue33-r127-100-check.mjs
      - tests/coffee-issue33-r127-100.test.mjs
permissions:
  contents: read
jobs:
  selected-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Positive and hostile selected-source regressions
        run: node --test tests/coffee-issue33-r127-100.test.mjs
      - name: Guarded current official HTTPS and actual parser, Add Coffee and Source Review
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '100'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r127
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Source-bound chosen identity and actual extraction afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r127
          DIC_ISSUE33_R127_VERIFY: '1'
        run: node scripts/audit/issue33-r127-100-check.mjs
      - name: Preserve raw official source, evidence and proof for independent rehash
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r127-100-evidence
          path: /tmp/dic33-r127/
          retention-days: 1
          if-no-files-found: warn

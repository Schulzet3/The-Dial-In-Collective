name: DIC Issue33 R138 original118 exact selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r138-118.yml
      - scripts/audit/issue33-r138-118-check.mjs
      - tests/coffee-issue33-r138-118.test.mjs
      - docs/workstreams/ops-issue33-r138-118-20261112.md
      - src/server/coffee-blend-evidence.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r138-118.yml
      - scripts/audit/issue33-r138-118-check.mjs
      - tests/coffee-issue33-r138-118.test.mjs
      - src/server/coffee-blend-evidence.mjs
permissions:
  contents: read
jobs:
  exact-selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Exact blend and adversarial fixture tests
        run: node --test tests/coffee-issue33-r138-118.test.mjs
      - name: Guarded bounded official chosen coffee and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '118'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r138
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Strict exact SHA, raw HTML, changed selected blend and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r138
          DIC_ISSUE33_R138_VERIFY: '1'
        run: node scripts/audit/issue33-r138-118-check.mjs
      - name: Retain source-bound proof and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r138-original118-current
          path: /tmp/dic33-r138/
          retention-days: 2
          if-no-files-found: warn

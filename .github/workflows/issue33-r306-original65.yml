name: DIC Issue33 R306 original603 Night Vision Kenya selected source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r306-original65.test.mjs
      - scripts/audit/issue33-r306-original65-check.mjs
      - .github/workflows/issue33-r306-original65.yml
      - docs/workstreams/ops-issue33-r306-original65-20261118.md
  push:
    branches: [development/backend-foundation]
    paths:
      - tests/coffee-issue33-r306-original65.test.mjs
      - scripts/audit/issue33-r306-original65-check.mjs
      - .github/workflows/issue33-r306-original65.yml
      - docs/workstreams/ops-issue33-r306-original65-20261118.md
permissions:
  contents: read
jobs:
  selected-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Five focused selected-positive and adversarial identity/field checks
        run: node --test tests/coffee-issue33-r306-original65.test.mjs
      - name: One guarded exact ORIGINAL selected official public HTTPS
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '65'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r306
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Fail-closed current selected raw H1, parser, Add Coffee and Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r306
          DIC_R306_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIC_R306_EVENT_SHA: ${{ github.sha }}
        run: node scripts/audit/issue33-r306-original65-check.mjs
      - name: One-day public selected source diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r306-original65
          path: /tmp/dic33-r306/
          retention-days: 1
          if-no-files-found: warn

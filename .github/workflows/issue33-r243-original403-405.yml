name: DIC Issue33 R243 original403-405 current Wake selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r243-original403-405.yml
      - tests/coffee-issue33-r243-original403-405.test.mjs
      - scripts/audit/issue33-r243-original403-405-check.mjs
      - docs/workstreams/ops-issue33-r243-403-405-wake-runtime-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-product-prose.mjs
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-selected-broad-blend-regions.mjs
      - src/server/coffee-decaffeination-method.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r243-original403-405.yml
      - tests/coffee-issue33-r243-original403-405.test.mjs
      - scripts/audit/issue33-r243-original403-405-check.mjs
      - docs/workstreams/ops-issue33-r243-403-405-wake-runtime-20261116.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-product-scope.mjs
      - src/server/coffee-product-prose.mjs
      - src/server/coffee-direct-product-prose.mjs
      - src/server/coffee-selected-broad-blend-regions.mjs
      - src/server/coffee-decaffeination-method.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected synthetic and adversarial tests
        run: node --test tests/coffee-issue33-r243-original403-405.test.mjs
      - name: Guarded public official HTTPS actual parser Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '403,404,405'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r243
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Independently reparse raw selected source and compare hashes
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r243
          DIC_R243_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r243-original403-405-check.mjs
      - name: Preserve one-day bounded raw source receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r243-original403-405
          path: /tmp/dic33-r243/
          retention-days: 1
          if-no-files-found: warn

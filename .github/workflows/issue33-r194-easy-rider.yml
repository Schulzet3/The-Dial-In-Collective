name: DIC Issue33 R194 Ridley original281
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r194-easy-rider.yml
      - scripts/audit/issue33-r194-easy-rider-check.mjs
      - tests/coffee-issue33-r194-easy-rider.test.mjs
      - docs/workstreams/ops-issue33-r194-easy-rider-281-20261114.md
      - src/server/coffee-page-metadata.mjs
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r194-easy-rider.yml
      - scripts/audit/issue33-r194-easy-rider-check.mjs
      - tests/coffee-issue33-r194-easy-rider.test.mjs
      - src/server/coffee-page-metadata.mjs
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Original selected positive and hostile tests
        run: node --test tests/coffee-issue33-r194-easy-rider.test.mjs
      - name: Guarded original current public HTTPS and actual parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '281'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r194
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Raw current source exact identity and parser afterproof
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r194
        run: node scripts/audit/issue33-r194-easy-rider-check.mjs
      - name: Retain one-day public current HTML and parser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r194-ridley-original281
          path: /tmp/dic33-r194/
          retention-days: 1
          if-no-files-found: warn

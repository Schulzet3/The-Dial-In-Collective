name: DIC Issue33 R236 original389-390 current Topeca selected official source
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r236-original389-390.yml
      - tests/coffee-issue33-r236-original389-390.test.mjs
      - scripts/audit/issue33-r236-original389-390-check.mjs
      - docs/workstreams/ops-issue33-r236-389-390-topeca-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-focused-source-acceptance.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - site/cloud/coffee-url-autofill.js
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r236-original389-390.yml
      - tests/coffee-issue33-r236-original389-390.test.mjs
      - scripts/audit/issue33-r236-original389-390-check.mjs
      - docs/workstreams/ops-issue33-r236-389-390-topeca-20261115.md
      - scripts/audit/issue33-original603-focused-source-review.mjs
      - scripts/audit/issue33-focused-source-acceptance.mjs
      - src/server/coffee-url-guard.mjs
      - src/server/coffee-page-metadata.mjs
      - src/server/coffee-product-scope.mjs
      - scripts/audit/issue33-selected-product-heading.mjs
      - site/cloud/coffee-url-autofill.js
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Selected source positive and hostile contracts
        run: node --test tests/coffee-issue33-r236-original389-390.test.mjs
      - name: Guarded original current official HTTPS, parser and Add Coffee Source Review
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '389,390'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r236
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Verify exact selected source hashes and semantic roles
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r236
          DIC_R236_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/audit/issue33-r236-original389-390-check.mjs
      - name: Save bounded one-day evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r236-original389-390
          path: /tmp/dic33-r236/
          retention-days: 1
          if-no-files-found: warn

name: DIC Issue33 R91 original603 #418 #421 #424 exact selected sources
on:
  pull_request:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r91-418-421-424.yml
      - scripts/audit/issue33-r91-418-421-424-check.mjs
      - tests/coffee-issue33-r91-418-421-424.test.mjs
      - docs/workstreams/ops-issue33-r91-418-421-424-20261110.md
  push:
    branches: [development/backend-foundation]
    paths:
      - .github/workflows/issue33-r91-418-421-424.yml
      - scripts/audit/issue33-r91-418-421-424-check.mjs
      - tests/coffee-issue33-r91-418-421-424.test.mjs
permissions:
  contents: read
jobs:
  current-selected-r91:
    name: original603-418-421-424-current-official
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Focused source and adversarial contracts
        run: node --test tests/coffee-issue33-r91-418-421-424.test.mjs
      - name: Bounded fresh guarded public HTTPS and actual Add Coffee parser
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_NUMBERS: '418,421,424'
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r91-selected
        run: node scripts/audit/issue33-original603-focused-source-review.mjs
      - name: Exact source SHA, current selected proof and no false cross-product data
        if: always()
        env:
          DIC_ISSUE33_FOCUSED_PUBLIC_DIR: /tmp/dic33-r91-selected
          DIC_ISSUE33_R91_VERIFY: '1'
        run: node scripts/audit/issue33-r91-418-421-424-check.mjs
      - name: Short-lived public source/afterproof artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dic33-r91-418-421-424
          path: /tmp/dic33-r91-selected/
          retention-days: 1
          if-no-files-found: warn

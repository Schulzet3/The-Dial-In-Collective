name: DIC weekly comprehensive regression
# 08:00 UTC every Sunday = 01:00 fixed MST, 02:00 MDT.
on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dic-weekly-comprehensive-regression
  cancel-in-progress: false
jobs:
  node-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development/backend-foundation
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build:cloud
        env:
          SUPABASE_URL: https://azviqqejypsefzilgonr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_weekly_placeholder
      - run: node scripts/audit/site-integrity.mjs --dist
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development/backend-foundation
          persist-credentials: false
      - run: node scripts/audit/verify-migration-baseline.mjs
      - run: bash scripts/audit/isolated-sql-regression.sh
      - run: bash scripts/audit/isolated-signed-http-regression.sh
      - run: bash scripts/audit/isolated-backup-snapshot-regression.sh
  mobile-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development/backend-foundation
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - run: python tests/browser/cloud_owner_qa.py
      - run: python tests/browser/admin_invitation_qa.py
      - run: python tests/browser/pwa_offline_qa.py
